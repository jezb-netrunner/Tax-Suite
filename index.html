evocable for the taxable year."},rv={value:{carryOverYears:3,pandemicLossYears:[2020,2021],pandemicCarryOverYears:5},legalBasis:["NIRC Sec 34(D)(3)","RR 14-2001 (NOLCO is deductible on the quarterly and the annual returns; not against MCIT gross income)","RR 16-2008 (not claimable while on OSD; the 3 years still run)","RA 11494 (losses incurred in 2020 and 2021: 5 years)"],confidence:"needs_review",notes:"A net operating loss of the business (itemized deductions above gross income) is carried over as a deduction from business income for the next 3 years, only in years the taxpayer itemizes; it cannot be used while on the OSD or the 8% option, and those years still count toward the 3. The estimator applies prior-year NOLCO to the itemized option only and never against compensation income (owner decision 16; whether a mixed-income earner's business loss may reduce compensation was not confirmed from a primary source, REVIEW.md 4.2). The corporate estimator applies the same rule: itemized deductions only, against taxable income, never against the MCIT (which is on gross income), on the annual view and on the quarterly (1702Q) view alike, since RR 14-2001 allows NOLCO as a deduction on the quarterly and the annual returns. The 5-year period for 2020 and 2021 losses (RA 11494) is shown as 'check with your CPA'."},av={value:{unit:"peso",method:"49 centavos or less drop, 50 or more round up, per form line"},legalBasis:['BIR Forms 1700, 1701, 1701A and 1701Q (January 2018): "DO NOT enter Centavos; 49 Centavos or Less drop down; 50 or more round up"',"BIR Form 1702-RT (January 2018), same instruction"],confidence:"verified",notes:"Every amount on an income tax return is a whole peso. The estimators round each line (gross, deduction, taxable income, tax due, percentage tax, credits) and add the rounded lines for totals, so the figures match what goes on the form (re-checked Oct 7, 2026; REVIEW.md rules table 2.1)."},ov={value:9e4,legalBasis:["NIRC Sec 32(B)(7)(e), as amended by RA 10963"],confidence:"verified",notes:"13th month pay and other benefits excluded from gross income up to ₱90,000 per year, unchanged through 2026 (excess de minimis counts toward this cap). Watch: a House committee proposal would raise it to ₱120,000 alongside the TY2027 bracket package; not enacted as of November 12, 2026."},iv={value:{secondInstallmentDue:"October 15"},legalBasis:["NIRC Sec 56(A)(2), as amended by RA 10963"],confidence:"verified",notes:"When annual income tax due exceeds ₱2,000, individuals may pay in two equal installments: at filing, and on or before October 15."},sv={value:3e6,legalBasis:["NIRC Sec 232, as amended by RA 10963 (TRAIN)","RR 8-2018 (8% filers keep books but need no audited FS)","NIRC Sec 34(L) (OSD filers need not submit FS)"],confidence:"verified",notes:"Books audited by an independent CPA required when gross annual sales exceed ₱3,000,000, a threshold TRAIN set in 2018, replacing the old ₱150,000-per-quarter trigger; the ₱3M audit line has stood unchanged since, though EOPT layered simplified bookkeeping rules for micro and small taxpayers on top. Individuals validly on the 8% option or claiming the OSD are not required to submit audited FS; confirm applicability with your CPA."},ze={$comment:Zx,graduatedBrackets:ev,eightPercent:tv,osd:nv,netOperatingLossCarryOver:rv,returnLineRounding:av,thirteenthMonthExclusionCap:ov,annualITRInstallment:iv,afsRequiredAboveGross:sv},lv="VAT and percentage tax parameters.",cv={value:.12,legalBasis:["NIRC Sec 106/108, as amended"],confidence:"verified",notes:""},dv={value:3e6,legalBasis:["NIRC Sec 109(CC) & 236(G), as amended by RA 10963 (TRAIN)","RA 11976 (EOPT) & RR 3-2024; subject to 3-year CPI adjustment"],confidence:"verified",notes:"₱3,000,000 gross annual sales (post-EOPT: 'gross sales', accrual), reconfirmed Aug 26, 2026; no adjustment RR has issued. The first EOPT-cycle CPI adjustment falls due around January 2027; re-check then; the 8% ceiling and percentage-tax boundary ride on it. Don't confuse this with the separate ₱3.6M VAT-exempt ceiling for residential dwellings (Sec 109(P), RR 1-2024) that some guides conflate with it."},uv={value:.03,legalBasis:["NIRC Sec 116, as amended by RA 11534 (CREATE); 1% from Jul 1 2020 to Jun 30 2023, 3% thereafter"],confidence:"verified",notes:"3% of gross quarterly sales/receipts for non-VAT taxpayers under the threshold, unless the 8% option is elected."},hv={value:"Update your registration to VAT (BIR Form 1905) within the month after the month your sales passed ₱3M",legalBasis:["NIRC Sec 236(G)(1)","RR 8-2018 (a taxpayer who exceeds the threshold during the year updates the registration within the month following the month the threshold was exceeded)"],confidence:"verified",notes:"Once past the threshold you are liable for output VAT whether or not you register on time; percentage tax applies up to then. Confirmed November 12, 2026 from the RR 8-2018 text as quoted in firm summaries. The exact day VAT starts (the app uses the first day of the following month) is not separately confirmed."},fv={value:"Since EOPT, VAT and percentage tax on services are computed on gross SALES (billed/accrued), no longer on collections",legalBasis:["RA 11976 (EOPT)","RR 3-2024 (effective Apr 27, 2024)","RMC 65-2024 (output-VAT credit mechanics)"],confidence:"verified",notes:"Output VAT on receivables that stay uncollected past the agreed credit term may be deducted from the NEXT quarter's output VAT under the Sec 110(D) conditions (post-Apr 27, 2024 credit sale, written credit term, VAT shown and paid, not claimed as bad debt), and added back if later collected. Pre-Apr 27, 2024 receivables stay on the collection basis."},pv={value:"Quarterly only: BIR Form 2550Q within 25 days after each taxable quarter; the monthly 2550M is no longer required, though optional monthly filing for the first two months of a quarter remains allowed",legalBasis:["NIRC Sec 114(A), as amended by RA 10963 (quarterly from Jan 1, 2023)","RMC 5-2023 (transition)","RMC 52-2023 (optional 2550M: no deadline, no penalty, no open cases)"],confidence:"verified",notes:"Under EOPT (RR 4-2024) returns may be filed and taxes paid anywhere, electronically or at any AAB/RDO, and the old 25% wrong-venue surcharge is gone."},mv={value:"12% VAT applies to digital services consumed in the Philippines, including those of nonresident providers; for B2B purchases the Philippine business buyer, whether VAT-registered or not, must withhold and remit the VAT itself (reverse charge) via BIR Form 1600-VT",legalBasis:["RA 12023 (VAT on Digital Services, Oct 2024)","RR 3-2025 (liability from June 2, 2025)","RMC 47-2025 (the business buyer, VAT-registered or not, files Form 1600-VT; clarifications)","RMC 59-2026 (exempt-services registration)"],confidence:"verified",notes:"Hits any business buying ads, SaaS, cloud hosting, or marketplace services from nonresident platforms: withhold 12%, remit on Form 1600-VT by the 10th of the following month, and (if VAT-registered) claim it back as input VAT supported by the 1600-VT. Nonresident providers handle B2C sales themselves via the VDS portal (Form 2550-DS). Local digital sellers stay under the ordinary VAT/percentage-tax rules and the ₱3M threshold."},yv={value:500,legalBasis:["NIRC Sec 237, as amended by RA 11976 (EOPT)","RR 7-2024, as amended by RR 11-2024 and RR 6-2026","RMC 77-2024","RMC 112-2026"],confidence:"verified",notes:"An invoice must issue for every sale of ₱500 or more; VAT-registered sellers issue one regardless of amount, and any seller must on the buyer's request. Non-VAT sellers issue one aggregated end-of-day invoice for the day's sub-₱500 sales once they reach ₱500. Adjusted for CPI every 3 years from EOPT effectivity; first adjustment expected ~Jan 2027 alongside the ₱3M threshold review. Since Oct 16, 2026 (RR 6-2026, per firm alerts), an invoice for a sale subject to creditable withholding tax must show the withholding amount as a separate item; old printed invoices stay usable until exhausted if stamped 'Less: Withholding Tax' (RMC 112-2026 clarifies the presentation and gave more time for system changes)."},nn={$comment:lv,vatRate:cv,vatThreshold:dv,percentageTaxRate:uv,vatRegistrationDeadline:hv,servicesAccrualBasis:fv,vatFilingFrequency:pv,digitalServicesVat:mv,invoiceIssuanceThreshold:yv},gv="Domestic corporation income tax parameters (CREATE / CREATE MORE era).",xv={value:{standardRate:.25,smallCorpRate:.2,smallCorpTaxableIncomeCeiling:5e6,smallCorpAssetCeiling:1e8},legalBasis:["NIRC Sec 27(A), as amended by RA 11534 (CREATE) and RA 12066 (CREATE MORE)","RR 7-2025 (EDR implementation)"],confidence:"verified",notes:"20% applies when net taxable income ≤ ₱5M AND total assets ≤ ₱100M (excluding the land where the business sits); both conditions must hold. CREATE MORE (RA 12066, effective Nov 28, 2024) also gives 20% to registered business enterprises under the enhanced-deduction regime, but only on income from registered projects/activities; non-registered income stays at the regular rate, and EDR RBEs remain subject to the MCIT comparison."},vv={value:{rate:.02,currentRatesFrom:"2023-07-01",startsInTaxableYear:4,excessCarryForwardYears:3},legalBasis:["NIRC Sec 27(E), as amended","RR 9-98 (the year operations commence is the year of registration with the BIR; the reckoning point for fiscal-year firms is the same calendar year)","RR 12-2007 (quarterly MCIT on cumulative gross income)","RA 11534 (CREATE); 1% Jul 1 2020–Jun 30 2023, 2% thereafter","RMC 69-2023 (MCIT back to 2% from Jul 1, 2023)","RMC 36-2024 (computation for taxable years straddling Jul 1, 2023)"],confidence:"verified",notes:"startsInTaxableYear 4 means MCIT applies from the 4th taxable year immediately following the year of registration with the BIR (a corporation registered in 2020 first pays MCIT for 2024). Fiscal-year corporations count from the same calendar year: MCIT applies to the whole fiscal year ending in the fourth calendar year after the year of BIR registration, whatever the month of registration (RR 9-98: a firm registered on July 1, 1998 is subject to MCIT for the entire fiscal year ending in 2002). Pay the higher of RCIT and MCIT (2% of gross income) from the fourth taxable year after the year the corporation registered with the BIR (RR 9-98), not the year of its first sale. When the profile has no registration year, the estimator shows both RCIT and MCIT with a warning. Excess MCIT over RCIT credits against RCIT for the next three years. The corporate estimator covers the current and the previous taxable year only (the default is the year whose annual return is due next, by the Manila date and the fiscal year); periods that start before Jul 1, 2023 are not supported, because MCIT and percentage tax were 1% from Jul 2020 to Jun 2023."},wv={value:"Corporations may adopt a fiscal year; individuals must use the calendar year",legalBasis:["NIRC Secs 43 & 52(B)","NIRC Sec 47 (change of period needs prior CIR approval)"],confidence:"verified",notes:"Quarterly returns fall 60 days after each of the first three quarters of the taxable year (no fourth quarterly return); the annual return falls on the 15th day of the 4th month after fiscal year-end."},bv={value:{rate:.4,basis:"gross income"},legalBasis:["NIRC Sec 34(L), as amended by RA 9504","RR 16-2008"],confidence:"verified",notes:"Corporations compute OSD on gross income (after cost of sales), unlike individuals who use gross sales/receipts. The election is signified on the first-quarter return and is irrevocable for the year, and unlike individuals, a corporation on OSD still submits financial statements with the annual return. The corporate estimator offers it as the 'Deductions' choice (OSD line rounded to whole pesos)."},Sv={value:{creditedAgainst:"regular corporate income tax only, in a year when the regular tax is the tax due",order:"oldest first",cap:"the regular tax"},legalBasis:["NIRC Sec 27(E)(2)","RR 9-98","RR 12-2007 (quarterly returns)"],confidence:"needs_review",notes:"Excess of MCIT over the regular tax is carried forward and credited against the regular tax of the next 3 taxable years (the number of years is mcit.excessCarryForwardYears), never against the MCIT. The estimator credits unexpired amounts oldest first, only when the regular tax is the tax due, up to the full regular tax, on the annual and the quarterly view. Whether the credit may bring the amount payable below that year's MCIT is not confirmed; check with a CPA."},Rv={value:"Repealed",legalBasis:["RA 11534 (CREATE) Sec 8, repealing NIRC Sec 29","RR 5-2021","RMC 62-2021"],confidence:"verified",notes:"No IAET is due for any taxable year ending after April 11, 2021. The SEC-side restraint survives: RCC Sec 42 still limits retained surplus beyond 100% of paid-in capital."},rn={$comment:gv,rcit:xv,mcit:vv,fiscalYear:wv,osdCorporate:bv,excessMcitCredit:Sv,improperlyAccumulatedEarningsTax:Rv},Tv="Civil penalties for late filing/payment + EOPT taxpayer classification.",Cv={value:{standard:.25,willfulNeglect:.5,microSmall:.1,microSmallFrom:"2024-01-22",substantialUnderdeclaration:.3},legalBasis:["NIRC Sec 248","RA 11976 (EOPT); reduced 10% surcharge for micro & small taxpayers","RR 6-2024"],confidence:"verified",notes:"The reduced 10% applies to micro & small taxpayers for returns due on or after Jan 22, 2024, when EOPT took effect (it is not retroactive); returns due earlier keep 25%. EOPT also removed the 25% surcharge for filing at the wrong venue. The 50% surcharge covers willful neglect to file AND willfully false/fraudulent returns (underdeclaring sales by more than 30% or overstating deductions by more than 30% is prima facie fraud: substantialUnderdeclaration, NIRC Sec 248(B)) and is NOT reduced for micro/small taxpayers (only the 25% drops to 10%). The 25% also applies to unpaid deficiency assessments and partial payments, not just late returns."},jv={value:{standardAnnualRate:.12,standardFrom:"2018-01-01",priorAnnualRate:.2,microSmallAnnualRate:.06,microSmallFrom:"2024-01-22"},legalBasis:["NIRC Sec 249, as amended by RA 10963 (double the BSP legal rate of 6%)","NIRC Sec 249 before RA 10963 (20% a year, for days before Jan 1, 2018)","RR 21-2018","NIRC Sec 249(A), as amended by RA 10963 (proviso: no simultaneous deficiency and delinquency interest)","RA 11976 (EOPT); 50% of the rate for micro & small taxpayers"],confidence:"verified",notes:"12% per annum confirmed current as of October 7, 2026 and re-checked November 8, 2026 with no change found (in force since TRAIN, Jan 1, 2018); days before Jan 1, 2018 are charged at the old 20%, so a period that spans that date is split. Micro & small taxpayers pay 6% on returns due on or after Jan 22, 2024 (EOPT is not retroactive). Deficiency and delinquency interest never run simultaneously."},kv={value:{daysInYear:365,startsAfter:"rolledDueDate",convention:"simple interest, actual days / 365"},legalBasis:["NIRC Sec 249(A) (interest runs from the date prescribed for payment until full payment)","RR 21-2018","RMC 65-2016 (a deadline on a weekend or holiday moves to the next working day)"],confidence:"needs_review",notes:"Interest counts each day from the day after the due date through the payment date. When the due date falls on a weekend or holiday it first moves to the next working day, and interest counts from the day after that working day (RMC 65-2016). Days are divided by 365, also in leap years: this is a default not yet confirmed against the RR 21-2018 illustrations or eBIRForms (on a 366-day basis, a year late across Feb 29 gives ₱12,000.00 instead of ₱12,032.88 per ₱100,000 at 12%). When the rate changes during the period (20% to 12% on Jan 1, 2018), each part is computed and rounded to the centavo separately and the parts are added."},Ev={value:{reducedRatesBasis:"rolledDueDate",taxDueBeforeStillUnpaid:"dueDateRatesForWholePeriod"},legalBasis:["RA 11976 (EOPT), effective Jan 22, 2024 (prospective)","RR 6-2024 (effective Apr 27, 2024)"],confidence:"needs_review",notes:"Micro & small taxpayers get the 10% surcharge and 6% interest only for returns due on or after Jan 22, 2024 (the due date after moving off a weekend or holiday). Default not yet confirmed: tax that fell due before Jan 22, 2024 and is still unpaid after it keeps the rates in force on its due date (25% surcharge, 12% interest) for the whole period, with no switch to 6%. Also unconfirmed: whether returns due between Jan 22 and Apr 26, 2024 (before RR 6-2024 took effect) get the reduced rates; the calculator gives them."},Nv={value:[{taxDueUpTo:5e3,amount:1e3},{taxDueUpTo:1e4,amount:3e3},{taxDueUpTo:2e4,amount:5e3},{taxDueUpTo:5e4,amount:1e4},{taxDueUpTo:1e5,amount:15e3},{taxDueUpTo:5e5,amount:2e4},{taxDueUpTo:1e6,amount:3e4},{taxDueUpTo:5e6,amount:4e4},{taxDueUpTo:null,amount:5e4}],legalBasis:["RMO 7-2015 Annex A (failure to file/pay, NIRC Sec 255), confirmed still the operative schedule as of Aug 2026, superseding RMO 19-2007","RR 6-2024: the 50% compromise reduction for micro & small taxpayers covers only invoicing violations (NIRC Secs 113, 237 and 238) not involving fraud, so it does not apply to late filing or payment"],confidence:"verified",notes:"Compromise penalties are settlements in lieu of criminal prosecution and are consensual/negotiable; the schedule is the BIR's standard ask. The schedule follows RMO 7-2015 Annex A and is the same for every taxpayer size: late filing or payment is a Sec 255 violation, which the EOPT 50% reduction does not cover. A tax due of ₱0 (nil return filed late) falls in the first tier (₱1,000). The schedule covers only violations that do not involve fraud: for a willfully false or fraudulent return (50% surcharge) the calculator shows the compromise as not on the standard schedule, since such a case may be referred for prosecution instead. Still worth a CPA's eye before quoting a client."},Av={value:{micro:{grossSalesBelow:3e6},small:{grossSalesFrom:3e6,grossSalesBelow:2e7},medium:{grossSalesFrom:2e7,grossSalesBelow:1e9},large:{grossSalesFrom:1e9}},legalBasis:["RA 11976 (EOPT)","RR 8-2024"],confidence:"verified",notes:"Classification is by gross sales (business income only); micro & small taxpayers get the reduced surcharge/interest, halved Sec 250 penalties, and 50% off the compromise penalty for invoicing violations only (Secs 113, 237 and 238, not involving fraud). The compromise for late filing or payment (Sec 255) is not reduced. The classification is independent of Top Withholding Agent designation; a 'small' taxpayer can still be a TWA."},Iv={value:{standardPerFailure:1e3,standardAnnualCap:25e3,microSmallPerFailure:500,microSmallAnnualCap:12500},legalBasis:["NIRC Sec 250","RA 11976 (EOPT) & RR 6-2024 (halved amounts for micro & small taxpayers)"],confidence:"verified",notes:"₱1,000 for EACH failure to file an information return, statement, list, or required attachment (SAWT, SLSP, QAP, alphalists, eAFS uploads), capped at ₱25,000 aggregate per calendar year (₱500 per failure / ₱12,500 cap for micro & small taxpayers). The amounts are per failure, not a flat cap. Late attachments don't make a timely-filed return late; the exposure is this penalty plus credit-disallowance and deemed-not-filed risks."},Mt={$comment:Tv,surcharge:Cv,interest:jv,interestDayCount:kv,eoptTransition:Ev,compromiseTiers:Nv,classification:Av,infoReturnPenalty:Iv},Pv="SSS / PhilHealth / Pag-IBIG contribution parameters. These change on statutory schedules; reconcile each block against the current circulars when updating.",Mv={value:{totalRate:.15,employerRate:.1,employeeRate:.05,mscFloor:5e3,mscCeiling:35e3,mscStep:500,wispThreshold:2e4,ec:[{mscBelow:15e3,amount:10},{mscBelow:null,amount:30}],selfEmployedRate:.15,compensationBase:"basic pay plus regular allowances, commissions and other regular pay (all actual remuneration), capped by the ₱35,000 MSC; one-time or liquidated items excluded"},legalBasis:["RA 11199 (Social Security Act of 2018) Sec 4; 15% is the final scheduled step, in force since 2025","RA 11199 Sec 8(f) and its IRR (compensation: all actual remuneration, including the mandated cost of living allowance)","SSS Circular 2024-006 (employers) and companions 2024-007/008/009/010; the 2025 schedule, still operative for 2026"],confidence:"verified",notes:"Re-verified Aug 26, 2026: no 2026 circular supersedes the 2025 schedule and no law suspends the 15%: employer 10% / employee 5%; MSC ₱5,000–₱35,000 in ₱500 steps; the portion above ₱20,000 funds the Mandatory Provident Fund (WISP/MPF). Self-employed, voluntary, and OFW members pay the full 15% themselves (voluntary members have no EC premium). Employer-paid EC: ₱10 below ₱15,000 MSC, ₱30 at or above, confirmed against the 2025 SSS table."},Fv={value:{rate:.05,incomeFloor:1e4,incomeCeiling:1e5,employerShare:.5,employeeShare:.5},legalBasis:["RA 11223 (Universal Health Care Act) Sec 10; 5% final scheduled rate","PhilHealth Circular 2019-0009 (premium schedule)","PhilHealth Advisory 2026-0042 (5% for CY2026 direct contributors; the 2025 reduction proposals did not materialize)"],confidence:"verified",notes:"Re-verified Aug 26, 2026: 5% of monthly basic salary for CY2026, floor ₱10,000 / ceiling ₱100,000 (premium ₱500–₱5,000), split equally between employer and employee. Self-employed direct contributors pay the full 5% of declared income."},Ov={value:{employeeShare:"premium ÷ 2, rounded half-up to the centavo",employerShare:"premium − employee share"},legalBasis:["Owner default, Oct 7, 2026 (REVIEW.md 4.3): no PhilHealth rule on the odd centavo was found"],confidence:"needs_review",notes:"When 5% of the salary ends in an odd centavo the two halves cannot be equal. The app gives the employee half rounded half-up to the centavo and the employer the rest, so the shares always add up to the premium (₱10,001 salary: premium ₱500.05 = ₱250.03 employee + ₱250.02 employer). Confirm with PhilHealth which share absorbs the centavo."},Dv={value:{employeeRateLow:.01,employeeRateLowThreshold:1500,employeeRate:.02,employerRate:.02,maxFundSalary:1e4},legalBasis:["RA 9679 (HDMF Law)","HDMF Circular 460; maximum fund salary ₱10,000 effective Feb 2024, still governing in 2026"],confidence:"verified",notes:"Re-verified Aug 26, 2026: employees earning ≤₱1,500/month contribute 1%, otherwise 2%; employers always 2%; both computed on a fund salary capped at ₱10,000 (max ₱200 + ₱200 = ₱400). Self-employed members contribute on the same schedule based on declared income, shouldering both shares."},Bv={value:"monthly compensation: basic pay plus regular allowances and commissions (one-time or liquidated items excluded), before the ₱10,000 fund-salary cap",legalBasis:["RA 9679 (HDMF Law)","HDMF Circular 460","Owner default, Oct 7, 2026 (REVIEW.md C05): which pay items count is not confirmed"],confidence:"needs_review",notes:"The employee and employer calculators compute Pag-IBIG on the same monthly compensation as SSS (basic pay plus regular allowances and commissions), capped at ₱10,000. Because of the cap this only changes the result for pay of ₱10,000 a month or less (and the 1% / 2% split at ₱1,500). Confirm with Pag-IBIG which pay items count."},oa={$comment:Pv,sss:Mv,philhealth:Fv,philhealthShareRounding:Ov,pagibig:Dv,pagibigCompensationBase:Bv},$v="Withholding tax on compensation tables effective Jan 1, 2023 (RR 11-2018 as amended; BIR revised withholding tax tables). Each bracket: floor (compensation exceeds), base tax, rate on excess over floor.",_v={value:{daily:[{over:0,base:0,rate:0},{over:685,base:0,rate:.15},{over:1096,base:61.65,rate:.2},{over:2192,base:280.85,rate:.25},{over:5479,base:1102.6,rate:.3},{over:21918,base:6034.3,rate:.35}],weekly:[{over:0,base:0,rate:0},{over:4808,base:0,rate:.15},{over:7692,base:432.6,rate:.2},{over:15385,base:1971.2,rate:.25},{over:38462,base:7740.45,rate:.3},{over:153846,base:42355.65,rate:.35}],semiMonthly:[{over:0,base:0,rate:0},{over:10417,base:0,rate:.15},{over:16667,base:937.5,rate:.2},{over:33333,base:4270.7,rate:.25},{over:83333,base:16770.7,rate:.3},{over:333333,base:91770.7,rate:.35}],monthly:[{over:0,base:0,rate:0},{over:20833,base:0,rate:.15},{over:33333,base:1875,rate:.2},{over:66667,base:8541.8,rate:.25},{over:166667,base:33541.8,rate:.3},{over:666667,base:183541.8,rate:.35}]},legalBasis:["RR 11-2018 Annex E (Revised Withholding Tax Table effective Jan 1, 2023)","NIRC Sec 24(A)(2)(a) & Sec 79, as amended by RA 10963"],confidence:"verified",notes:"Confirmed unchanged through Aug 2026 (no 2024-2026 issuance revised Annex E) and matched against multiple independent sources, including a worked example (₱50,000/mo → ₱1,875 + 20% × ₱16,667 = ₱5,208.40). Withholding applies to taxable compensation after mandatory SSS/PhilHealth/Pag-IBIG employee shares and non-taxable benefits. Pending House/Senate bracket bills would change these tables if enacted (TY2027 earliest)."},Lv={value:"2023-01-01",legalBasis:["RR 11-2018 Annex E (Revised Withholding Tax Table effective Jan 1, 2023)"],confidence:"verified",notes:'The date the withholding tables above took effect. The Employee and Payroll results cite it ("Revised withholding table effective 2023").'},Wv={value:{effectiveFrom:"2026-01-06",items:[{benefit:"Monetized unused vacation leave (private sector)",ceiling:"12 days per year"},{benefit:"Medical cash allowance to dependents",ceiling:"₱2,000 per semester (₱333/month)"},{benefit:"Rice subsidy",ceiling:"₱2,500 per month (or one 50kg sack)"},{benefit:"Uniform & clothing allowance",ceiling:"₱8,000 per year"},{benefit:"Actual medical assistance",ceiling:"₱12,000 per year"},{benefit:"Laundry allowance",ceiling:"₱400 per month"},{benefit:"Employee achievement awards (cash/GC allowed since RR 4-2025)",ceiling:"₱12,000 per year"},{benefit:"Christmas / anniversary gifts",ceiling:"₱6,000 per year"},{benefit:"OT / night-shift meal allowance",ceiling:"30% of regional basic minimum wage per day"},{benefit:"CBA & productivity incentives (combined)",ceiling:"₱12,000 per year"},{benefit:"Monetized vacation & sick leave (government employees)",ceiling:"No ceiling"}]},legalBasis:["RR 29-2025 (effective Jan 6, 2026), amending RR 2-98 Sec 2.78.1(A)(3)","RR 4-2025 (effective Feb 14, 2025: uniform allowance to ₱7,000; cash/GC achievement awards allowed)","RR 11-2018 (earlier ceilings)"],confidence:"verified",notes:"RR 29-2025 raised EVERY capped item effective Jan 6, 2026: VL monetization 10→12 days, dependents' medical cash ₱1,500→₱2,000/semester, rice ₱2,000→₱2,500, uniforms ₱7,000→₱8,000 (RR 4-2025 had taken it ₱6,000→₱7,000 in Feb 2025), actual medical ₱10,000→₱12,000, laundry ₱300→₱400, awards ₱10,000→₱12,000 (cash/GC allowed since RR 4-2025), gifts ₱5,000→₱6,000, meal allowance 25%→30%, CBA/productivity ₱10,000→₱12,000. Apply the old ceilings to pre-2026 payroll periods. Amounts within ceilings are tax-free; the excess counts toward the ₱90,000 other-benefits cap."},zv={value:{region:"NCR",order:"Wage Order No. NCR-28",dailyNonAgriculture:755,dailyAgricultureAndSmall:718,agricultureAndSmallCovers:"agriculture, retail/service with 15 or fewer workers and manufacturing with fewer than 10 workers",effective:"2026-09-26",history:[{order:"NCR-26",dailyNonAgriculture:695,dailyAgricultureAndSmall:658,effective:"2025-07-18"},{order:"NCR-27",dailyNonAgriculture:755,wouldHaveTakenEffect:"2026-07-25",secondTranche:780,secondTrancheDate:"2027-01-20",status:"implementation enjoined by the Pasig RTC (status quo ante Jul 24, TRO Jul 30, preliminary injunction Aug 13, 2026; injunction maintained as reported Oct 21, 2026; a Supreme Court petition is pending)"}]},legalBasis:["Wage Order No. NCR-28 (₱755 non-agriculture; ₱718 agriculture, retail/service with 15 or fewer workers and manufacturing with fewer than 10 workers; effective Sept 26, 2026)","History: Wage Order NCR-26 (₱695 / ₱658 from July 18, 2025); Wage Order NCR-27 (₱755 / ₱780 in two tranches; implementation enjoined by the Pasig RTC, Jul-Aug 2026)"],confidence:"verified",notes:"Re-checked Nov 8, 2026 (SunStar, Philstar and SweldoPH reports of the NCR-28 order taking effect Sept 26, 2026); first checked Oct 7, 2026: under Wage Order No. NCR-28 the NCR minimum wage is ₱755 a day for non-agriculture and ₱718 for agriculture, retail/service establishments with 15 or fewer workers and manufacturing establishments with fewer than 10 workers, effective Sept 26, 2026; confirm against the NWPC wage-order PDF (reported by GMA News, Daily Tribune, Philstar, Sept 2026). History: NCR-26 set ₱695 / ₱658 from July 18, 2025; NCR-27's increase (₱755, then ₱780 from Jan 20, 2027) was enjoined by the Pasig RTC (status quo ante Jul 24, TRO Jul 30, preliminary injunction Aug 13, 2026), and the injunction was still in place as reported Oct 21, 2026, with a Supreme Court petition pending; NCR-28 does not amend NCR-27. Every region has its own wage order (for example, Calabarzon and Central Visayas raised theirs in October 2026). The minimum wage earner switch on the Employee and Payroll tabs uses the daily rate you enter, not this reference."},Yv={value:{method:"graduated table on annualized taxable compensation; December adjustment trues up the year"},legalBasis:["NIRC Sec 79(H)","RR 2-98 Sec 2.79(B)(5)(b), as amended by RR 11-2018"],confidence:"verified",notes:"On the last payroll of the year (or on termination), the employer computes tax on the full year's taxable compensation (including pay from a previous employer within the year) using the annual graduated table, and withholds or refunds the difference so total withheld equals annual tax due. Refunds of over-withholding are due to employees not later than January 25 of the following year."},Uv={value:{unit:"centavo",method:"half-up"},legalBasis:["Owner decision 3, Oct 7, 2026 (REVIEW.md 4.3); the rounding instruction on BIR Forms 1601-C and 2316 was not confirmed"],confidence:"needs_review",notes:"Payslip, withholding and contribution lines are rounded half-up to the centavo (₱3.195 -> ₱3.20), computed exactly in whole centavos, and 12-month totals are 12 × the rounded monthly figure. Confirm against the current 1601-C and 2316 instructions."},qv={value:{exemptItems:["statutory minimum wage","holiday pay","overtime pay","night-shift differential","hazard pay"],payFactors:[365,313,261],payFactorLabels:{261:"five-day week",313:"six-day week",365:"paid every day"},defaultPayFactor:313},legalBasis:["NIRC Sec 24(A)(2), as amended by RA 9504 and RA 10963","RR 11-2018","Soriano v. Secretary of Finance, G.R. No. 184450, Jan 24, 2017"],confidence:"verified",notes:"Statutory minimum wage earners (MWEs) are exempt from income tax on their statutory minimum wage, plus holiday pay, overtime pay, night-shift differential and hazard pay, and no tax is withheld on these. Other pay (taxable allowances, commissions) stays taxable, and so do 13th-month pay and other benefits above ₱90,000; receiving them does not cancel the exemption on the minimum wage (Soriano v. Secretary of Finance struck down the RR 10-2008 rule that said it did). The Employee and Payroll calculators apply this when 'Minimum wage earner' is switched on: monthly minimum wage = statutory daily rate × paid days a year (365, 313 or 261) ÷ 12, rounded to the centavo."},Hv={value:"An MWE's SSS, PhilHealth and Pag-IBIG shares are taken from the tax-free minimum wage, so they do not reduce the taxable other pay",legalBasis:["NIRC Sec 32(B)(7)(f)","App assumption, Oct 7, 2026, pending CPA confirmation"],confidence:"needs_review",notes:"For a minimum wage earner with other taxable pay, the calculators tax the other pay in full and treat the employee's mandatory contributions as paid out of the exempt minimum wage (the cautious reading: it never shows less tax). Confirm against the BIR Form 2316 and alphalist instructions whether the contributions should instead reduce the taxable other pay."},pn={$comment:$v,tables:_v,tablesEffectiveFrom:Lv,deMinimis:Wv,minimumWageReference:zv,annualization:Yv,payslipRounding:Uv,mweExempt:qv,mweContributions:Hv},Vv="Common expanded (creditable) withholding tax rates (RR 2-98 as amended by RR 11-2018). Reference table for the employer/withholding-agent surfaces.",Qv={value:[{atc:"WI010/WI011",payee:"Professional fees (individual)",rate:"5% if annual gross ≤ ₱3M with sworn declaration; 10% otherwise"},{atc:"WC010/WC011",payee:"Professional fees (corporation)",rate:"10% if annual gross ≤ ₱720,000; 15% otherwise"},{atc:"WI100/WC100",payee:"Rental of real/personal property",rate:"5%"},{atc:"WI120/WC120",payee:"Contractors & subcontractors (incl. security, janitorial, IT services)",rate:"2%"},{atc:"WI158/WC158",payee:"Purchases of goods by Top Withholding Agents",rate:"1%"},{atc:"WI160/WC160",payee:"Purchases of services by Top Withholding Agents",rate:"2%"},{atc:"WI139/WI140, WC139/WC140 (brokers) · WI515/WI516, WC515/WC516 (sales and marketing agents)",payee:"Commissions of brokers and agents (non-employees): same tiers as professional fees since RR 11-2018",rate:"Individuals: 5% if annual gross ≤ ₱3M with sworn declaration, else 10%; corporations: 10% if ≤ ₱720,000, else 15%."},{atc:"WI152/WI153",payee:"Income payments by GPPs to their partners (drawings, advances, sharings, allowances)",rate:"10% if annual ≤ ₱720,000; 15% otherwise (individual codes only; partners are natural persons)"},{atc:"New codes under RMO 46-2025 (check the current 1601-EQ list)",payee:"TWA purchases from manufacturers or direct importers of goods intended for wholesale: motor vehicles (CBU/SKD, incl. motorcycles) and their parts/accessories, pharmaceutical products, solid/liquid fuels",rate:"0.5% in lieu of the 1% goods rate per RR 24-2025, effective Oct 10, 2025; supplier need only be a manufacturer OR direct importer, with documentary proof per RMC 79-2026"},{atc:"WI820/WC820 (e-marketplace operators), WI830/WC830 (digital financial services providers)",payee:"E-marketplace / digital-platform and DFSP remittances to online sellers",rate:"0.5% of gross remittances (flat, per RR 5-2025 implementing CREATE MORE, superseding RR 16-2023's 1%-of-one-half mechanic); excluded if annual gross remittances across all platforms ≤ ₱500,000 with BIR-received sworn declaration, or BMBE-registered"},{atc:"WI156/WC156",payee:"Credit-card company payments to businesses for cardholder sales",rate:"0.5% of the gross amounts paid (RR 5-2025; previously 1% of one-half); the acquirer withholds and issues Form 2307"}],legalBasis:["RR 2-98 Sec 2.57.2, as amended by RR 11-2018 & RR 7-2019","RR 31-2020 (TWA criteria)","RR 24-2025 & RMC 79-2026","RR 16-2023, as amended by RR 5-2025 (CREATE MORE)","RMO 18-2025 and RMO 46-2025 (ATCs for the 0.5% categories)","RMO 38-2018 (ATCs for professional fees and commissions)"],confidence:"verified",notes:"The full ATC schedule is longer; these are the rates MSMEs meet most. Top Withholding Agents: designated by published BIR list, with criteria per RR 31-2020 (gross sales/receipts or purchases ≥ ₱12M for Groups A/B, ≥ ₱5M for C/D/E); obligation starts the month after list publication, and TWA status is independent of the EOPT micro/small/medium/large classification. Individual 5% professional-fee rate requires the payee's sworn declaration (gross ≤ ₱3M, non-VAT); without it, withhold 10%. Lone-payor payees with annual income ≤ ₱250,000 may be exempted by sworn declaration. Platforms' alphalist duties per RMC 55-2026."},Gv={value:{lowerRate:.05,standardRate:.1,lowerRateGrossCeiling:3e6},legalBasis:["RR 2-98 Sec 2.57.2, as amended by RR 11-2018"],confidence:"verified",notes:"The first row of the rates table above as numbers: 5% when the individual payee's annual gross is ₱3M or less and a sworn declaration was given; 10% otherwise. The blog quotes these rates."},Jv={value:"For taxable years from 2024, an expense is deductible even if the related withholding tax was not withheld or remitted, because EOPT repealed NIRC Sec 34(K). The withholding agent remains liable for the unremitted tax, surcharge, and interest.",legalBasis:["RA 11976 (EOPT), repealing NIRC Sec 34(K)","NIRC Sec 251 (withholding agent liability)"],confidence:"verified",notes:"Major change from the pre-2024 deduction-disallowance regime, in force since January 22, 2024; the agent's own exposure (tax not withheld plus surcharge and interest) survives."},Kv={value:{rate:.35,grossUpDivisor:.65,form:"1603Q",deadline:"last day of the month following each calendar quarter"},legalBasis:["NIRC Sec 33, as amended by RA 10963","RR 11-2018"],confidence:"verified",notes:"Applies only to fringe benefits given to managerial/supervisory employees (rank-and-file benefits run through compensation instead). No attachments ride the 1603Q. Out of the estimator's scope; surfaced on the employer checklist."},Gd={$comment:Vv,rates:Qv,professionalFeesIndividual:Gv,sec34kRepealed:Jv,fringeBenefitsTax:Kv},Xv="Philippine non-working days used for deadline shifting. 2026: per Proclamation No. 1006 s.2025 (verified Aug 4, 2026, incl. the separately proclaimed Eid dates, Proc 1189 and 1264 s.2026). 2027: per Proclamation No. 1427 s.2026 (signed Sept 8, 2026, as reported by the PCO, GMA News and Philstar): the dates fixed by law plus four special non-working days (Feb 6, Mar 27, Nov 2, Dec 24). Eid'l Fitr / Eid'l Adha 2027 are proclaimed separately and are added when proclaimed. Special WORKING days (e.g. EDSA anniversary, Feb 25) are excluded; offices are open.",Zv={value:"A filing/payment deadline falling on a Saturday, Sunday, or non-working holiday moves to the next working day",legalBasis:["RMC 65-2016 (a deadline on a Saturday, Sunday or holiday moves to the next working day)","The rule printed in the BIR's annual Tax Calendar and form instructions ('If the due date falls on a Saturday, Sunday or holiday, the deadline shall be moved to the next working day')","RR 26-2002 (same treatment in the eFPS staggered-filing framework)"],confidence:"verified",notes:"Applied per agency (rollOverByAgency below): BIR, SSS, PhilHealth and Pag-IBIG dates move to the next working day; LGU, SEC and DOLE dates stay on the date set by law, with a note to act on the last working day before. Moved deadlines only ever move later, never earlier; weekday special non-working days (Dec 8, Dec 24, Dec 31) move deadlines just like regular holidays; purely LOCAL holidays do not move national e-filing deadlines. The 13th-month-pay deadline never moves: it must be met on or before Dec 24."},e1={BIR:{policy:"next_working_day",legalBasis:["RMC 65-2016"],confidence:"verified",notes:"Applies to eFPS, eBIRForms and manual filers alike."},SSS:{policy:"next_working_day",legalBasis:["SSS payment-deadline rule (sss.gov.ph): a deadline on a Saturday, Sunday or holiday may be paid on the next working day"],confidence:"verified"},PhilHealth:{policy:"next_working_day",legalBasis:["PhilHealth Circular No. 0001, s. 2014"],confidence:"verified"},"Pag-IBIG":{policy:"next_working_day",legalBasis:["HDMF Circular 499-2026, as reported by the Philippine Information Agency (Nov 7, 2026): a due date on a non-working day moves to the next working day; the circular text was not read here"],confidence:"needs_review"},LGU:{policy:"statutory_date",legalBasis:["Local Government Code (RA 7160) Secs 139, 161 and 167 set fixed last days; no weekend roll-over rule found"],confidence:"needs_review",note:"If this falls on a weekend or holiday, pay or file on the last working day before, unless your LGU or the agency allows later."},SEC:{policy:"statutory_date",legalBasis:["SEC MC 9-2026 treats a weekend or holiday e-filing as filed on the next working day; it does not extend the deadline"],confidence:"needs_review",note:"If this falls on a weekend or holiday, pay or file on the last working day before, unless your LGU or the agency allows later."},DOLE:{policy:"statutory_date",legalBasis:["PD 851 IRR and the annual DOLE labor advisories set fixed dates; no roll-over rule found"],confidence:"needs_review",note:"If this falls on a weekend or holiday, pay or file on the last working day before, unless your LGU or the agency allows later."}},t1="This date never moves later: if it falls on a weekend or holiday, do it on the last working day before.",n1="needs_review",r1={2026:"verified",2027:"verified"},a1="2026 dates are verified against Proclamation No. 1006 s.2025 and the Eid proclamations. 2027 dates are verified against Proclamation No. 1427 s.2026 as reported by the PCO, GMA News and Philstar (the Official Gazette text could not be opened here). The 2027 Eid'l Fitr and Eid'l Adha dates are not yet proclaimed and are not in the list, so a deadline next to them may still move one more day.",o1={value:[{rule:"date",month:1,day:1,name:"New Year's Day",type:"regular"},{rule:"easter",offsetDays:-3,name:"Maundy Thursday",type:"regular"},{rule:"easter",offsetDays:-2,name:"Good Friday",type:"regular"},{rule:"date",month:4,day:9,name:"Araw ng Kagitingan",type:"regular"},{rule:"date",month:5,day:1,name:"Labor Day",type:"regular"},{rule:"date",month:6,day:12,name:"Independence Day",type:"regular"},{rule:"lastWeekday",month:8,weekday:1,name:"National Heroes Day",type:"regular"},{rule:"date",month:11,day:30,name:"Bonifacio Day",type:"regular"},{rule:"date",month:12,day:25,name:"Christmas Day",type:"regular"},{rule:"date",month:12,day:30,name:"Rizal Day",type:"regular"},{rule:"date",month:8,day:21,name:"Ninoy Aquino Day",type:"special_non_working"},{rule:"date",month:11,day:1,name:"All Saints' Day",type:"special_non_working"},{rule:"date",month:12,day:8,name:"Feast of the Immaculate Conception",type:"special_non_working"},{rule:"date",month:12,day:31,name:"Last Day of the Year",type:"special_non_working"}],legalBasis:["EO 292 (Administrative Code of 1987) Book I Sec 26, as amended by RA 9492","RA 9256 (Ninoy Aquino Day, Aug 21)","RA 10966 (Feast of the Immaculate Conception, Dec 8)"],confidence:"needs_review",notes:"The holidays fixed by law, computed for any year that has no proclaimed list below (a proclaimed list replaces them for its year). Maundy Thursday and Good Friday are the Thursday and Friday before Easter Sunday; National Heroes Day is the last Monday of August. Not included because a proclamation sets them: Eid'l Fitr and Eid'l Adha, Chinese New Year, Black Saturday, Nov 2, Dec 24, election days and other special days. A proclamation may also move a holiday under RA 9492, so until a year's list is proclaimed a deadline may move one or more days later than shown."},i1=[{date:"2026-01-01",name:"New Year's Day",type:"regular"},{date:"2026-02-17",name:"Chinese New Year",type:"special_non_working"},{date:"2026-03-20",name:"Eid'l Fitr",type:"regular"},{date:"2026-04-02",name:"Maundy Thursday",type:"regular"},{date:"2026-04-03",name:"Good Friday",type:"regular"},{date:"2026-04-04",name:"Black Saturday",type:"special_non_working"},{date:"2026-04-09",name:"Araw ng Kagitingan",type:"regular"},{date:"2026-05-01",name:"Labor Day",type:"regular"},{date:"2026-05-27",name:"Eid'l Adha",type:"regular"},{date:"2026-06-12",name:"Independence Day",type:"regular"},{date:"2026-08-21",name:"Ninoy Aquino Day",type:"special_non_working"},{date:"2026-08-31",name:"National Heroes Day",type:"regular"},{date:"2026-11-01",name:"All Saints' Day",type:"special_non_working"},{date:"2026-11-02",name:"All Souls' Day",type:"special_non_working"},{date:"2026-11-30",name:"Bonifacio Day",type:"regular"},{date:"2026-12-08",name:"Feast of the Immaculate Conception",type:"special_non_working"},{date:"2026-12-24",name:"Christmas Eve",type:"special_non_working"},{date:"2026-12-25",name:"Christmas Day",type:"regular"},{date:"2026-12-30",name:"Rizal Day",type:"regular"},{date:"2026-12-31",name:"Last Day of the Year",type:"special_non_working"},{date:"2027-01-01",name:"New Year's Day",type:"regular"},{date:"2027-02-06",name:"Chinese New Year",type:"special_non_working"},{date:"2027-03-25",name:"Maundy Thursday",type:"regular"},{date:"2027-03-26",name:"Good Friday",type:"regular"},{date:"2027-03-27",name:"Black Saturday",type:"special_non_working"},{date:"2027-04-09",name:"Araw ng Kagitingan",type:"regular"},{date:"2027-05-01",name:"Labor Day",type:"regular"},{date:"2027-06-12",name:"Independence Day",type:"regular"},{date:"2027-08-21",name:"Ninoy Aquino Day",type:"special_non_working"},{date:"2027-08-30",name:"National Heroes Day",type:"regular"},{date:"2027-11-01",name:"All Saints' Day",type:"special_non_working"},{date:"2027-11-02",name:"All Souls' Day",type:"special_non_working"},{date:"2027-11-30",name:"Bonifacio Day",type:"regular"},{date:"2027-12-08",name:"Feast of the Immaculate Conception",type:"special_non_working"},{date:"2027-12-24",name:"Christmas Eve",type:"special_non_working"},{date:"2027-12-25",name:"Christmas Day",type:"regular"},{date:"2027-12-30",name:"Rizal Day",type:"regular"},{date:"2027-12-31",name:"Last Day of the Year",type:"special_non_working"}],s1={value:[{date:"2026-11-16",region:"NCR",name:"49th ASEAN Summit",type:"special_non_working"},{date:"2026-11-17",region:"NCR",name:"49th ASEAN Summit",type:"special_non_working"},{date:"2026-11-18",region:"NCR",name:"49th ASEAN Summit",type:"special_non_working"}],legalBasis:["Proclamation No. 1447 s.2026 (signed Sept 17, 2026): Nov 16 to 18, 2026 are special non-working days in the National Capital Region for the 49th ASEAN Summit (reported by the PIA, Philstar, Manila Times and Inquirer)"],confidence:"verified",notes:"Holidays declared for one region only. They are not in the national list above, so the calendar keeps the national due date: filing and paying by that date is always on time. BIR: a tax advisory reported on November 11, 2026 lets taxpayers registered with the Metro Manila revenue district offices and Large Taxpayers divisions it lists file and pay returns due Nov 16 to 18, 2026 until Thursday, Nov 19, 2026 without penalty (see regionalExtensions); outside those offices the dates did not move. No SSS, PhilHealth or Pag-IBIG advisory for these days was found as of November 12, 2026."},l1={value:[{region:"NCR",agency:"BIR",dates:["2026-11-16","2026-11-17","2026-11-18"],newDate:"2026-11-19",basis:"BIR tax advisory of November 2026",coverage:"taxpayers registered with the Metro Manila revenue district offices and Large Taxpayers divisions listed in the advisory"}],legalBasis:["BIR tax advisory signed by the Commissioner (reported Nov 11, 2026 by the Inquirer, the Tribune, the Manila Bulletin and Bombo Radyo): returns and payments due Nov 16 to 18, 2026 may be filed and paid until Nov 19, 2026 by taxpayers of the listed NCR offices","Proclamation No. 1447 s.2026"],confidence:"verified",notes:"A deadline moved for one region and one agency only. The calendar keeps the national date and shows the later date in a note, because the profile does not say where the taxpayer is registered. The advisory's list of offices was not seen here: check that your revenue district office is on it."},c1=[{year:2027,until:"2027-05-31",note:"Eid'l Fitr and Eid'l Adha 2027 are not yet proclaimed (estimates: about Mar 9 and May 16): a deadline around Mar 9-10 or May 16-17, 2027 may move one day later."}],d1={confidence:"needs_review",notes:"Proclamation No. 1427 s.2026 (Sept 8, 2026) set the 2027 holidays: the regular holidays and special days fixed by law, plus special non-working days on Feb 6 (Chinese New Year, a Saturday), Mar 27 (Black Saturday), Nov 2 (All Souls' Day, a Tuesday) and Dec 24 (Christmas Eve, a Friday). Feb 25 (EDSA anniversary) stays a special WORKING day. Still pending: Eid'l Fitr and Eid'l Adha 2027 (astronomical estimates: Eid'l Fitr about Mar 9, Eid'l Adha about May 16), proclaimed separately closer to the dates; add them here when proclaimed. Nov 2, 2027 moves the Q3 2027 1601-EQ, 1601-FQ and QAP and the September 2027 SSS and PhilHealth payments from Tue Nov 2 to Wed Nov 3."},Ne={$comment:Xv,shiftRule:Zv,rollOverByAgency:e1,noShiftNote:t1,confidence:n1,confidenceByYear:r1,confidenceNote:a1,fixedByLaw:o1,holidays:i1,regionalHolidays:s1,regionalExtensions:l1,pendingHolidays:c1,notes2027:d1},u1=JSON.parse(`[{"id":"bir-1701q","title":"File & pay quarterly income tax","desc":"Cumulative year-to-date income tax for individuals in business or practice, less prior quarters' payments and creditable withholding.","form":"1701Q","agency":"BIR","category":"income","appliesTo":{"allOf":["individual-business"]},"schedule":{"kind":"quarterly_fixed","entries":[{"label":"Q1","month":5,"day":15},{"label":"Q2","month":8,"day":15},{"label":"Q3","month":11,"day":15}]},"legalBasis":["NIRC Sec 74(A), as amended by RA 10963 (TRAIN)"],"confidence":"verified","notes":"No Q4 return; the fourth quarter is reconciled on the annual return. The Q1 filing is also where the 8% election is made each year. Claiming 2307 credits for the quarter? The SAWT goes with the return via eSubmission (RR 2-2006); scanned 2307s may be lodged through eAFS quarterly groups."},{"id":"bir-1701a-annual","title":"File annual income tax return","desc":"Simplified annual return for purely self-employed individuals on the 8% rate or graduated rates with OSD, reconciling all quarterly filings and 2307 credits.","form":"1701A","agency":"BIR","category":"income","appliesTo":{"allOf":["type:individual"],"noneOf":["itemized"]},"schedule":{"kind":"annual_fixed","month":4,"day":15},"legalBasis":["NIRC Sec 51(C), as amended","RMC 17-2019 (Form 1701A availability)"],"confidence":"verified","notes":"Income tax due above ₱2,000 may be paid in two equal installments: at filing, and on or before October 15 (NIRC Sec 56(A)(2), as amended by TRAIN). Attachments (SAWT confirmation, 2307s) go to eAFS within 15 days of the statutory deadline or the actual e-filing date, whichever comes later; see the attachments deadline on this calendar. No FS attach on the 8% option or OSD. Micro and small taxpayers may instead use the simplified Form 1701-MS where the BIR makes it available for the year (see the Forms page)."},{"id":"bir-1701-annual","title":"File annual income tax return","desc":"Full annual return for mixed-income earners and individuals claiming itemized deductions, reconciling all quarterly filings and credits.","form":"1701","agency":"BIR","category":"income","appliesTo":{"allOf":["individual-business"],"anyOf":["itemized","type:mixed"]},"schedule":{"kind":"annual_fixed","month":4,"day":15},"legalBasis":["NIRC Sec 51(C), as amended"],"confidence":"verified","notes":"Attach Form 2316 from your employer (mixed income) and SAWT with 2307s where credits are claimed (the SAWT itself is filed via eSubmission with the return). Itemized-deduction filers attach financial statements: audited with SMR when gross sales exceed ₱3M, not necessarily audited (or the AIF) at or below; only 8%/OSD filers attach no FS at all (NIRC Sec 232; RR 16-2008). Attachments go to eAFS within 15 days of the statutory deadline or actual e-filing, whichever comes later, a separately dated item on this calendar. Micro and small taxpayers may instead use the simplified Form 1701-MS where the BIR makes it available for the year (see the Forms page)."},{"id":"bir-sawt-individual","title":"Submit SAWT with each income tax return","desc":"Summary Alphalist of Withholding Taxes: the alphalist of every 2307 certificate claimed as a credit, filed via eSubmission together with the quarterly 1701Q and the annual return.","form":"SAWT","agency":"BIR","category":"income","appliesTo":{"allOf":["individual-business","receives-2307"]},"schedule":{"kind":"quarterly_fixed","entries":[{"label":"Annual","month":4,"day":15},{"label":"Q1","month":5,"day":15},{"label":"Q2","month":8,"day":15},{"label":"Q3","month":11,"day":15}]},"legalBasis":["RR 2-2006","RMC 3-2006"],"confidence":"verified","notes":"Due whenever a return claims 2307 credits: a .dat file built with the BIR data entry module and emailed to esubmission@bir.gov.ph (or attached in eFPS), due when the return itself is due. The April 15 occurrence rides the annual 1701/1701A. Keep the email validation report: it is the proof uploaded to eAFS with the scanned 2307s. No SAWT and the claimed credits are exposed to disallowance. Also rides the 2550Q/2551Q on the rarer occasions withholding is credited on those returns. Nothing claimed for a period, nothing due."},{"id":"bir-1700-annual","title":"File annual income tax return (compensation)","desc":"Employees outside substituted filing (e.g. two or more employers during the year) file their own annual return on compensation income.","form":"1700","agency":"BIR","category":"income","appliesTo":{"allOf":["files-1700"]},"schedule":{"kind":"annual_fixed","month":4,"day":15},"legalBasis":["NIRC Sec 51(A)(2), as amended","RR 8-2018"],"confidence":"verified","notes":""},{"id":"bir-2316-collect","title":"Collect BIR Form 2316 from your employer","desc":"Each employer's certificate of compensation paid and tax withheld: collect one from every employer you had this year. With one employer and correct withholding it doubles as your filed return; with more than one, you file Form 1700 with all of them. If you also have a business or practice, the 2316 goes with your Form 1701.","form":"2316","agency":"BIR","category":"income","appliesTo":{"anyOf":["type:employee","type:mixed"]},"schedule":{"kind":"annual_fixed","month":1,"day":31},"legalBasis":["NIRC Sec 83, as amended","RR 2-98 Sec 2.83.1, as amended by RR 11-2018"],"confidence":"verified","notes":"Employers must issue the certificate on or before January 31 of the following year, or on the day of last payment for terminated employment."},{"id":"bir-1702q","title":"File & pay quarterly corporate income tax","desc":"Cumulative corporate income tax for the taxable year to date, less prior quarterly payments and creditable withholding.","form":"1702Q","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3],"daysAfterEnd":60},"legalBasis":["NIRC Sec 75 & 77(B), as amended"],"confidence":"verified","notes":"Due within 60 days following the close of each of the first three quarters of the taxable year, calendar or fiscal. SAWT via eSubmission when 2307 credits are claimed; scanned 2307s may go through eAFS quarterly groups (RMC 82-2020)."},{"id":"bir-1702-annual","title":"File annual corporate income tax return","desc":"Year-end corporate return: regular corporate income tax compared against the minimum corporate income tax where applicable.","form":"1702-RT","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"annual_fy","monthsAfterEnd":4,"day":15},"legalBasis":["NIRC Sec 77(B), as amended"],"confidence":"verified","notes":"Due the 15th day of the fourth month following the close of the taxable year (April 15 for calendar-year corporations). Variants: 1702-EX (exempt), 1702-MX (mixed/special-rate regimes; RBEs attach the CETI). Attachments include FS + SMR (audited only when gross sales exceed ₱3M per NIRC Sec 232, though FS attach even on OSD per RR 16-2008), SAWT/2307s, and Form 1709 for covered related-party taxpayers; these go to eAFS within 15 days of the deadline or actual e-filing, whichever comes later (fiscal-year naming per RMC 82-2020); a separately dated item on this calendar. E-filing is mandatory for all corporations (RMC 20-2026)."},{"id":"bir-sawt-corp-quarterly","title":"Submit SAWT with the quarterly income tax return","desc":"Summary Alphalist of Withholding Taxes: the alphalist of every 2307 certificate claimed as a credit on the 1702Q, filed via eSubmission with the return.","form":"SAWT","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation","receives-2307"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3],"daysAfterEnd":60},"legalBasis":["RR 2-2006","RMC 3-2006"],"confidence":"verified","notes":"Due with each 1702Q (within 60 days of the close of each of the first three quarters, following the corporation's taxable year) whenever 2307 credits are claimed for the quarter; nothing claimed, nothing due. A .dat file via eSubmission (esubmission@bir.gov.ph) or eFPS; scanned 2307s may go through eAFS quarterly groups (RMC 82-2020)."},{"id":"bir-sawt-corp-annual","title":"Submit SAWT with the annual income tax return","desc":"Summary Alphalist of Withholding Taxes: the alphalist of every 2307 certificate claimed as a credit on the annual 1702, filed via eSubmission with the return.","form":"SAWT","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation","receives-2307"]},"schedule":{"kind":"annual_fy","monthsAfterEnd":4,"day":15},"legalBasis":["RR 2-2006","RMC 3-2006"],"confidence":"verified","notes":"Due with the annual return, the 15th day of the fourth month after year-end. Keep the email validation report; it goes to eAFS (Other Attachments group) with the scanned 2307s within the 15-day attachment window. No SAWT and the claimed credits are exposed to disallowance."},{"id":"bir-eafs-itr-attachments-individual","title":"Submit annual ITR attachments via eAFS","desc":"Scanned attachments to the annual return: SAWT eSubmission confirmation, 2307s and 2304s, 2316 (mixed income / 1700 filers), for itemized-deduction filers the FS (audited above ₱3M gross sales, unaudited below), plus tax debit memos and credit proofs where applicable, uploaded to eAFS in the prescribed PDF file groups.","form":"via eAFS","agency":"BIR","category":"income","appliesTo":{"anyOf":["individual-business","files-1700"]},"schedule":{"kind":"annual_fixed","month":4,"day":30},"legalBasis":["RMC 44-2021 (15 days from the statutory deadline or actual e-filing, whichever is later)","RMC 49-2020 & RMC 82-2020 (eAFS file groups & naming)","RMC 20-2026 (CY2025 guidelines; eAFS as the default channel)"],"confidence":"verified","notes":"April 30 is the date for returns filed by April 15; file the return late and the 15-day window runs from the actual e-filing date instead. Only 'if applicable': nothing to upload means nothing due. Skipping it costs ₱1,000 per document (₱500 for micro/small taxpayers) and puts claimed 2307 credits at risk; season RMCs occasionally move the date (May 15, 2026 for CY2025 per RMC 30-2026/39-2026)."},{"id":"bir-annual-itr-2nd-installment","title":"Pay the 2nd installment of annual income tax (only if you paid half with your return)","desc":"If the income tax due on your annual return (1700, 1701 or 1701A) was over ₱2,000, you may pay half when you file and the other half by October 15. Skip this if you paid the full amount with your return.","form":"2nd installment","agency":"BIR","category":"income","appliesTo":{"anyOf":["individual-business","files-1700"]},"schedule":{"kind":"annual_fixed","month":10,"day":15},"conditional":true,"ruleRef":"income-tax.annualITRInstallment","legalBasis":["NIRC Sec 56(A)(2), as amended by RA 10963 (TRAIN)"],"confidence":"verified","notes":"Individuals only (corporations pay in full). The choice is made on the annual return by entering the amount deferred to the second installment; the balance is due on or before October 15 of the year the return is filed. Paying it late brings the surcharge and interest on the unpaid half."},{"id":"bir-eafs-itr-attachments-corp","title":"Submit annual ITR attachments via eAFS","desc":"Corporate annual-return attachments: the FS with SMR (audited with auditor's report when gross sales exceed ₱3M), SAWT confirmation with 2307s and 2304s, Form 1709, CETI, tax debit memos and credit proofs where applicable, uploaded to eAFS in the prescribed PDF file groups.","form":"via eAFS","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"annual_fy","monthsAfterEnd":4,"day":30},"legalBasis":["RMC 44-2021 (15 days from the statutory deadline or actual e-filing, whichever is later)","RMC 82-2020 (fiscal-year eAFS naming)","RMC 43-2021 (RPT & tax-credit file groups)"],"confidence":"verified","notes":"15 days after the annual return's due date (April 30 for calendar-year corporations filing by April 15); a late-filed return runs the window from actual e-filing instead. The eAFS Transaction Reference Number doubles as the BIR-received proof the SEC accepts with the AFS."},{"id":"bir-2551q","title":"File & pay quarterly percentage tax","desc":"3% of gross quarterly sales or receipts for non-VAT taxpayers under the VAT threshold who have not elected the 8% income tax option.","form":"2551Q","agency":"BIR","category":"business","appliesTo":{"allOf":["business","nonvat"],"noneOf":["regime:8pct"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 116 & 128(A)(1), as amended by RA 11534 (CREATE)"],"confidence":"verified","notes":"Within 25 days after the close of each taxable quarter. Electing the 8% option removes this filing entirely for the year."},{"id":"bir-2550q","title":"File & pay quarterly VAT","desc":"Output VAT on sales less creditable input VAT for the taxable quarter.","form":"2550Q","agency":"BIR","category":"business","appliesTo":{"allOf":["business","vat"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 114(A), as amended by RA 10963 (TRAIN) & RA 11976 (EOPT)","RR 3-2024"],"confidence":"verified","notes":"Quarterly filing only; the monthly 2550M has not been required since January 2023, though RMC 52-2023 still allows optional monthly filing for the first two months of a quarter. Since April 27, 2024 the VAT base for services is gross SALES (billed/accrual), with an output-VAT credit for receivables that stay uncollected past the agreed period (Sec 110(D), RMC 65-2024)."},{"id":"bir-slsp","title":"Submit the Summary List of Sales & Purchases (SLSP)","desc":"Quarterly electronic list of sales, purchases, and importations, required of all VAT-registered taxpayers, filed via eSubmission alongside the 2550Q.","form":"SLSP","agency":"BIR","category":"business","appliesTo":{"allOf":["business","vat"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 114(C)","RR 16-2005 Sec 4.114-3, as amended by RR 1-2012 (all VAT taxpayers, no threshold)"],"confidence":"verified","notes":"Confirmed still required as of Aug 2026; no e-invoicing issuance has retired it (the first RR 11-2025 group only becomes mandatory Dec 31, 2026). RELIEF .dat files via eSubmission, due the 25th after the quarter (30th for eFPS/LTS filers); submit zero lists for quiet quarters. Taxpayers already transmitting to the EIS (RR 8-2022) are relieved of the sales list only. ₱1,000 per unfiled list, capped ₱25,000/year."},{"id":"bir-einvoicing","title":"Be ready for mandatory e-invoicing","desc":"Taxpayers in e-commerce, large taxpayers and users of computerized accounting systems must be able to issue structured electronic invoices by Dec 31, 2026 (RMC 98-2026 excepts micro taxpayers). Cash register and POS users, exporters and registered business enterprises follow later, on a date the BIR has not yet set.","form":"EIS","agency":"BIR","category":"admin","appliesTo":{"allOf":["books:cas"]},"schedule":{"kind":"once","date":"2026-12-31","noWeekendShift":true},"legalBasis":["NIRC Sec 237-A, as amended by CREATE MORE (RA 12066)","RR 11-2025","RR 26-2025 (amends RR 11-2025; keeps the Dec 31, 2026 deadline)","RMC 98-2026 (Sept 22, 2026: coverage and operating rules)"],"confidence":"needs_review","notes":"Coverage shown here is approximate (users of computerized accounting systems; also e-commerce sellers above micro size and large taxpayers). The Dec 31, 2026 date for the first covered group was reconfirmed in October 2026 (RR 26-2025 keeps it) and again on November 8, 2026 (RMC 98-2026 restates it; no extension found, re-checked November 12, 2026), but confirm whether this taxpayer is covered; until then SLSP/eSubmission duties continue unchanged. Separately, invoicing systems must add the creditable withholding tax field (RR 6-2026; RMC 112-2026)."},{"id":"bir-cwt-invoice-field-cas","title":"Add the withholding-tax line to your computerized invoices","desc":"Invoices printed from a computerized accounting system or an e-invoicing system must have a field for the creditable withholding tax (labelled 'Less: Withholding Tax', 'Less: Creditable Withholding Tax' or 'Less: CWT'), filled in when the buyer withholds.","form":"CAS","agency":"BIR","category":"admin","appliesTo":{"allOf":["books:cas"]},"schedule":{"kind":"once","date":"2026-12-31","noWeekendShift":true},"legalBasis":["RR 6-2026 (creditable withholding tax shown as a separate item on invoices)","RMC 112-2026 (Oct 22, 2026: systems covered by mandatory e-invoicing, such as computerized accounting systems, until Dec 31, 2026)"],"confidence":"verified","notes":"Dec 31, 2026 is for systems covered by mandatory e-invoicing (computerized accounting systems are the example RMC 112-2026 gives); a system not yet under mandatory e-invoicing (for example, a micro taxpayer's) has until Mar 31, 2027, like cash registers and POS. Changing a registered system only to add this field is a limited modification: no new registration is needed. The BIR may set a later date. Leave the field blank, or show N/A or 0.00, when the buyer does not withhold."},{"id":"bir-cwt-invoice-field-pos","title":"Add the withholding-tax line to your cash register / POS invoices","desc":"Cash register (CRM), point-of-sale (POS) and other invoicing systems not yet under mandatory e-invoicing must show the creditable withholding tax on the invoice as a separate line when the buyer withholds.","form":"CRM/POS","agency":"BIR","category":"admin","appliesTo":{"allOf":["crm-pos"]},"schedule":{"kind":"once","date":"2027-03-31","noWeekendShift":true},"legalBasis":["RR 6-2026 (creditable withholding tax shown as a separate item on invoices)","RMC 112-2026 (Oct 22, 2026: CRM, POS and other systems not yet under mandatory e-invoicing, until Mar 31, 2027)"],"confidence":"verified","notes":"Changing a registered machine or system only to add this field is a limited modification: no new registration is needed. The BIR may set an earlier date. Printed invoices already in stock may be used until they run out if 'Less: Withholding Tax' is stamped on them."},{"id":"bir-1601c","title":"Remit withholding tax on compensation","desc":"Income tax withheld from employees' pay for the month.","form":"1601-C","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"monthDayOverrides":{"12":15},"calendarBasis":true},"legalBasis":["NIRC Sec 81, as amended","RR 2-98 Sec 2.81, as amended by RR 11-2018"],"confidence":"verified","notes":"Due the 10th day of the month following the month withheld, except December's, due January 15. eFPS filers follow slightly later staggered dates (RR 26-2002); the dates shown are the earlier non-eFPS deadlines."},{"id":"bir-1604c","title":"File annual information return (compensation)","desc":"Year-end summary of all compensation paid and tax withheld, with the employee alphalist. Must reconcile with the twelve 1601-C filings.","form":"1604-C","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["NIRC Sec 83, as amended","RR 11-2018"],"confidence":"verified","notes":"Alphalist submitted electronically via the BIR Alphalist Data Entry & Validation Module (v7.4 per RMC 15-2025, patched Nov 2025 and Jan 2026; re-validate after each patch) through eSubmission. The alphalist is an integral part of the return: one that fails validation is deemed not received and the return treated as not validly filed."},{"id":"bir-2316-issue","title":"Issue Form 2316 to every employee","desc":"Certificate of compensation paid and tax withheld for each employee for the prior year, signed by both employer and employee.","form":"2316","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.83.1, as amended by RR 11-2018"],"confidence":"verified","notes":""},{"id":"bir-2316-submit","title":"Submit employees' 2316 copies to the BIR","desc":"Scanned copies of substituted-filing employees' signed 2316s, with the notarized sworn declaration (Annex C, RR 2-2015) and the certified list of employees qualified for substituted filing (Annex F, RR 11-2018).","form":"2316","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":2,"day":28,"calendarBasis":true},"legalBasis":["RR 11-2013","RR 2-2015 as amended by RR 16-2021 (scanned copies/eAFS/USB)","RMC 117-2021 (one mode per period)","RMC 29-2024 (only the two annexes may be required; both signatures mandatory)"],"confidence":"verified","notes":"Not later than February 28 following the close of the calendar year, for substituted-filing employees. Scans must bear BOTH employer and employee signatures (e-signatures valid per RMC 29-2021; unsigned employee copies no longer accepted per RMC 29-2024). Accepted modes: eAFS scanned PDFs, DVD-R, or USB, one mode per period; files named Surname_TIN_TaxablePeriod, alphabetical."},{"id":"bir-0619e","title":"Remit expanded withholding tax","desc":"Creditable tax withheld from suppliers (rent, professional fees, contractors) for the first two months of each quarter.","form":"0619-E","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"skipQuarterMonths":[3],"calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Only months 1 and 2 of each calendar quarter; the third month is picked up by the quarterly 1601-EQ. eFPS filers have staggered dates (RR 26-2002); shown are non-eFPS deadlines."},{"id":"bir-1601eq","title":"File quarterly expanded withholding tax return","desc":"Quarterly consolidation of all expanded withholding, crediting the two monthly 0619-E remittances, with the Quarterly Alphalist of Payees (QAP).","form":"1601-EQ","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"monthAfterEnd":1,"day":"last","calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Due the last day of the month following the close of the calendar quarter. The QAP is an integral part of the return, due the same date, tracked as its own item on this calendar."},{"id":"bir-qap","title":"Submit the Quarterly Alphalist of Payees (QAP)","desc":"Electronic alphalist of every payee withheld from during the quarter, with ATCs and amounts, an integral part of the 1601-EQ / 1601-FQ, prepared with the BIR Alphalist Data Entry & Validation Module and filed via eSubmission.","form":"QAP","agency":"BIR","category":"withholding","appliesTo":{"anyOf":["ewt","fwt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"monthAfterEnd":1,"day":"last","calendarBasis":true},"legalBasis":["RR 11-2018","RR 1-2014 & RMC 5-2014 (alphalist integral to the return)","RMC 15-2025 (Alphalist Data Entry & Validation Module v7.4)"],"confidence":"verified","notes":"Due with the quarterly withholding return: the last day of the month after each calendar quarter, alongside the 1601-EQ (expanded) and/or 1601-FQ (final). A QAP that fails validation or doesn't conform to the format is deemed NOT received and the return treated as not validly filed, putting the related expense deductions at risk. Module v7.4 was patched Nov 2025 and Jan 2026; re-validate .dat files after each patch."},{"id":"bir-1604e","title":"File annual information return (expanded withholding)","desc":"Year-end summary of creditable (expanded) taxes withheld with the payee alphalist. Must reconcile with the four 1601-EQ filings.","form":"1604-E","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"annual_fixed","month":3,"day":1,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.83.2, as amended","RR 11-2018"],"confidence":"verified","notes":""},{"id":"bir-2307-issue","title":"Issue 2307 certificates to payees","desc":"Certificate of creditable tax withheld for each supplier you withheld from during the quarter.","form":"2307","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":20,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.58(B), as amended by RR 11-2018"],"confidence":"verified","notes":"Within 20 days from the close of the quarter, or upon the payee's request together with the income payment."},{"id":"bir-0619f","title":"Remit final withholding tax","desc":"Final taxes withheld (e.g. on dividends or certain interest) for the first two months of each quarter.","form":"0619-F","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"skipQuarterMonths":[3],"calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Only months 1 and 2 of each quarter; the third month is picked up by the quarterly 1601-FQ."},{"id":"bir-1601fq","title":"File quarterly final withholding tax return","desc":"Quarterly consolidation of final withholding, crediting monthly 0619-F remittances, with the Quarterly Alphalist of Payees (QAP).","form":"1601-FQ","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"monthAfterEnd":1,"day":"last","calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Due the last day of the month following the close of the calendar quarter. Like the 1601-EQ, it carries the Quarterly Alphalist of Payees (QAP) via eSubmission, tracked as its own item on this calendar."},{"id":"bir-1604f","title":"File annual information return (final withholding)","desc":"Year-end summary of final taxes withheld, with alphalist.","form":"1604-F","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["RR 11-2018","RMC 73-2019 (1604-F introduction)"],"confidence":"verified","notes":""},{"id":"bir-2306-issue","title":"Issue 2306 certificates to payees","desc":"Certificate of final tax withheld for each payee subjected to final withholding during the year.","form":"2306","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.58(B), as amended by RR 11-2018"],"confidence":"verified","notes":"On or before January 31 of the year following the year the income payment was made, or upon the payee's request together with the payment. The creditable-withholding counterpart, the 2307, is issued quarterly instead."},{"id":"sss-employer","title":"Remit SSS contributions (employer)","desc":"Employer and employee shares of SSS contributions for the prior month, including the employees' compensation (EC) premium.","form":"SSS R-5/PRN","agency":"SSS","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":"last","monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11199 (Social Security Act of 2018)","SSS Circular 2019-012 (unified payment deadlines under the PRN regime)"],"confidence":"verified","notes":"Employers pay on or before the last day of the month following the applicable month (re-verified Aug 26, 2026). Generate the PRN in the My.SSS portal before paying."},{"id":"philhealth-employer","title":"Remit PhilHealth premiums (employer)","desc":"Employer and employee shares of PhilHealth premiums for the prior month.","form":"PhilHealth SPA/EPRS","agency":"PhilHealth","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":15,"monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11223 (Universal Health Care Act)","PhilHealth Circular No. 0001, s. 2014 (staggered windows by PEN)"],"confidence":"verified","notes":"Staggered by PhilHealth Employer Number: PEN ending 0–4 remit on the 11th–15th, PEN 5–9 on the 16th–20th of the following month (re-verified Aug 26, 2026). The 15th is shown as the safe-side date; check your exact window in EPRS."},{"id":"pagibig-employer","title":"Remit Pag-IBIG contributions (employer)","desc":"Employer and employee shares of Pag-IBIG (HDMF) savings for the prior month.","form":"Pag-IBIG MCRF","agency":"Pag-IBIG","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"calendarBasis":true},"legalBasis":["RA 9679 (HDMF Law)","HDMF Circular 275 (remittance staggered by first letter of the employer's registered name)","HDMF Circular 499-2026 (employers remit through the eSRS facility with a payment reference number; replaces the Circular 275 remittance schedule; reported effective Aug 21, 2026)"],"confidence":"needs_review","notes":"HDMF Circular 499-2026 (effective Aug 21, 2026, with a six-month transition to about Feb 21, 2027) requires every employer to enroll in Virtual Pag-IBIG for Employers and prepare the remittance schedule in its eSRS facility; after the transition, remittances are accepted only with an eSRS payment reference number. It replaced the old schedule staggered by the first letter of the employer's registered name (A–D the 10th–14th, E–L 15th–19th, M–Q 20th–24th, R–Z 25th–month-end, under Circular 275) with a new letter-based schedule whose due days were not found here, so the 10th, the earliest of the old windows, is shown; check your due date in eSRS. The Philippine Information Agency (Nov 7, 2026) reported that a due date on a non-working day moves to the next working day and that late remittances are charged 1/10 of 1% a day (one source; not confirmed)."},{"id":"sss-self","title":"Pay SSS contributions (self-employed)","desc":"Self-employed members pay their own SSS contribution based on their declared monthly earnings.","form":"SSS PRN","agency":"SSS","category":"payroll","appliesTo":{"allOf":["self-contributions"]},"schedule":{"kind":"monthly","day":"last","monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11199","SSS Circular 2019-012 (payment deadlines)"],"confidence":"verified","notes":"Self-employed and voluntary members pay the full 15% themselves, monthly (last day of the following month, shown here) or quarterly (last day of the month following the quarter). OFW members get longer windows (Jan–Sep payable to Dec 31; Oct–Dec to Jan 31). If you are also employed, you still pay on your self-employed earnings; contributions above the maximum salary credit are refunded."},{"id":"philhealth-self","title":"Pay PhilHealth premiums (self-employed)","desc":"Direct contributors paying their own premium on declared monthly income.","form":"PhilHealth SPA","agency":"PhilHealth","category":"payroll","appliesTo":{"allOf":["self-contributions"]},"schedule":{"kind":"monthly","day":"last","monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11223","PhilHealth Circular 2026-0011 (self-paying members)","PhilHealth Advisory 2026-0016 (No SPA, No Payment from Apr 1, 2026)"],"confidence":"needs_review","notes":"Generate a Statement of Premium Account (SPA) before paying; since April 1, 2026 a payment without one is not accepted. Any number of months may be paid at once. A year's unpaid premiums may be paid without interest until January 31 of the following year (PhilHealth's FAQ on Circular 2026-0011); after that, interest of up to 1.5% a month applies. The monthly dates here are a pay-as-you-go reminder, earlier than that limit. If you are also employed, your employer already remits this from your salary; ask PhilHealth before paying a second time (not confirmed)."},{"id":"pagibig-self","title":"Pay Pag-IBIG regular savings (self-employed)","desc":"Self-employed members remit their own regular monthly Pag-IBIG s
