f the following year, or on the day of last payment for terminated employment."},{"id":"bir-1702q","title":"File & pay quarterly corporate income tax","desc":"Cumulative corporate income tax for the taxable year to date, less prior quarterly payments and creditable withholding.","form":"1702Q","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3],"daysAfterEnd":60},"legalBasis":["NIRC Sec 75 & 77(B), as amended"],"confidence":"verified","notes":"Due within 60 days following the close of each of the first three quarters of the taxable year — calendar or fiscal. SAWT via eSubmission when 2307 credits are claimed; scanned 2307s may go through eAFS quarterly groups (RMC 82-2020)."},{"id":"bir-1702-annual","title":"File annual corporate income tax return","desc":"Year-end corporate return — regular corporate income tax compared against the minimum corporate income tax where applicable.","form":"1702-RT","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"annual_fy","monthsAfterEnd":4,"day":15},"legalBasis":["NIRC Sec 77(B), as amended"],"confidence":"verified","notes":"Due the 15th day of the fourth month following the close of the taxable year (April 15 for calendar-year corporations). Variants: 1702-EX (exempt), 1702-MX (mixed/special-rate regimes — RBEs attach the CETI). Attachments — audited FS + SMR, SAWT/2307s, Form 1709 for covered related-party taxpayers — go to eAFS within 15 days of the deadline or actual e-filing, whichever comes later (fiscal-year naming per RMC 82-2020); a separately dated item on this calendar. E-filing is mandatory for all corporations (RMC 20-2026)."},{"id":"bir-eafs-itr-attachments-individual","title":"Submit annual ITR attachments via eAFS","desc":"Scanned attachments to the annual return — SAWT eSubmission confirmation, 2307s, 2316 (mixed income / 1700 filers), audited FS where required — uploaded to eAFS in th tax option.","form":"2551Q","agency":"BIR","category":"business","appliesTo":{"allOf":["business","nonvat"],"noneOf":["regime:8pct"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 116 & 128(A)(1), as amended by RA 11534 (CREATE)"],"confidence":"verified","notes":"Within 25 days after the close of each taxable quarter. Electing the 8% option removes this filing entirely for the year."},{"id":"bir-2550q","title":"File & pay quarterly VAT","desc":"Output VAT on sales less creditable input VAT for the taxable quarter.","form":"2550Q","agency":"BIR","category":"business","appliesTo":{"allOf":["business","vat"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 114(A), as amended by RA 10963 (TRAIN) & RA 11976 (EOPT)","RR 3-2024"],"confidence":"verified","notes":"Quarterly filing only — the monthly 2550M has not been required since January 2023, though RMC 52-2023 still allows optional monthly filing for the first two months of a quarter. Since April 27, 2024 the VAT base for services is gross SALES (billed/accrual), with an output-VAT credit for receivables that stay uncollected past the agreed period (Sec 110(D), RMC 65-2024)."},{"id":"bir-slsp","title":"Submit the Summary List of Sales & Purchases (SLSP)","desc":"Quarterly electronic list of sales, purchases, and importations — required of all VAT-registered taxpayers, filed via eSubmission alongside the 2550Q.","form":"SLSP","agency":"BIR","category":"business","appliesTo":{"allOf":["business","vat"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 114(C)","RR 16-2005 Sec 4.114-3, as amended by RR 1-2012 (all VAT taxpayers, no threshold)"],"confidence":"verified","notes":"Confirmed still required as of Aug 2026 — no e-invoicing issuance has retired it (the first RR 11-2025 group only becomes mandatory Dec 31, 2026). RELIEF .dat files via eSubmission, due the 25th after the quarter (30th for eFPS/LTS filers); submit zero lists for quiet quarters. Taxpayers already transmitting to the EIS (RR 8-2022) are relieved of the sales list only. ₱1,000 per unfiled list, capped ₱25,000/year."},{"id":"bir-einvoicing","title":"Be ready for mandatory e-invoicing","desc":"Taxpayers in e-commerce (except micro), large taxpayers, and users of computerized accounting systems must issue structured electronic invoices by the compliance deadline.","form":"EIS","agency":"BIR","category":"admin","appliesTo":{"anyOf":["books:cas","crm-pos"]},"schedule":{"kind":"once","date":"2026-12-31","noWeekendShift":true},"legalBasis":["NIRC Sec 237-A, as amended by CREATE MORE (RA 12066)","RR 11-2025"],"confidence":"needs_review","notes":"Coverage shown here is approximate (CAS/POS users; also e-commerce sellers above micro size and large taxpayers). Confirm whether this taxpayer is covered and the current compliance date — the deadline has moved before (extended to Dec 31, 2026)."},{"id":"bir-1601c","title":"Remit withholding tax on compensation","desc":"Income tax withheld from employees' pay for the month.","form":"1601-C","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"monthDayOverrides":{"12":15},"calendarBasis":true},"legalBasis":["NIRC Sec 81, as amended","RR 2-98 Sec 2.81, as amended by RR 11-2018"],"confidence":"verified","notes":"Due the 10th day of the month following the month withheld — except December's, due January 15. eFPS filers follow slightly later staggered dates (RR 26-2002); the dates shown are the earlier non-eFPS deadlines."},{"id":"bir-1604c","title":"File annual information return — compensation","desc":"Year-end summary of all compensation paid and tax withheld, with the employee alphalist. Must reconcile with the twelve 1601-C filings.","form":"1604-C","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["NIRC Sec 83, as amended","RR 11-2018"],"confidence":"verified","notes":"Alphalist submitted electronically via the BIR Alphalist Data Entry & Validation Module (v7.4 per RMC 15-2025, patched Nov 2025 and Jan 2026 — re-validate after each patch) through eSubmission. The alphalist is an integral part of the return: one that fails validation is deemed not received and the return treated as not validly filed."},{"id":"bir-2316-issue","title":"Issue Form 2316 to every employee","desc":"Certificate of compensation paid and tax withheld for each employee for the prior year, signed by both employer and employee.","form":"2316","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.83.1, as amended by RR 11-2018"],"confidence":"verified","notes":""},{"id":"bir-2316-submit","title":"Submit employees' 2316 copies to the BIR","desc":"Scanned copies of substituted-filing employees' signed 2316s, with the notarized sworn declaration (Annex C, RR 2-2015) and the certified list of employees qualified for substituted filing (Annex F, RR 11-2018).","form":"2316","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":2,"day":28,"calendarBasis":true},"legalBasis":["RR 11-2013","RR 2-2015 as amended by RR 16-2021 (scanned copies/eAFS/USB)","RMC 117-2021 (one mode per period)","RMC 29-2024 (only the two annexes may be required; both signatures mandatory)"],"confidence":"verified","notes":"Not later than February 28 following the close of the calendar year, for substituted-filing employees. Scans must bear BOTH employer and employee signatures (e-signatures valid per RMC 29-2021; unsigned employee copies no longer accepted per RMC 29-2024). Accepted modes: eAFS scanned PDFs, DVD-R, or USB — one mode per period; files named Surname_TIN_TaxablePeriod, alphabetical."},{"id":"bir-0619e","title":"Remit expanded withholding tax","desc":"Creditable tax withheld from suppliers (rent, professional fees, contractors) for the first two months of each quarter.","form":"0619-E","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"skipQuarterMonths":[3],"calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Only months 1 and 2 of each calendar quarter — the third month is picked up by the quarterly 1601-EQ. eFPS filers have staggered dates (RR 26-2002); shown are non-eFPS deadlines."},{"id":"bir-1601eq","title":"File quarterly expanded withholding tax return","desc":"Quarterly consolidation of all expanded withholding, crediting the two monthly 0619-E remittances, with the Quarterly Alphalist of Payees (QAP).","form":"1601-EQ","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"monthAfterEnd":1,"day":"last","calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Due the last day of the month following the close of the calendar quarter. QAP filed via eSubmission by the same date — it is an integral part of the return; a QAP that fails validation is deemed not received, exposing the related deductions."},{"id":"bir-1604e","title":"File annual information return — expanded withholding","desc":"Year-end summary of creditable (expanded) taxes withheld with the payee alphalist. Must reconcile with the four 1601-EQ filings.","form":"1604-E","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"annual_fixed","month":3,"day":1,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.83.2, as amended","RR 11-2018"],"confidence":"verified","notes":""},{"id":"bir-2307-issue","title":"Issue 2307 certificates to payees","desc":"Certificate of creditable tax withheld for each supplier you withheld from during the quarter.","form":"2307","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":20,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.58(B), as amended by RR 11-2018"],"confidence":"verified","notes":"Within 20 days from the close of the quarter, or upon the payee's request together with the income payment."},{"id":"bir-0619f","title":"Remit final withholding tax","desc":"Final taxes withheld (e.g. on dividends or certain interest) for the first two months of each quarter.","form":"0619-F","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"skipQuarterMonths":[3],"calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Only months 1 and 2 of each quarter; the third month is picked up by the quarterly 1601-FQ."},{"id":"bir-1601fq","title":"File quarterly final withholding tax return","desc":"Quarterly consolidation of final withholding, crediting monthly 0619-F remittances.","form":"1601-FQ","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"monthAfterEnd":1,"day":"last","calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":""},{"id":"bir-1604f","title":"File annual information return — final withholding","desc":"Year-end summary of final taxes withheld, with alphalist.","form":"1604-F","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["RR 11-2018","RMC 73-2019 (1604-F introduction)"],"confidence":"verified","notes":""},{"id":"sss-employer","title":"Remit SSS contributions (employer)","desc":"Employer and employee shares of SSS contributions for the prior month, including the employees' compensation (EC) premium.","form":"SSS R-5/PRN","agency":"SSS","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":"last","monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11199 (Social Security Act of 2018)","SSS Circular 2019-012 (unified payment deadlines under the PRN regime)"],"confidence":"verified","notes":"Employers pay on or before the last day of the month following the applicable month (re-verified Aug 26, 2026). Generate the PRN in the My.SSS portal before paying."},{"id":"philhealth-employer","title":"Remit PhilHealth premiums (employer)","desc":"Employer and employee shares of PhilHealth premiums for the prior month.","form":"PhilHealth SPA/EPRS","agency":"PhilHealth","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":15,"monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11223 (Universal Health Care Act)","PhilHealth Circular No. 0001, s. 2014 (staggered windows by PEN)"],"confidence":"verified","notes":"Staggered by PhilHealth Employer Number: PEN ending 0–4 remit on the 11th–15th, PEN 5–9 on the 16th–20th of the following month (re-verified Aug 26, 2026). The 15th is shown as the safe-side date — check your exact window in EPRS."},{"id":"pagibig-employer","title":"Remit Pag-IBIG contributions (employer)","desc":"Employer and employee shares of Pag-IBIG (HDMF) savings for the prior month.","form":"Pag-IBIG MCRF","agency":"Pag-IBIG","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"calendarBasis":true},"legalBasis":["RA 9679 (HDMF Law)","HDMF Circular 275 (remittance staggered by first letter of the employer's registered name)"],"confidence":"verified","notes":"Staggered by the first letter of the employer's REGISTERED name, in the month after the period: A–D the 10th–14th, E–L 15th–19th, M–Q 20th–24th, R–Z and numerals 25th–month-end. The 10th is shown as the safe-side date covering every window — check your own letter's window."},{"id":"sss-self","title":"Pay SSS contributions (self-employed)","desc":"Self-employed members pay their own SSS contribution based on their declared monthly earnings.","form":"SSS PRN","agency":"SSS","category":"payroll","appliesTo":{"allOf":["self-contributions"]},"schedule":{"kind":"monthly","day":"last","monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11199","SSS Circular 2019-012 (payment deadlines)"],"confidence":"verified","notes":"Self-employed and voluntary members pay the full 15% themselves, monthly (last day of the following month, shown here) or quarterly (last day of the month following the quarter). OFW members get longer windows (Jan–Sep payable to Dec 31; Oct–Dec to Jan 31)."},{"id":"philhealth-self","title":"Pay PhilHealth premiums (self-employed)","desc":"Direct contributors paying their own premium on declared monthly income.","form":"PhilHealth SPA","agency":"PhilHealth","category":"payroll","appliesTo":{"allOf":["self-contributions"]},"schedule":{"kind":"monthly","day":"last","monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11223","PhilHealth Circular 2020-0014"],"confidence":"needs_review","notes":"Quarterly, semi-annual, and annual payment options are also available."},{"id":"pagibig-self","title":"Pay Pag-IBIG savings (self-employed)","desc":"Self-employed members remit their own monthly Pag-IBIG savings.","form":"Pag-IBIG MP2/RTPO","agency":"Pag-IBIG","category":"payroll","appliesTo":{"allOf":["self-contributions"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"calendarBasis":true},"legalBasis":["RA 9679"],"confidence":"needs_review","notes":""},{"id":"dole-13th-month","title":"Pay 13th month pay","desc":"All rank-and-file employees who worked at least one month in the year must receive 13th month pay.","form":"—","agency":"DOLE","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":12,"day":24,"calendarBasis":true,"noWeekendShift":true,"periodBasis":"current_year"},"legalBasis":["PD 851","DOLE Labor Advisory (annual)"],"confidence":"verified","notes":"Due on or before December 24 — this deadline does NOT move later for weekends; pay earlier instead."},{"id":"dole-13th-month-report","title":"Report 13th-month compliance to DOLE","desc":"Employers report 13th-month payment compliance through the DOLE establishment report system.","form":"DOLE online report","agency":"DOLE","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":1,"day":15,"calendarBasis":true},"legalBasis":["PD 851 IRR","DOLE Labor Advisory No. 16-2025 (report via reports.dole.gov.ph by Jan 15, 2026 — reiterated annually)"],"confidence":"verified","notes":"January 15 of the following year has held across recent annual advisories; the report goes through the DOLE Establishment Report System (reports.dole.gov.ph). Watch each December's advisory for the odd change."},{"id":"lgu-business-permit","title":"Renew business / mayor's permit","desc":"Annual renewal of the LGU business permit and payment of local business tax for the year.","form":"LGU","agency":"LGU","category":"registration","appliesTo":{"allOf":["lgu"]},"schedule":{"kind":"annual_fixed","month":1,"day":20,"periodBasis":"current_year"},"legalBasis":["Local Government Code (RA 7160) Sec 167"],"confidence":"verified","notes":"Local business taxes accrue January 1 and are payable within the first 20 days of January. Many LGUs allow quarterly installments (within the first 20 days of each quarter). Barangay clearance is secured first."},{"id":"lgu-cedula","title":"Pay community tax (cedula)","desc":"Annual community tax for individuals in business and corporations.","form":"CTC","agency":"LGU","category":"registration","appliesTo":{"allOf":["business"]},"schedule":{"kind":"annual_fixed","month":2,"day":"last","periodBasis":"current_year"},"legalBasis":["Local Government Code (RA 7160) Secs 156-164"],"confidence":"verified","notes":"Accrues January 1; payable without interest until the last day of February."},{"id":"lgu-ptr","title":"Renew Professional Tax Receipt (PTR)","desc":"Annual professional tax for PRC-licensed professionals practicing their profession.","form":"PTR","agency":"LGU","category":"registration","appliesTo":{"allOf":["ptr"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"periodBasis":"current_year"},"legalBasis":["Local Government Code (RA 7160) Sec 139"],"confidence":"verified","notes":"Payable on or before January 31 to the province/city where the professional practices."},{"id":"bir-looseleaf-books","title":"Submit bound loose-leaf books","desc":"Permanently bound copies of last year's loose-leaf books of accounts, with a sworn statement.","form":"via ORUS","agency":"BIR","category":"admin","appliesTo":{"allOf":["books:looseleaf"]},"schedule":{"kind":"annual_fy","daysAfterEnd":15},"legalBasis":["RMC 68-2017","RMC 3-2023 (ORUS registration, QR stamp)","RMC 4-2026 (one-off extension of the Jan 2026 deadline to Jan 31)"],"confidence":"verified","notes":"Within 15 days after the end of the taxable year (January 15 for calendar-year taxpayers; the Jan 2026 round was extended one-off to Jan 31 for ORUS outages). Registration runs through ORUS — the QR 'stamp' goes on the first page of the bound volume; the bound books themselves go to your RDO with the sworn statement."},{"id":"bir-cas-books","title":"Register computerized books of accounts","desc":"Annual registration/submission of computerized books and other accounting records in electronic format.","form":"via ORUS","agency":"BIR","category":"admin","appliesTo":{"allOf":["books:cas"]},"schedule":{"kind":"annual_fy","daysAfterEnd":30},"legalBasis":["RMC 5-2021","RMC 3-2023"],"confidence":"verified","notes":"Within 30 days from the close of the taxable year (January 30 for calendar-year taxpayers)."},{"id":"bir-inventory-list","title":"Submit annual inventory list","desc":"Detailed list of ending inventory (goods, materials, supplies) as of year-end.","form":"via eSubmission/RDO","agency":"BIR","category":"admin","appliesTo":{"allOf":["inventory"]},"schedule":{"kind":"annual_fy","daysAfterEnd":30},"legalBasis":["RMC 57-2015"],"confidence":"verified","notes":"Within 30 days following the close of the taxable year (January 30 for calendar-year taxpayers)."},{"id":"sec-afs-calendar","title":"File audited financial statements with the SEC","desc":"Annual audited FS filed through the SEC's eFAST system — one uniform deadline for calendar-year corporations, set by the year's SEC memorandum circular.","form":"SEC eFAST","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec","fy:calendar"]},"schedule":{"kind":"annual_fixed","month":5,"day":29},"legalBasis":["Revised Corporation Code Sec 177","SRC Rule 68","SEC MC 9-2026 (Feb 11, 2026 — single uniform date via eFAST; FY2025's May 29 was revised to June 15, 2026 after the BIR's AITR extension)"],"confidence":"needs_review","notes":"The SEC sets the exact date each year by memorandum circular — the old last-digit staggering is gone, but the date can move mid-year (FY2025: May 29 → June 15, 2026). Later years shown at May 29 provisionally — update when each year's MC issues. Attach the BIR eAFS Transaction Reference Number in lieu of a BIR-stamped AFS. PSE-listed/public companies follow the 105-day SEC Form 17-A rule instead."},{"id":"sec-afs-fiscal","title":"File audited financial statements with the SEC","desc":"Fiscal-year corporations file audited FS via eFAST within 120 calendar days of fiscal year-end.","form":"SEC eFAST","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec","fy:fiscal"]},"schedule":{"kind":"annual_fy","daysAfterEnd":120},"legalBasis":["Revised Corporation Code Sec 177","SRC Rule 68","SEC MC 9-2026"],"confidence":"verified","notes":"Within 120 calendar days from the end of a fiscal year other than December 31 (per the annual SEC MC, most recently MC 9-2026)."},{"id":"sec-gis","title":"File the General Information Sheet (GIS)","desc":"Within 30 calendar days from the annual stockholders' (or members') meeting, via eFAST.","form":"SEC GIS","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec"]},"schedule":{"kind":"ongoing"},"legalBasis":["Revised Corporation Code Sec 177","SEC MC 9-2026 (30 calendar days from the actual annual meeting, via eFAST)"],"confidence":"verified","notes":"The due date depends on your annual meeting date (often fixed in the by-laws). Diary it 30 days after the meeting; file through eFAST."},{"id":"bir-8pct-election","title":"Elect the 8% option for the new year","desc":"The 8% income tax election is made annually — on the year's first quarterly filing (1701Q due May 15, or 2551Q due Apr 25 if that comes first) or via Form 1905. Miss it and you default to graduated rates for the whole year.","form":"1701Q / 1905","agency":"BIR","category":"admin","appliesTo":{"allOf":["individual-business","regime:8pct"]},"schedule":{"kind":"ongoing"},"legalBasis":["RR 8-2018 Sec 3","RMC 32-2018"],"confidence":"verified","notes":"The election is irrevocable for the taxable year once made."},{"id":"bir-invoices","title":"Issue BIR-registered invoices for every sale","desc":"Since the EOPT Act, the invoice is the primary document for both goods and services — official receipts are supplementary only.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"ongoing"},"legalBasis":["NIRC Sec 237, as amended by RA 11976 (EOPT)","RR 7-2024, as amended by RR 11-2024"],"confidence":"verified","notes":"Mandatory issuance applies to sales of ₱500 or more (per transaction, adjustable every 3 years); issue one anyway when the buyer asks."},{"id":"bir-books-current","title":"Keep books of accounts up to date","desc":"Record income and expenses as they happen; preserve books and records for the statutory retention period."  math reconciling your four quarters.",lines:[{box:"Gross",desc:"Total gross sales / receipts for the year."},{box:"Taxable",desc:"After the ₱250k allowance (8%) or the 40% OSD."},{box:"Payable",desc:"Tax due less quarterly payments and 2307 credits."}]},{code:"1701-MS",name:"Annual Income Tax Return (Micro & Small)",cat:"income",who:"Individuals classified micro (< ₱3M) or small (₱3M–₱20M) under EOPT, including mixed-income",when:"April 15",summary:"The new simplified two-page annual return for micro and small individual taxpayers, introduced for the CY2025 season (RMC 20-2026). Optional — qualified filers may still use the 1701 or 1701A regardless of the form named on their COR. E-filable since eBIRForms v7.9.6.",lines:[{box:"Class",desc:"Your EOPT classification (micro/small) decides eligibility — by gross sales, business income only."}]},{code:"1701",name:"Annual Income Tax Return (itemized / mixed)",cat:"income",who:"Itemized-deduction filers & mixed-income earners",when:"April 15",summary:"The full annual return — used if you itemize actual expenses or also earn compensation. Longer, because it carries detailed schedules of income and deductions across both income types.",lines:[{box:"Sch",desc:"Itemized deductions — must match your books and receipts."},{box:"2316",desc:"Mixed-income earners attach the employer's 2316 and credit its withholding."}]},{code:"1700",name:"Annual Income Tax Return (compensation only)",cat:"income",who:"Employees outside substituted filing (e.g. two employers)",when:"April 15",summary:"If you had more than one employer in the year, or withholding didn't fully cover your tax, you file this return yourself, consolidating every 2316 you received.",lines:[{box:"2316s",desc:"Attach one from each employer — their withholding is your credit."}]},{code:"1702Q",name:"Quarterly Income Tax Return (Corporations)",cat:"income",who:"Corporations & taxable partnerships",when:"60 days after each quarter",summary:"The corporate counterpart of the 1701Q — filed within 60 days of each of the first three quarters of the taxable year (calendar or fiscal), computing cumulative income tax less prior payments and credits.",lines:[{box:"Rate",desc:"25% RCIT, or 20% for qualifying small corporations under CREATE."},{box:"Credits",desc:"Prior quarters and 2307 withholding."}]},{code:"1702-RT",name:"Annual Income Tax Return (Corporation — regular)",cat:"income",who:"Corporations on the regular rate",when:"15th day of the 4th month after year-end",summary:"The year-end corporate return (April 15 for calendar-year corporations). Regular corporate income tax — 25%, or 20% for small corporations (net taxable income ≤ ₱5M and assets ≤ ₱100M) — compared against the 2% MCIT from the fourth year of operations.",lines:[{box:"MCIT",desc:"Pay the higher of RCIT and 2% MCIT; excess MCIT credits forward 3 years."},{box:"AFS",desc:"Audited financial statements attach to this filing."}]},{code:"2551Q",name:"Quarterly Percentage Tax",cat:"business",who:"Non-VAT taxpayers who did not elect the 8% option — individuals on graduated rates, and non-VAT corporations",when:"25 days after each quarter",summary:"A 3% tax on gross quarterly sales, filed within 25 days of each quarter's close. It applies to non-VAT taxpayers under the ₱3M threshold: individuals on graduated rates and non-VAT corporations alike. For individuals, electing the 8% income tax removes it entirely.",lines:[{box:"Base",desc:"Gross sales for the quarter (accrual basis since EOPT)."},{box:"Rate",desc:"3% (ATC PT010) — back at 3% since July 2023 after the CREATE window."}]},{code:"2550Q",name:"Quarterly VAT Return",cat:"business",who:"VAT-registered taxpayers (over ₱3M or by choice)",when:"25 days after each quarter",summary:"Output VAT on your sales less creditable input VAT on purchases, filed quarterly — the monthly 2550M is gone. VAT quarters follow your income-tax year, including fiscal years.",lines:[{box:"Output",desc:"12% VAT on taxable sales (invoice basis for services too, since EOPT)."},{box:"Input",desc:"12% VAT on substantiated purchases, credited against output."}]},{code:"1601-C",name:"Monthly Remittance — Withholding on Compensation",cat:"withholding",who:"Employers withholding from salaries",when:"10th of the following month (Dec: Jan 15)",summary:"Employers remit the income tax withheld from employees' pay every month, then reconcile the year with the annual 1604-C and each employee's 2316. eFPS filers get slightly later staggered dates.",lines:[{box:"Base",desc:"Total compensation paid and total tax withheld for the month."}]},{code:"1604-C",name:"Annual Information Return — Compensation",cat:"withholding",who:"All employers",when:"January 31",summary:"The year-end reconciliation of everything withheld from employees, with the alphalist of employees. Its totals must match your twelve 1601-C filings — mismatches are a classic audit trigger.",lines:[{box:"Alphalist",desc:"Submitted electronically; validate before the deadline."}]},{code:"2316",name:"Certificate of Compensation / Tax Withheld",cat:"withholding",who:"Issued by employers to every employee",when:"To employees by Jan 31 · BIR copies by Feb 28",summary:"The employer's certificate of what each employee earned and what was withheld. With one employer and correct withholding, the signed 2316 stands in for the employee's annual return (substituted filing).",lines:[{box:"Sign",desc:"Both employer and employee sign; keep your copy — it's proof of filing."}]},{code:"0619-E",name:"Monthly Remittance — Expanded Withholding",cat:"withholding",who:"Businesses that withhold from suppliers",when:"10th of the following month (months 1–2 of each quarter)",summary:"Remits creditable tax withheld from suppliers (rent, professional fees, contractors) for the first two months of each quarter. The third month rides on the quarterly 1601-EQ instead.",lines:[{box:"Skip",desc:"No 0619-E for March, June, September, December — those go on the 1601-EQ."}]},{code:"1601-EQ",name:"Quarterly Expanded Withholding Return",cat:"withholding",who:"Withholding agents",when:"Last day of the month after each quarter",summary:"Consolidates the quarter's expanded withholding, credits the two monthly 0619-E remittances, and carries the Quarterly Alphalist of Payees (QAP) via eSubmission.",lines:[{box:"QAP",desc:"Every payee you withheld from, with ATC and amounts."}]},{code:"1604-E",name:"Annual Information Return — Expanded",cat:"withholding",who:"Withholding agents",when:"March 1",summary:"Year-end summary of creditable taxes withheld with the annual alphalist — must reconcile with the four 1601-EQ filings.",lines:[]},{code:"2307",name:"Certificate of Creditable Tax Withheld",cat:"withholding",who:"Issued to suppliers you withheld from; received from clients who withheld from you",when:"Within 20 days of each quarter (or on demand)",summary:"When a client withholds from your fee, the 2307 is your receipt — cash already with the BIR. Claim it on your returns to cut what you owe: list every certificate in a SAWT sent via eSubmission with the return, then upload the scans through eAFS. When you withhold from suppliers, you issue it (e-signatures are valid).",lines:[{box:"Use",desc:"Claim as tax credit on 1701Q/1701A/1701 or corporate returns — with the SAWT."}]},{code:"1709",name:"Related Party Transactions Form",cat:"income",who:"Large taxpayers, incentive-enjoying taxpayers, 3-year loss reporters, and their related parties",when:"With the annual ITR (via eAFS)",summary:"The transfer-pricing disclosure that attaches to the annual return — but only for the four covered groups under RR 34-2020. Most MSMEs are exempt. Covered filers upload it to eAFS in its own RPT file group.",lines:[{box:"TPD",desc:"Separate, higher thresholds decide who must also keep Transfer Pricing Documentation on file (not submitted): sales > ₱150M and RPTs > ₱90M, or per-category RPT amounts."}]},{code:"1603Q",name:"Quarterly Fringe Benefits Tax Return",cat:"withholding",who:"Employers granting benefits to managerial or supervisory employees",when:"Last day of the month after each quarter",summary:"The 35% final tax on the grossed-up value (÷65%) of fringe benefits — car plans, housing, certain allowances — given to managerial or supervisory staff. Rank-and-file benefits run through compensation withholding instead. No attachments ride this return.",lines:[{box:"Gross-up",desc:"Monetary value ÷ 65% × 35% — the employer shoulders the tax."}]},{code:"0619-F / 1601-FQ / 1604-F",name:"Final Withholding series",cat:"withholding",who:"Agents withholding final taxes (dividends, certain interest)",when:"Monthly 10th · quarterly month-end · annual Jan 31",summary:"Monthly remittance for months 1–2 of each quarter (0619-F, due the 10th), quarterly return (1601-FQ, last day of the month after the quarter), and the annual summary (1604-F, January 31 — earlier than the expanded series' March 1). Payees receive 2306 certificates.",lines:[]},{code:"0605",name:"Payment Form",cat:"business",who:"Anyone making a miscellaneous BIR payment",when:"As needed",summary:"The generic form for paying the BIR when no specific return applies — penalties, deficiency assessments, and the like. (The old ₱500 annual registration fee on this form was abolished in 2024.)",lines:[]},{code:"1901",name:"Registration — Self-Employed",cat:"registration",who:"New freelancers, professionals & sole proprietors",when:"Before starting business",summary:"How you register, receive your Certificate of Registration (2303), register books, and choose your tax type — including the 8% election. EOPT abolished the ₱500 annual registration fee; only ₱30 documentary stamp tax on the COR remains. File at the RDO or online via ORUS (orus.bir.gov.ph).",lines:[{box:"Result",desc:"Form 2303 plus authority to issue invoices."},{box:"Bring",desc:"Government ID; DTI certificate if using a trade name."}]},{code:"1902",name:"Registration — Employee",cat:"registration",who:"First-time employees",when:"Within 10 days of hiring",summary:"New hires without a TIN register through their employer using this form.",lines:[]},{code:"1905",name:"Update of Registration",cat:"registration",who:"Anyone changing registered details",when:"When details change",summary:"Updates registered information — RDO transfer, trade name, tax types, books, closure. Under EOPT a transfer takes effect on mere filing: non-business taxpayers file via ORUS or at the new RDO; business taxpayers file with their current RDO, and transfers proceed even with open cases (RMC 91-2024).",lines:[{box:"Closure",desc:"Business closure adds an inventory of unused invoices and ending stock, within 10 days of cessation."}]}],U1=[["all","All"],["income","Income tax"],["business","Business tax"],["withholding","Withholding"],["registration","Registration"]],z1="Return attachments and the BIR eAFS system. Covers what must accompany each filing, through which channel (eAFS / eSubmission / at filing), by when, and what skipping it costs. The per-form matrix in perReturn drives the Forms page; the other blocks appear on the References register. Verified against the RMC 49-2020 → RMC 46-2026 issuance line on the date in meta.json.",W1={value:{what:"BIR web facility (eafs.bir.gov.ph) for submitting the filed ITR, audited FS, and other required attachments as scanned PDFs",who:"Any taxpayer, regardless of filing channel (eFPS, eBIRForms, or manual)",enrollment:"Create an account with the taxpayer's TIN and an official email address; activate via the emailed link",fileFormat:"PDF only, up to 4.8 GB per file",proof:"System-generated Transaction Reference Number (TRN) plus the confirmation email — keep both; they stand in for a manual 'Received' stamp"},legalBasis:["RMC 49-2020 (eAFS introduction)","RMC 82-2020 (fiscal-year & quarterly coverage)","RMC 43-2021 (revised guidelines; RPT & tax-credit groups)","RMC 34-2025 & RMC 20-2026 (eAFS as the default channel for AITR attachments)"],confidence:"verified",notes:"Introduced as an option in 2020; the annual filing RMCs now direct that AITR attachments 'shall be submitted electronically using the eAFS system' — over-the-counter submission to the LT Office/RDO/RCO is reserved for periods when a BIR advisory declares system unavailability (as happened April 2025 and May 2026)."},q1={value:{annual:[{group:"File 1 — Income Tax Return",name:"EAFS<TIN>ITRTY<MM><YYYY>",contains:"The filed AITR; for e-filers, the Filing Reference Number page (eFPS) or email Tax Return Receipt Confirmation (eBIRForms), plus proof of payment"},{group:"File 2 — Audited Financial Statements",name:"EAFS<TIN>AFSTY<MM><YYYY>",contains:"Independent auditor's report, audited FS with notes, and the Statement of Management Responsibility"},{group:"File 3 — Other Attachments",name:"EAFS<TIN>OTHTY<MM><YYYY>-01 … -99",contains:"SAWT eSubmission confirmation, Forms 2307/2304/2316, tax debit memos, proof of prior years' excess credits and foreign tax credits, CETI, and the like"},{group:"RPT Form",name:"EAFS<TIN>RPTTY<MM><YYYY>",contains:"BIR Form 1709 (Related Party Transactions), for covered taxpayers"},{group:"Tax credit documents",name:"EAFS<TIN>TCRTY<MM><YYYY>-01 … -99",contains:"Tax credit certificates and supporting documents"}],quarterly:[{group:"File 1",name:"EAFS<TIN>ITR<Q>Q<MM><YYYY>",contains:"The filed quarterly ITR (or FRN/email confirmation for e-filers)"},{group:"File 3",name:"EAFS<TIN>OTH<Q>Q<MM><YYYY>-01 …",contains:"Scanned 2307s, SAWT confirmation, tax debit memos"}],conventions:"<TIN> = 9-digit TIN without branch code; <MM> = month-end of the taxable year (12 for calendar year); <Q> = quarter number; split oversized groups across the numbered series"},legalBasis:["RMC 49-2020","RMC 82-2020 (MMYYYY fiscal/calendar naming; quarterly groups)","RMC 43-2021 (RPT & TCR groups)"],confidence:"verified",notes:"Example for TIN 123-456-789, CY2025: EAFS123456789ITRTY122025 · EAFS123456789AFSTY122025 · EAFS123456789OTHTY122025-01. The original 2020 naming without the month (…ITRTY2019) is superseded. The portal exposes three upload slots — place RPT/TCR files under the Other Attachments slot using the RMC-prescribed filenames."},H1={value:"Attachments to e-filed income tax returns are due within 15 days from the statutory filing deadline OR from the date of actual e-filing, whichever comes LATER — April 30 for calendar-year annual returns filed on time",legalBasis:["RMC 44-2021","RMC 51-2024 (CY2023)","RMC 34-2025 (CY2024)","RMC 20-2026 (CY2025)"],confidence:"verified",notes:"The BIR's default position is that the attachment deadline is not extended — but season RMCs can override it: for CY2025, RMC 30-2026 moved filing, payment AND attachments to May 15, 2026 (EO 110 energy emergency), RMC 39-2026 made May 15 the uniform eAFS deadline regardless of when the return was e-filed, and RMC 46-2026 gave a penalty-free grace to May 25, 2026 for eAFS system issues. Manually filed returns historically carried their attachments at filing; the current annual RMCs route those through eAFS as well."},V1={value:"Any taxpayer claiming creditable withholding (Form 2307/2304 credits) on an income tax, VAT, or percentage tax return must submit the Summary Alphalist of Withholding Taxes with that return — generated as a .dat file with the BIR data entry module and emailed to esubmission@bir.gov.ph (or attached in eFPS), due when the return itself is due",legalBasis:["RR 2-2006","RMC 3-2006"],confidence:"verified",notes:"Applies to 1701Q/1702Q, 1701/1701A/1702, 2550Q and 2551Q whenever 2307 credits are claimed. The BIR's email validation report is the proof — it is what gets uploaded to eAFS as part of File 3 for annual (and optionally quarterly) ITRs. No SAWT, and the claimed credits are exposed to disallowance."},G1={value:"All VAT-registered taxpayers (no sales threshold) submit quarterly Summary Lists of Sales and Purchases/importations as RELIEF .dat files via eSubmission — due the 25th day after the close of the taxable quarter (30th for eFPS/LTS very peso you owe. Here's how to get it right.",read:"6 min read",date:"June 2026",feature:!0,body:[{kind:"p",text:"When you register as self-employed, the BIR asks how your income should be taxed. There are two roads, and the one you pick quietly shapes every deadline and every peso you owe for the rest of the year."},{kind:"h",text:"The 8% road"},{kind:"p",text:"You pay a flat 8% on your gross receipts above ₱250,000 — and nothing else. No percentage tax, no itemizing, no separate 2551Q. For most freelancers with low overhead, it is both the simplest and the cheapest option."},{kind:"h",text:"The graduated road"},{kind:"p",text:"You pay the regular income-tax brackets on your profit — after either the 40% OSD or your actual expenses — plus a separate 3% percentage tax on gross. It wins when your expenses are high enough to pull your taxable income well down."},{kind:"quote",text:"Rule of thumb: if your real costs sit under about 40% of your income, 8% usually wins. Above that, run both numbers."},{kind:"h",text:"How to actually decide"},{kind:"list",items:["Estimate your gross income for the year.","Estimate your deductible expenses as a share of it.","Run both through the Estimator — it shows the exact peso difference.","Remember the election locks for the year once you file your first quarter."]},{kind:"p",text:"When in doubt, most low-overhead freelancers are well served by 8%: fewer forms, fewer deadlines, and usually a smaller bill."}]},{id:"first-year",cat:"Getting started",title:"Your first year as a registered freelancer",excerpt:"Registering is the easy part. Here is the shape of the twelve months that follow — month by month, without the dread.",read:"8 min read",date:"May 2026",body:[{kind:"p",text:"Registering is the easy part. Knowing what happens next is what keeps people up at night. Here is the shape of your first twelve months."},{kind:"h",text:"Month one — register and set up"},{kind:"p",text:"File Form 1901, receive your Certificate of Registration (2303), and register your books and invoices. Good news: the old ₱500 annual registration fee was scrapped in 2024."},{kind:"h",text:"Every month — contribute and invoice"},{kind:"list",items:["Issue a BIR-registered invoice for every payment you receive.","Pay SSS, PhilHealth and Pag-IBIG — as a freelancer you cover both shares.","Keep your books current so quarter-end is painless."]},{kind:"h",text:"Every quarter — file 1701Q"},{kind:"p",text:"Three times a year you total your income so far, compute the tax, and pay the difference. The calendar in this app counts down each one for you."},{kind:"h",text:"Once a year — the annual return"},{kind:"p",text:"By April 15 you file your annual return (1701A or 1701) reconciling all four quarters. Claim any 2307 certificates your clients gave you — that is tax already paid on your behalf — and upload the scans through the BIR's eAFS portal within 15 days of filing."},{kind:"quote",text:"The whole system rewards small, steady habits. Invoice, set aside, file. Repeat."}]},{id:"2307",cat:"Withholding",title:"What to do with every 2307 your clients hand you",excerpt:"One of the few pieces of BIR paperwork that works in your favour — and the money you lose by ignoring it.",read:"4 min read",date:"May 2026",body:[{kind:"p",text:"A 2307 is one of the rare pieces of BIR paperwork that works in your favour. It is proof that a client already paid part of your tax for you."},{kind:"h",text:"Why it matters"},{kind:"p",text:"When a client withholds — commonly 5% or 10% of your fee — they remit it to the BIR and hand you a 2307. That amount is a credit: it directly reduces what you owe on your quarterly and annual returns."},{kind:"list",items:["Collect every 2307 — chase clients who forget.","Check the amounts and period match your invoices.","Claim them on your 1701Q / 1701A, list them in the SAWT sent via eSubmission, and upload the scans through eAFS."]},{kind:"quote",text:"A drawer full of unclaimed 2307s is just tax you paid twice."}]},{id:"deadlines",cat:"Calendar",title:"The five deadlines that actually matter",excerpt:"The BIR calendar is long. For a low-overhead freelancer, only a handful of dates decide whether you sleep well.",read:"5 min read",date:"April 2026",body:[{kind:"p",text:"The BIR calendar is long, but for a low-overhead freelancer only a handful of dates truly decide whether you sleep well."},{kind:"list",items:["1701Q — quarterly income tax, around May 15, Aug 15 and Nov 15.","1701A — your annual return, every April 15.","Monthly contributions — SSS, PhilHealth and Pag-IBIG.","2551Q — only if you chose graduated rates.","Invoices and books — the quiet daily habit behind all of it."]},{kind:"p",text:"Everything else is either situational or handled for you. Master these five and the rest follows."}]}];function Jf(){const{postId:r}=op(),e=Jt();if(!r){const i=Ta.find(l=>l.feature)||Ta[0],o=Ta.filter(l=>l!==i);return h.jsxs("div",{className:"page wrap",style:{paddingTop:"34px",paddingBottom:"64px"},children:[h.jsxs("div",{style:{marginBottom:"26px"},children:[h.jsx("div",{className:"mono",style:{fontSize:"11.5px",fontWeight:500,letterSpacing:".13em",textTransform:"uppercase",color:"var(--acc)"},children:"The Present Value Journal"}),h.jsx("h1",{style:{fontSize:"30px",fontWeight:800,letterSpacing:"-.025em",marginTop:"10px"},children:"Plain-language tax, for people who'd rather be working"})]}),h.jsxs("div",{className:"card click",onClick:()=>e(`/blog/${i.id}`),style:{borderRadius:"16px",overflow:"hidden",display:"flex",flexWrap:"wrap"},children:[h.jsxs("div",{style:{flex:"1 1 200px",background:"linear-gradient(150deg,var(--brand),var(--brand2))",padding:"28px",display:"flex",flexDirection:"column",justifyContent:"space-between",gap:"22px"},children:[h.jsx("span",{style:{fontSize:"11.5px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"#a9cde6"},children:i.cat}),h.jsxs("span",{className:"mono",style:{fontSize:"12px",color:"#cdddea"},children:[i.read," ·
