reshold, unless the 8% option is elected."},yx={value:"Register as VAT taxpayer before the end of the month following the month the ₱3M threshold was exceeded",legalBasis:["NIRC Sec 236(G)(1)"],confidence:"needs_review",notes:"Once past the threshold you are liable for output VAT whether or not you register on time."},gx={value:"Since EOPT, VAT and percentage tax on services are computed on gross SALES (billed/accrued), no longer on collections",legalBasis:["RA 11976 (EOPT)","RR 3-2024 (effective Apr 27, 2024)","RMC 65-2024 (output-VAT credit mechanics)"],confidence:"verified",notes:"Output VAT on receivables that stay uncollected past the agreed credit term may be deducted from the NEXT quarter's output VAT under the Sec 110(D) conditions (post-Apr 27, 2024 credit sale, written credit term, VAT shown and paid, not claimed as bad debt), and added back if later collected. Pre-Apr 27, 2024 receivables stay on the collection basis."},xx={value:"Quarterly only: BIR Form 2550Q within 25 days after each taxable quarter; the monthly 2550M is no longer required, though optional monthly filing for the first two months of a quarter remains allowed",legalBasis:["NIRC Sec 114(A), as amended by RA 10963 (quarterly from Jan 1, 2023)","RMC 5-2023 (transition)","RMC 52-2023 (optional 2550M: no deadline, no penalty, no open cases)"],confidence:"verified",notes:"Under EOPT (RR 4-2024) returns may be filed and taxes paid anywhere, electronically or at any AAB/RDO, and the old 25% wrong-venue surcharge is gone."},vx={value:"12% VAT applies to digital services consumed in the Philippines, including those of nonresident providers; for B2B purchases the Philippine business must withhold and remit the VAT itself (reverse charge) via BIR Form 1600-VT",legalBasis:["RA 12023 (VAT on Digital Services, Oct 2024)","RR 3-2025 (liability from June 2, 2025)","RMC 47-2025 (registration window)","RMC 59-2026 (exempt-services registration)"],confidence:"verified",notes:"Hits any business buying ads, SaaS, cloud hosting, or marketplace services from nonresident platforms: withhold 12%, remit on Form 1600-VT by the 10th of the following month, and (if VAT-registered) claim it back as input VAT supported by the 1600-VT. Nonresident providers handle B2C sales themselves via the VDS portal (Form 2550-DS). Local digital sellers stay under the ordinary VAT/percentage-tax rules and the ₱3M threshold."},wx={value:500,legalBasis:["NIRC Sec 237, as amended by RA 11976 (EOPT)","RR 7-2024, as amended by RR 11-2024","RMC 77-2024"],confidence:"verified",notes:"An invoice must issue for every sale of ₱500 or more; VAT-registered sellers issue one regardless of amount, and any seller must on the buyer's request. Non-VAT sellers may issue one aggregated end-of-day invoice for the day's sub-₱500 sales. Adjusted for CPI every 3 years from EOPT effectivity; first adjustment expected ~Jan 2027 alongside the ₱3M threshold review."},Vt={$comment:hx,vatRate:fx,vatThreshold:px,percentageTaxRate:mx,vatRegistrationDeadline:yx,servicesAccrualBasis:gx,vatFilingFrequency:xx,digitalServicesVat:vx,invoiceIssuanceThreshold:wx},Sx="Domestic corporation income tax parameters (CREATE / CREATE MORE era).",bx={value:{standardRate:.25,smallCorpRate:.2,smallCorpTaxableIncomeCeiling:5e6,smallCorpAssetCeiling:1e8},legalBasis:["NIRC Sec 27(A), as amended by RA 11534 (CREATE) and RA 12066 (CREATE MORE)","RR 7-2025 (EDR implementation)"],confidence:"verified",notes:"20% applies when net taxable income ≤ ₱5M AND total assets ≤ ₱100M (excluding the land where the business sits); both conditions must hold. CREATE MORE (RA 12066, effective Nov 28, 2024) also gives 20% to registered business enterprises under the enhanced-deduction regime, but only on income from registered projects/activities; non-registered income stays at the regular rate, and EDR RBEs remain subject to the MCIT comparison."},Rx={value:{rate:.02,currentRatesFrom:"2023-07-01",startsInTaxableYear:4,excessCarryForwardYears:3},legalBasis:["NIRC S s by more than 30% or overstating deductions by more than 30% is prima facie fraud: substantialUnderdeclaration, NIRC Sec 248(B)) and is NOT reduced for micro/small taxpayers (only the 25% drops to 10%). The 25% also applies to unpaid deficiency assessments and partial payments, not just late returns."},Ax={value:{standardAnnualRate:.12,standardFrom:"2018-01-01",priorAnnualRate:.2,microSmallAnnualRate:.06,microSmallFrom:"2024-01-22"},legalBasis:["NIRC Sec 249, as amended by RA 10963 (double the BSP legal rate of 6%)","NIRC Sec 249 before RA 10963 (20% a year, for days before Jan 1, 2018)","RR 21-2018","NIRC Sec 249(A), as amended by RA 10963 (proviso: no simultaneous deficiency and delinquency interest)","RA 11976 (EOPT); 50% of the rate for micro & small taxpayers"],confidence:"verified",notes:"12% per annum confirmed current as of October 7, 2026 (in force since TRAIN, Jan 1, 2018); days before Jan 1, 2018 are charged at the old 20%, so a period that spans that date is split. Micro & small taxpayers pay 6% on returns due on or after Jan 22, 2024 (EOPT is not retroactive). Deficiency and delinquency interest never run simultaneously."},Ix={value:{daysInYear:365,startsAfter:"rolledDueDate",convention:"simple interest, actual days / 365"},legalBasis:["NIRC Sec 249(A) (interest runs from the date prescribed for payment until full payment)","RR 21-2018","RMC 65-2016 (a deadline on a weekend or holiday moves to the next working day)"],confidence:"needs_review",notes:"Interest counts each day from the day after the due date through the payment date. When the due date falls on a weekend or holiday it first moves to the next working day, and interest counts from the day after that working day (RMC 65-2016). Days are divided by 365, also in leap years: this is a default not yet confirmed against the RR 21-2018 illustrations or eBIRForms (on a 366-day basis, a year late across Feb 29 gives ₱12,000.00 instead of ₱12,032.88 per ₱100,000 at 12%). When the rate changes during the period (20% to 12% on Jan 1, 2018), each part is computed and rounded to the centavo separately and the parts are added."},Px={value:{reducedRatesBasis:"rolledDueDate",taxDueBeforeStillUnpaid:"dueDateRatesForWholePeriod"},legalBasis:["RA 11976 (EOPT), effective Jan 22, 2024 (prospective)","RR 6-2024 (effective Apr 27, 2024)"],confidence:"needs_review",notes:"Micro & small taxpayers get the 10% surcharge and 6% interest only for returns due on or after Jan 22, 2024 (the due date after moving off a weekend or holiday). Default not yet confirmed: tax that fell due before Jan 22, 2024 and is still unpaid after it keeps the rates in force on its due date (25% surcharge, 12% interest) for the whole period, with no switch to 6%. Also unconfirmed: whether returns due between Jan 22 and Apr 26, 2024 (before RR 6-2024 took effect) get the reduced rates; the calculator gives them."},Mx={value:[{taxDueUpTo:5e3,amount:1e3},{taxDueUpTo:1e4,amount:3e3},{taxDueUpTo:2e4,amount:5e3},{taxDueUpTo:5e4,amount:1e4},{taxDueUpTo:1e5,amount:15e3},{taxDueUpTo:5e5,amount:2e4},{taxDueUpTo:1e6,amount:3e4},{taxDueUpTo:5e6,amount:4e4},{taxDueUpTo:null,amount:5e4}],legalBasis:["RMO 7-2015 Annex A (failure to file/pay, NIRC Sec 255), confirmed still the operative schedule as of Aug 2026, superseding RMO 19-2007","RR 6-2024: the 50% compromise reduction for micro & small taxpayers covers only invoicing violations (NIRC Secs 113, 237 and 238) not involving fraud, so it does not apply to late filing or payment"],confidence:"verified",notes:"Compromise penalties are settlements in lieu of criminal prosecution and are consensual/negotiable; the schedule is the BIR's standard ask. The schedule follows RMO 7-2015 Annex A and is the same for every taxpayer size: late filing or payment is a Sec 255 violation, which the EOPT 50% reduction does not cover. A tax due of ₱0 (nil return filed late) falls in the first tier (₱1,000). The schedule covers only violations that do not involve fraud: for a willfully false or fraudulent return (50% surcharge) the calculator shows the compromise as not on the standard schedule, since such a case may be referred for prosecution instead. Still worth a CPA's eye before quoting a client."},Fx={value:{micro:{grossSalesBelow:3e6},small:{grossSalesFrom:3e6,grossSalesBelow:2e7},medium:{grossSalesFrom:2e7,grossSalesBelow:1e9},large:{grossSalesFrom:1e9}},legalBasis:["RA 11976 (EOPT)","RR 8-2024"],confidence:"verified",notes:"Classification is by gross sales (business income only); micro & small taxpayers get the reduced surcharge/interest, halved Sec 250 penalties, and 50% off the compromise penalty for invoicing violations only (Secs 113, 237 and 238, not involving fraud). The compromise for late filing or payment (Sec 255) is not reduced. The classification is independent of Top Withholding Agent designation; a 'small' taxpayer can still be a TWA."},Ox={value:{standardPerFailure:1e3,standardAnnualCap:25e3,microSmallPerFailure:500,microSmallAnnualCap:12500},legalBasis:["NIRC Sec 250","RA 11976 (EOPT) & RR 6-2024 (halved amounts for micro & small taxpayers)"],confidence:"verified",notes:"₱1,000 for EACH failure to file an information return, statement, list, or required attachment (SAWT, SLSP, QAP, alphalists, eAFS uploads), capped at ₱25,000 aggregate per calendar year (₱500 per failure / ₱12,500 cap for micro & small taxpayers). The amounts are per failure, not a flat cap. Late attachments don't make a timely-filed return late; the exposure is this penalty plus credit-disallowance and deemed-not-filed risks."},jt={$comment:Ex,surcharge:Nx,interest:Ax,interestDayCount:Ix,eoptTransition:Px,compromiseTiers:Mx,classification:Fx,infoReturnPenalty:Ox},Dx="SSS / PhilHealth / Pag-IBIG contribution parameters. These change on statutory schedules; reconcile each block against the current circulars when updating.",Bx={value:{totalRate:.15,employerRate:.1,employeeRate:.05,mscFloor:5e3,mscCeiling:35e3,mscStep:500,wispThreshold:2e4,ec:[{mscBelow:15e3,am s with the return via eSubmission (RR 2-2006); scanned 2307s may be lodged through eAFS quarterly groups."},{"id":"bir-1701a-annual","title":"File annual income tax return","desc":"Simplified annual return for purely self-employed individuals on the 8% rate or graduated rates with OSD, reconciling all quarterly filings and 2307 credits.","form":"1701A","agency":"BIR","category":"income","appliesTo":{"allOf":["type:individual"],"noneOf":["itemized"]},"schedule":{"kind":"annual_fixed","month":4,"day":15},"legalBasis":["NIRC Sec 51(C), as amended","RMC 17-2019 (Form 1701A availability)"],"confidence":"verified","notes":"Income tax due above ₱2,000 may be paid in two equal installments: at filing, and on or before October 15 (NIRC Sec 56(A)(2), as amended by TRAIN). Attachments (SAWT confirmation, 2307s) go to eAFS within 15 days of the statutory deadline or the actual e-filing date, whichever comes later; see the attachments deadline on this calendar. No FS attach on the 8% option or OSD."},{"id":"bir-1701-annual","title":"File annual income tax return","desc":"Full annual return for mixed-income earners and individuals claiming itemized deductions, reconciling all quarterly filings and credits.","form":"1701","agency":"BIR","category":"income","appliesTo":{"allOf":["individual-business"],"anyOf":["itemized","type:mixed"]},"schedule":{"kind":"annual_fixed","month":4,"day":15},"legalBasis":["NIRC Sec 51(C), as amended"],"confidence":"verified","notes":"Attach Form 2316 from your employer (mixed income) and SAWT with 2307s where credits are claimed (the SAWT itself is filed via eSubmission with the return). Itemized-deduction filers attach financial statements: audited with SMR when gross sales exceed ₱3M, not necessarily audited (or the AIF) at or below; only 8%/OSD filers attach no FS at all (NIRC Sec 232; RR 16-2008). Attachments go to eAFS within 15 days of the statutory deadline or actual e-filing, whichever comes later, a separately dated item on this calendar."},{"id":"bir-sawt-individual","title":"Submit SAWT with each income tax return","desc":"Summary Alphalist of Withholding Taxes: the alphalist of every 2307 certificate claimed as a credit, filed via eSubmission together with the quarterly 1701Q and the annual return.","form":"SAWT","agency":"BIR","category":"income","appliesTo":{"allOf":["individual-business","receives-2307"]},"schedule":{"kind":"quarterly_fixed","entries":[{"label":"Annual","month":4,"day":15},{"label":"Q1","month":5,"day":15},{"label":"Q2","month":8,"day":15},{"label":"Q3","month":11,"day":15}]},"legalBasis":["RR 2-2006","RMC 3-2006"],"confidence":"verified","notes":"Due whenever a return claims 2307 credits: a .dat file built with the BIR data entry module and emailed to esubmission@bir.gov.ph (or attached in eFPS), due when the return itself is due. The April 15 occurrence rides the annual 1701/1701A. Keep the email validation report: it is the proof uploaded to eAFS with the scanned 2307s. No SAWT and the claimed credits are exposed to disallowance. Also rides the 2550Q/2551Q on the rarer occasions withholding is credited on those returns. Nothing claimed for a period, nothing due."},{"id":"bir-1700-annual","title":"File annual income tax return (compensation)","desc":"Employees outside substituted filing (e.g. two or more employers during the year) file their own annual return on compensation income.","form":"1700","agency":"BIR","category":"income","appliesTo":{"allOf":["files-1700"]},"schedule":{"kind":"annual_fixed","month":4,"day":15},"legalBasis":["NIRC Sec 51(A)(2), as amended","RR 8-2018"],"confidence":"verified","notes":""},{"id":"bir-2316-collect","title":"Collect BIR Form 2316 from your employer","desc":"Your employer's certificate of compensation paid and tax withheld; with one employer and correct withholding it doubles as your filed return.","form":"2316","agency":"BIR","category":"income","appliesTo":{"allOf":["type:employee"]},"schedule":{"kind":"annual_fixed","month":1,"day":31},"legalBasis":["NIRC Sec 83, as amended","RR 2-98 Sec 2.83.1, as amended by RR 11-2018"],"confidence":"verified","notes":"Employers must issue the certificate on or before January 31 of the following year, or on the day of last payment for terminated employment."},{"id":"bir-1702q","title":"File & pay quarterly corporate income tax","desc":"Cumulative corporate income tax for the taxable year to date, less prior quarterly payments and creditable withholding.","form":"1702Q","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3],"daysAfterEnd":60},"legalBasis":["NIRC Sec 75 & 77(B), as amended"],"confidence":"verified","notes":"Due within 60 days following the close of each of the first three quarters of the taxable year, calendar or fiscal. SAWT via eSubmission when 2307 credits are claimed; scanned 2307s may go through eAFS quarterly groups (RMC 82-2020)."},{"id":"bir-1702-annual","title":"File annual corporate income tax return","desc":"Year-end corporate return: regular corporate income tax compared against the minimum corporate income tax where applicable.","form":"1702-RT","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"annual_fy","monthsAfterEnd":4,"day":15},"legalBasis":["NIRC Sec 77(B), as amended"],"confidence":"verified","notes":"Due the 15th day of the fourth month following the close of the taxable year (April 15 for calendar-year corporations). Variants: 1702-EX (exempt), 1702-MX (mixed/special-rate regimes; RBEs attach the CETI). Attachments include FS + SMR (audited only when gross sales exceed ₱3M per NIRC Sec 232, though FS attach even on OSD per RR 16-2008), SAWT/2307s, and Form 1709 for covered related-party taxpayers; these go to eAFS within 15 days of the deadline or actual e-filing, whichever comes later (fiscal-year naming per RMC 82-2020); a separately dated item on this calendar. E-filing is mandatory for all corporations (RMC 20-2026)."},{"id":"bir-sawt-corp-quarterly","title":"Submit SAWT with the quarterly income tax return","desc":"Summary Alphalist of Withholding Taxes: the alphalist of every 2307 certificate claimed as a credit on the 1702Q, filed via eSubmission with the return.","form":"SAWT","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation","receives-2307"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3],"daysAfterEnd":60},"legalBasis":["RR 2-2006","RMC 3-2006"],"confidence":"verified","notes":"Due with each 1702Q (within 60 days of the close of each of the first three quarters, following the corporation's taxable year) whenever 2307 credits are claimed for the quarter; nothing claimed, nothing due. A .dat file via eSubmission (esubmission@bir.gov.ph) or eFPS; scanned 2307s may go through eAFS quarterly groups (RMC 82-2020)."},{"id":"bir-sawt-corp-annual","title":"Submit SAWT with the annual income tax return","desc":"Summary Alphalist of Withholding Taxes: the alphalist of every 2307 certificate claimed as a credit on the annual 1702, filed via eSubmission with the return.","form":"SAWT","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation","receives-2307"]},"schedule":{"kind":"annual_fy","monthsAfterEnd":4,"day":15},"legalBasis":["RR 2-2006","RMC 3-2006"],"confidence":"verified","notes":"Due with the annual return, the 15th day of the fourth month after year-end. Keep the email validation report; it goes to eAFS (Other Attachments group) with the scanned 2307s within the 15-day attachment window. No SAWT and the claimed credits are exposed to disallowance."},{"id":"bir-eafs-itr-attachments-individual","title":"Submit annual ITR attachments via eAFS","desc":"Scanned attachments to the annual return: SAWT eSubmission confirmation, 2307s and 2304s, 2316 (mixed income / 1700 filers), for itemized-deduction filers the FS (audited above ₱3M gross sales, unaudited below), plus tax debit memos and credit proofs where applicable, uploaded to eAFS in the prescribed PDF file groups.","form":"via eAFS","agency":"BIR","category":"income","appliesTo":{"anyOf":["individual-business","files-1700"]},"schedule":{"kind":"annual_fixed","month":4,"day":30},"legalBasis":["RMC 44-2021 (15 days from the statutory deadline or actual e-filing, whichever is later)","RMC 49-2020 & RMC 82-2020 (eAFS file groups & naming)","RMC 20-2026 (CY2025 guidelines; eAFS as the default channel)"],"confidence":"verified","notes":"April 30 is the date for returns filed by April 15; file the return late and the 15-day window runs from the actual e-filing date instead. Only 'if applicable': nothing to upload means nothing due. Skipping it costs ₱1,000 per document (₱500 for micro/small taxpayers) and puts claimed 2307 credits at risk; season RMCs occasionally move the date (May 15, 2026 for CY2025 per RMC 30-2026/39-2026)."},{"id":"bir-annual-itr-2nd-installment","title":"Pay the 2nd installment of annual income tax (only if you paid half with your return)","desc":"If the income tax due on your annual return (1700, 1701 or 1701A) was over ₱2,000, you may pay half when you file and the other half by October 15. Skip this if you paid the full amount with your return.","form":"2nd installment","agency":"BIR","category":"income","appliesTo":{"anyOf":["individual-business","files-1700"]},"schedule":{"kind":"annual_fixed","month":10,"day":15},"conditional":true,"ruleRef":"income-tax.annualITRInstallment","legalBasis":["NIRC Sec 56(A)(2), as amended by RA 10963 (TRAIN)"],"confidence":"verified","notes":"Individuals only (corporations pay in full). The choice is made on the annual return by entering the amount deferred to the second installment; the balance is due on or before October 15 of the year the return is filed. Paying it late brings the surcharge and interest on the unpaid half."},{"id":"bir-eafs-itr-attachments-corp","title":"Submit annual ITR attachments via eAFS","desc":"Corporate annual-return attachments: the FS with SMR (audited with auditor's report when gross sales exceed ₱3M), SAWT confirmation with 2307s and 2304s, Form 1709, CETI, tax debit memos and credit proofs where applicable, uploaded to eAFS in the prescribed PDF file groups.","form":"via eAFS","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"annual_fy","monthsAfterEnd":4,"day":30},"legalBasis":["RMC 44-2021 (15 days from the statutory deadline or actual e-filing, whichever is later)","RMC 82-2020 (fiscal-year eAFS naming)","RMC 43-2021 (RPT & tax-credit file groups)"],"confidence":"verified","notes":"15 days after the annual return's due date (April 30 for calendar-year corporations filing by April 15); a late-filed return runs the window from actual e-filing instead. The eAFS Transaction Reference Number doubles as the BIR-received proof the SEC accepts with the AFS."},{"id":"bir-2551q","title":"File & pay quarterly percentage tax","desc":"3% of gross quarterly sales or receipts for non-VAT taxpayers under the VAT threshold who have not elected the 8% income tax option.","form":"2551Q","agency":"BIR","category":"business","appliesTo":{"allOf":["business","nonvat"],"noneOf":["regime:8pct"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 116 & 128(A)(1), as amended by RA 11534 (CREATE)"],"confidence":"verified","notes":"Within 25 days after the close of each taxable quarter. Electing the 8% option removes this filing entirely for the year."},{"id":"bir-2550q","title":"File & pay quarterly VAT","desc":"Output VAT on sales less creditable input VAT for the taxable quarter.","form":"2550Q","agency":"BIR","category":"business","appliesTo":{"allOf":["business","vat"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 114(A), as amended by RA 10963 (TRAIN) & RA 11976 (EOPT)","RR 3-2024"],"confidence":"verified","notes":"Quarterly filing only; the monthly 2550M has not been required since January 2023, though RMC 52-2023 still allows optional monthly filing for the first two months of a quarter. Since April 27, 2024 the VAT base for services is gross SALES (billed/accrual), with an output-VAT credit for receivables that stay uncollected past the agreed period (Sec 110(D), RMC 65-2024)."},{"id":"bir-slsp","title":"Submit the Summary List of Sales & Purchases (SLSP)","desc":"Quarterly electronic list of sales, purchases, and importations, required of all VAT-registered taxpayers, filed via eSubmission alongside the 2550Q.","form":"SLSP","agency":"BIR","category":"business","appliesTo":{"allOf":["business","vat"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 114(C)","RR 16-2005 Sec 4.114-3, as amended by RR 1-2012 (all VAT taxpayers, no threshold)"],"confidence":"verified","notes":"Confirmed still required as of Aug 2026; no e-invoicing issuance has retired it (the first RR 11-2025 group only becomes mandatory Dec 31, 2026). RELIEF .dat files via eSubmission, due the 25th after the quarter (30th for eFPS/LTS filers); submit zero lists for quiet quarters. Taxpayers already transmitting to the EIS (RR 8-2022) are relieved of the sales list only. ₱1,000 per unfiled list, capped ₱25,000/year."},{"id":"bir-einvoicing","title":"Be ready for mandatory e-invoicing","desc":"Taxpayers in e-commerce (except micro), large taxpayers, and users of computerized accounting systems must issue structured electronic invoices by the compliance deadline.","form":"EIS","agency":"BIR","category":"admin","appliesTo":{"anyOf":["books:cas","crm-pos"]},"schedule":{"kind":"once","date":"2026-12-31","noWeekendShift":true},"legalBasis":["NIRC Sec 237-A, as amended by CREATE MORE (RA 12066)","RR 11-2025","RR 26-2025 (amends RR 11-2025; keeps the Dec 31, 2026 deadline)","RMC 98-2026 (Sept 22, 2026: coverage and operating rules)"],"confidence":"needs_review","notes":"Coverage shown here is approximate (CAS/POS users; also e-commerce sellers above micro size and large taxpayers). The Dec 31, 2026 date for the first covered group was reconfirmed in October 2026 (RR 26-2025 keeps it), but confirm whether this taxpayer is covered; until then SLSP/eSubmission duties continue unchanged."},{"id":"bir-1601c","title":"Remit withholding tax on compensation","desc":"Income tax withheld from employees' pay for the month.","form":"1601-C","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"monthDayOverrides":{"12":15},"calendarBasis":true},"legalBasis":["NIRC Sec 81, as amended","RR 2-98 Sec 2.81, as amended by RR 11-2018"],"confidence":"verified","notes":"Due the 10th day of the month following the month withheld, except December's, due January 15. eFPS filers follow slightly later staggered dates (RR 26-2002); the dates shown are the earlier non-eFPS deadlines."},{"id":"bir-1604c","title":"File annual information return (compensation)","desc":"Year-end summary of all compensation paid and tax withheld, with the employee alphalist. Must reconcile with the twelve 1601-C filings.","form":"1604-C","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["NIRC Sec 83, as amended","RR 11-2018"],"confidence":"verified","notes":"Alphalist submitted electronically via the BIR Alphalist Data Entry & Validation Module (v7.4 per RMC 15-2025, patched Nov 2025 and Jan 2026; re-validate after each patch) through eSubmission. The alphalist is an integral part of the return: one that fails validation is deemed not received and the return treated as not validly filed."},{"id":"bir-2316-issue","title":"Issue Form 2316 to every employee","desc":"Certificate of compensation paid and tax withheld for each employee for the prior year, signed by both employer and employee.","form":"2316","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.83.1, as amended by RR 11-2018"],"confidence":"verified","notes":""},{"id":"bir-2316-submit","title":"Submit employees' 2316 copies to the BIR","desc":"Scanned copies of substituted-filing employees' signed 2316s, with the notarized sworn declaration (Annex C, RR 2-2015) and the certified list of employees qualified for substituted filing (Annex F, RR 11-2018).","form":"2316","agency":"BIR","category":"withholding","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":2,"day":28,"calendarBasis":true},"legalBasis":["RR 11-2013","RR 2-2015 as amended by RR 16-2021 (scanned copies/eAFS/USB)","RMC 117-2021 (one mode per period)","RMC 29-2024 (only the two annexes may be required; both signatures mandatory)"],"confidence":"verified","notes":"Not later than February 28 following the close of the calendar year, for substituted-filing employees. Scans must bear BOTH employer and employee signatures (e-signatures valid per RMC 29-2021; unsigned employee copies no longer accepted per RMC 29-2024). Accepted modes: eAFS scanned PDFs, DVD-R, or USB, one mode per period; files named Surname_TIN_TaxablePeriod, alphabetical."},{"id":"bir-0619e","title":"Remit expanded withholding tax","desc":"Creditable tax withheld from suppliers (rent, professional fees, contractors) for the first two months of each quarter.","form":"0619-E","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"skipQuarterMonths":[3],"calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Only months 1 and 2 of each calendar quarter; the third month is picked up by the quarterly 1601-EQ. eFPS filers have staggered dates (RR 26-2002); shown are non-eFPS deadlines."},{"id":"bir-1601eq","title":"File quarterly expanded withholding tax return","desc":"Quarterly consolidation of all expanded withholding, crediting the two monthly 0619-E remittances, with the Quarterly Alphalist of Payees (QAP).","form":"1601-EQ","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"monthAfterEnd":1,"day":"last","calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Due the last day of the month following the close of the calendar quarter. The QAP is an integral part of the return, due the same date, tracked as its own item on this calendar."},{"id":"bir-qap","title":"Submit the Quarterly Alphalist of Payees (QAP)","desc":"Electronic alphalist of every payee withheld from during the quarter, with ATCs and amounts, an integral part of the 1601-EQ / 1601-FQ, prepared with the BIR Alphalist Data Entry & Validation Module and filed via eSubmission.","form":"QAP","agency":"BIR","category":"withholding","appliesTo":{"anyOf":["ewt","fwt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"monthAfterEnd":1,"day":"last","calendarBasis":true},"legalBasis":["RR 11-2018","RR 1-2014 & RMC 5-2014 (alphalist integral to the return)","RMC 15-2025 (Alphalist Data Entry & Validation Module v7.4)"],"confidence":"verified","notes":"Due with the quarterly withholding return: the last day of the month after each calendar quarter, alongside the 1601-EQ (expanded) and/or 1601-FQ (final). A QAP that fails validation or doesn't conform to the format is deemed NOT received and the return treated as not validly filed, putting the related expense deductions at risk. Module v7.4 was patched Nov 2025 and Jan 2026; re-validate .dat files after each patch."},{"id":"bir-1604e","title":"File annual information return (expanded withholding)","desc":"Year-end summary of creditable (expanded) taxes withheld with the payee alphalist. Must reconcile with the four 1601-EQ filings.","form":"1604-E","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"annual_fixed","month":3,"day":1,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.83.2, as amended","RR 11-2018"],"confidence":"verified","notes":""},{"id":"bir-2307-issue","title":"Issue 2307 certificates to payees","desc":"Certificate of creditable tax withheld for each supplier you withheld from during the quarter.","form":"2307","agency":"BIR","category":"withholding","appliesTo":{"allOf":["ewt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":20,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.58(B), as amended by RR 11-2018"],"confidence":"verified","notes":"Within 20 days from the close of the quarter, or upon the payee's request together with the income payment."},{"id":"bir-0619f","title":"Remit final withholding tax","desc":"Final taxes withheld (e.g. on dividends or certain interest) for the first two months of each quarter.","form":"0619-F","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"skipQuarterMonths":[3],"calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Only months 1 and 2 of each quarter; the third month is picked up by the quarterly 1601-FQ."},{"id":"bir-1601fq","title":"File quarterly final withholding tax return","desc":"Quarterly consolidation of final withholding, crediting monthly 0619-F remittances, with the Quarterly Alphalist of Payees (QAP).","form":"1601-FQ","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"monthAfterEnd":1,"day":"last","calendarBasis":true},"legalBasis":["NIRC Sec 58(A), as amended by RA 10963","RR 11-2018"],"confidence":"verified","notes":"Due the last day of the month following the close of the calendar quarter. Like the 1601-EQ, it carries the Quarterly Alphalist of Payees (QAP) via eSubmission, tracked as its own item on this calendar."},{"id":"bir-1604f","title":"File annual information return (final withholding)","desc":"Year-end summary of final taxes withheld, with alphalist.","form":"1604-F","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["RR 11-2018","RMC 73-2019 (1604-F introduction)"],"confidence":"verified","notes":""},{"id":"bir-2306-issue","title":"Issue 2306 certificates to payees","desc":"Certificate of final tax withheld for each payee subjected to final withholding during the year.","form":"2306","agency":"BIR","category":"withholding","appliesTo":{"allOf":["fwt"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"calendarBasis":true},"legalBasis":["RR 2-98 Sec 2.58(B), as amended by RR 11-2018"],"confidence":"verified","notes":"On or before January 31 of the year following the year the income payment was made, or upon the payee's request together with the payment. The creditable-withholding counterpart, the 2307, is issued quarterly instead."},{"id":"sss-employer","title":"Remit SSS contributions (employer)","desc":"Employer and employee shares of SSS contributions for the prior month, including the employees' compensation (EC) premium.","form":"SSS R-5/PRN","agency":"SSS","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":"last","monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11199 (Social Security Act of 2018)","SSS Circular 2019-012 (unified payment deadlines under the PRN regime)"],"confidence":"verified","notes":"Employers pay on or before the last day of the month following the applicable month (re-verified Aug 26, 2026). Generate the PRN in the My.SSS portal before paying."},{"id":"philhealth-employer","title":"Remit PhilHealth premiums (employer)","desc":"Employer and employee shares of PhilHealth premiums for the prior month.","form":"PhilHealth SPA/EPRS","agency":"PhilHealth","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":15,"monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11223 (Universal Health Care Act)","PhilHealth Circular No. 0001, s. 2014 (staggered windows by PEN)"],"confidence":"verified","notes":"Staggered by PhilHealth Employer Number: PEN ending 0–4 remit on the 11th–15th, PEN 5–9 on the 16th–20th of the following month (re-verified Aug 26, 2026). The 15th is shown as the safe-side date; check your exact window in EPRS."},{"id":"pagibig-employer","title":"Remit Pag-IBIG contributions (employer)","desc":"Employer and employee shares of Pag-IBIG (HDMF) savings for the prior month.","form":"Pag-IBIG MCRF","agency":"Pag-IBIG","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"calendarBasis":true},"legalBasis":["RA 9679 (HDMF Law)","HDMF Circular 275 (remittance staggered by first letter of the employer's registered name)"],"confidence":"verified","notes":"Staggered by the first letter of the employer's REGISTERED name, in the month after the period: A–D the 10th–14th, E–L 15th–19th, M–Q 20th–24th, R–Z and numerals 25th–month-end. The 10th is shown as the safe-side date covering every window; check your own letter's window."},{"id":"sss-self","title":"Pay SSS contributions (self-employed)","desc":"Self-employed members pay their own SSS contribution based on their declared monthly earnings.","form":"SSS PRN","agency":"SSS","category":"payroll","appliesTo":{"allOf":["self-contributions"]},"schedule":{"kind":"monthly","day":"last","monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11199","SSS Circular 2019-012 (payment deadlines)"],"confidence":"verified","notes":"Self-employed and voluntary members pay the full 15% themselves, monthly (last day of the following month, shown here) or quarterly (last day of the month following the quarter). OFW members get longer windows (Jan–Sep payable to Dec 31; Oct–Dec to Jan 31)."},{"id":"philhealth-self","title":"Pay PhilHealth premiums (self-employed)","desc":"Direct contributors paying their own premium on declared monthly income.","form":"PhilHealth SPA","agency":"PhilHealth","category":"payroll","appliesTo":{"allOf":["self-contributions"]},"schedule":{"kind":"monthly","day":"last","monthOffset":1,"calendarBasis":true},"legalBasis":["RA 11223","PhilHealth Circular 2020-0014"],"confidence":"needs_review","notes":"Quarterly, semi-annual, and annual payment options are also available."},{"id":"pagibig-self","title":"Pay Pag-IBIG regular savings (self-employed)","desc":"Self-employed members remit their own regular monthly Pag-IBIG savings.","form":"Pag-IBIG savings","agency":"Pag-IBIG","category":"payroll","appliesTo":{"allOf":["self-contributions"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"calendarBasis":true},"legalBasis":["RA 9679"],"confidence":"needs_review","notes":"This is the regular monthly Pag-IBIG savings, not MP2 (Pag-IBIG's separate voluntary savings program). The name of the payment channel is not yet confirmed: check with Pag-IBIG."},{"id":"dole-13th-month","title":"Pay 13th month pay","desc":"All rank-and-file employees who worked at least one month in the year must receive 13th month pay.","form":"—","agency":"DOLE","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":12,"day":24,"calendarBasis":true,"noWeekendShift":true,"periodBasis":"current_year"},"legalBasis":["PD 851","DOLE Labor Advisory (annual)"],"confidence":"verified","notes":"Due on or before December 24; this deadline does NOT move later for weekends; pay earlier instead."},{"id":"dole-13th-month-report","title":"Report 13th-month compliance to DOLE","desc":"Employers report 13th-month payment compliance through the DOLE establishment report system.","form":"DOLE online report","agency":"DOLE","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":1,"day":15,"calendarBasis":true},"legalBasis":["PD 851 IRR","DOLE Labor Advisory No. 16-2025 (report via reports.dole.gov.ph by Jan 15, 2026, reiterated annually)"],"confidence":"verified","notes":"January 15 of the following year has held across recent annual advisories; the report goes through the DOLE Establishment Report System (reports.dole.gov.ph). Watch each December's advisory for the odd change."},{"id":"lgu-business-permit","title":"Renew business / mayor's permit","desc":"Annual renewal of the LGU business permit and payment of local business tax for the year.","form":"LGU","agency":"LGU","category":"registration","appliesTo":{"allOf":["lgu"]},"schedule":{"kind":"annual_fixed","month":1,"day":20,"periodBasis":"current_year"},"legalBasis":["Local Government Code (RA 7160) Sec 167"],"confidence":"verified","notes":"Local business taxes accrue January 1 and are payable within the first 20 days of January. Many LGUs allow quarterly installments (within the first 20 days of each quarter). Barangay clearance is secured first."},{"id":"lgu-cedula","title":"Pay community tax (cedula)","desc":"Yearly community tax for individuals who work for an employer, run a business or practice a profession, and for corporations.","form":"CTC","agency":"LGU","category":"registration","appliesTo":{"anyOf":["business","type:employee"]},"schedule":{"kind":"annual_fixed","month":2,"day":"last","periodBasis":"current_year"},"legalBasis":["Local Government Code (RA 7160) Secs 156-164","Local Government Code (RA 7160) Sec 157 (individuals regularly employed on a wage or salary)"],"confidence":"needs_review","notes":"Accrues January 1; payable without interest until the last day of February. Employees are included because LGC Sec 157 covers individuals regularly employed on a wage or salary for at least 30 consecutive working days in the year (the Code text was not re-checked for this release, so this is flagged for review)."},{"id":"lgu-ptr","title":"Renew Professional Tax Receipt (PTR)","desc":"Annual professional tax for PRC-licensed professionals practicing their profession.","form":"PTR","agency":"LGU","category":"registration","appliesTo":{"allOf":["ptr"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"periodBasis":"current_year"},"legalBasis":["Local Government Code (RA 7160) Sec 139"],"confidence":"verified","notes":"Payable on or before January 31 to the province/city where the professional practices."},{"id":"bir-looseleaf-books","title":"Submit bound loose-leaf books","desc":"Permanently bound copies of last year's loose-leaf books of accounts, with a sworn statement.","form":"via ORUS","agency":"BIR","category":"admin","appliesTo":{"allOf":["books:looseleaf"]},"schedule":{"kind":"annual_fy","daysAfterEnd":15},"legalBasis":["RMC 68-2017","RMC 3-2023 (ORUS registration, QR stamp)","RMC 4-2026 (one-off extension of the Jan 2026 deadline to Jan 31)"],"confidence":"verified","notes":"Within 15 days after the end of the taxable year (January 15 for calendar-year taxpayers; the Jan 2026 round was extended one-off to Jan 31 for ORUS outages). Registration runs through ORUS; the QR 'stamp' goes on the first page of the bound volume; the bound books themselves go to your RDO with the sworn statement."},{"id":"bir-cas-books","title":"Register computerized books of accounts","desc":"Annual registration/submission of computerized books and other accounting records in electronic format.","form":"via ORUS","agency":"BIR","category":"admin","appliesTo":{"allOf":["books:cas"]},"schedule":{"kind":"annual_fy","daysAfterEnd":30},"legalBasis":["RMC 5-2021","RMC 3-2023"],"confidence":"verified","notes":"Within 30 days from the close of the taxable year (January 30 for calendar-year taxpayers)."},{"id":"bir-inventory-list","title":"Submit annual inventory list","desc":"Detailed list of ending inventory (goods, materials, supplies) as of year-end.","form":"via eSubmission/RDO","agency":"BIR","category":"admin","appliesTo":{"allOf":["inventory"]},"schedule":{"kind":"annual_fy","daysAfterEnd":30},"legalBasis":["RMC 57-2015"],"confidence":"verified","notes":"Within 30 days following the close of the taxable year (January 30 for calendar-year taxpayers)."},{"id":"sec-afs-calendar","title":"File audited financial statements with the SEC","desc":"Annual audited FS filed through the SEC's eFAST system, with one uniform deadline for calendar-year corporations, set by the year's SEC memorandum circular.","form":"SEC eFAST","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec","fy:calendar"]},"schedule":{"kind":"annual_fixed","month":5,"day":29},"legalBasis":["Revised Corporation Code Sec 177","SRC Rule 68","SEC MC 9-2026 (Feb 11, 2026: single uniform date via eFAST; FY2025's May 29 was revised to June 15, 2026 after the BIR's AITR extension)"],"confidence":"needs_review","notes":"The SEC sets the exact date each year by memorandum circular; the old last-digit staggering is gone, but the date can move mid-year (FY2025: May 29 → June 15, 2026). Later years shown at May 29 until each year's MC issues. Attach the BIR eAFS Transaction Reference Number in lieu of a BIR-stamped AFS. PSE-listed/public companies follow the 105-day SEC Form 17-A rule instead. Corporations with total assets or total liabilities under ₱600,000 file FS certified under oath by the treasurer/CFO instead of audited (RCC Sec 177)."},{"id":"sec-afs-fiscal","title":"File audited financial statements with the SEC","desc":"Fiscal-year corporations file audited FS via eFAST within 120 calendar days of fiscal year-end.","form":"SEC eFAST","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec","fy:fiscal"]},"schedule":{"kind":"annual_fy","daysAfterEnd":120},"legalBasis":["Revised Corporation Code Sec 177","SRC Rule 68","SEC MC 9-2026"],"confidence":"verified","notes":"Within 120 calendar days from the end of a fiscal year other than December 31 (per the annual SEC MC, most recently MC 9-2026). Corporations with total assets or total liabilities under ₱600,000 file FS certified under oath by the treasurer/CFO instead of audited (RCC Sec 177)."},{"id":"sec-gis","title":"File the General Information Sheet (GIS)","desc":"Within 30 calendar days from the annual stockholders' (or members') meeting, via eFAST.","form":"SEC GIS","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec"]},"schedule":{"kind":"ongoing"},"legalBasis":["Revised Corporation Code Sec 177","SEC MC 9-2026 (30 calendar days from the actual annual meeting, via eFAST)"],"confidence":"verified","notes":"The due date depends on your annual meeting date (often fixed in the by-laws). Diary it 30 days after the meeting; file through eFAST."},{"id":"bir-8pct-election","title":"Elect the 8% option for the new year","desc":"The 8% income tax election is made annually, on the year's first quarterly filing (1701Q due May 15, or 2551Q due Apr 25 if that comes first) or via Form 1905. Miss it and you default to graduated rates for the whole year.","form":"1701Q / 1905","agency":"BIR","category":"admin","appliesTo":{"allOf":["individual-business","regime:8pct"]},"schedule":{"kind":"ongoing"},"legalBasis":["RR 8-2018 Sec 3","RMC 32-2018"],"confidence":"verified","notes":"The election is irrevocable for the taxable year once made."},{"id":"bir-invoices","title":"Issue BIR-registered invoices for every sale","desc":"Since the EOPT Act, the invoice is the primary document for both goods and services; official receipts are supplementary only.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"ongoing"},"legalBasis":["NIRC Sec 237, as amended by RA 11976 (EOPT)","RR 7-2024, as amended by RR 11-2024"],"confidence":"verified","notes":"Mandatory issuance applies to sales of ₱500 or more (per transaction, adjustable every 3 years); issue one anyway when the buyer asks."},{"id":"bir-books-current","title":"Keep books of accounts up to date","desc":"Record income and expenses as they happen; preserve books and records for the statutory retention period.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"ongoing"},"legalBasis":["NIRC Secs 232-235, as amended by RA 11976 (EOPT)"],"confidence":"verified","notes":"EOPT cut the retention period to five (5) years. Books audited by an independent CPA are required when gross annual sales exceed ₱3,000,000 (a threshold set by TRAIN in Sec 232)."},{"id":"bir-arf-abolished","title":"Annual registration fee: no longer due","desc":"The ₱500 annual BIR registration fee (old Form 0605, due January 31) was abolished by the EOPT Act. Don't pay it, and keep your existing Certificate of Registration, which stays valid.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"info"},"legalBasis":["RA 11976 (EOPT), repealing NIRC Sec 236(B)","RMC 14-2024"],"confidence":"verified","notes":"Effective January 22, 2024."},{"id":"bir-micro-abatement-2026","title":"One-time penalty abatement for micro taxpayers: avail by Dec 31, 2026","desc":"Micro taxpayers (gross sales below ₱3M) can wipe out delinquencies, assessments, and open stop-filer cases as of Dec 31, 2025 (where the basic tax and/or penalties are ₱80,000 or less per taxable year) for a one-time ₱5,000 abatement fee.","form":"per RR 4-2026","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"info"},"showUntil":"2026-12-31","legalBasis":["RR 4-2026 (issued June 18, 2026; effective July 7, 2026, per firm alerts)"],"confidence":"needs_review","notes":"Time-boxed: availment runs until December 31, 2026 (extendable by the DOF Secretary); this item is hidden from January 1, 2027. If you have old open 2550Q/2551Q cases or small assessments, ask your CPA whether this clears them before the window closes. The issuance and effectivity dates come from firm alerts (Grant Thornton, KPMG), not from the BIR text itsel ",excerpt:"One of the few pieces of BIR paperwork that works in your favour, and the money you lose by ignoring it.",read:"4 min read",date:"May 2026",reviewed:"October 2026",body:[{kind:"p",text:"A 2307 is one of the rare pieces of BIR paperwork that works in your favour. It is proof that a client already paid part of your tax for you."},{kind:"h",text:"Why it matters"},{kind:"p",text:`When a client withholds (commonly ${I.pfIndividualLowerRate} or ${I.pfIndividualStandardRate} of your fee), they remit it to the BIR and hand you a 2307. That amount is a credit: it directly reduces what you owe on your quarterly and annual returns.`},{kind:"list",items:["Collect every 2307; chase clients who forget.","Check the amounts and period match your invoices.","Claim them on your 1701Q / 1701A, list them in the SAWT sent via eSubmission, and upload the scans through eAFS."]},{kind:"quote",text:"A drawer full of unclaimed 2307s is just tax you paid twice."}]},{id:"deadlines",cat:"Calendar",title:"The five deadlines that actually matter",excerpt:"The BIR calendar is long. For a low-overhead freelancer, only a handful of dates decide whether you sleep well.",read:"5 min read",date:"April 2026",reviewed:"October 2026",body:[{kind:"p",text:"The BIR calendar is long, but for a low-overhead freelancer only a handful of dates truly decide whether you sleep well."},{kind:"list",items:[`1701Q: quarterly income tax, around ${Uc.slice(0,-1).join(", ")} and ${Uc[Uc.length-1]}.`,`1701A: your annual return, every ${Yc}.`,"Monthly contributions: SSS, PhilHealth and Pag-IBIG.","2551Q: only if you chose graduated rates.","Invoices and books: the quiet daily habit behind all of it."]},{kind:"p",text:"Everything else is either situational or handled for you. Master these five and the rest follows."}]}],Jp="JEZ Tax Suite",ls={"/":"Calendar","/estimator":"Estimator","/checklist":"Checklist","/forms":"Forms","/tools":"Tools","/blog":"Blog","/references":"References","/privacy":"Privacy Notice","/a print(),children:"Print / Save as PDF"})}const tw="Return attachments and the BIR eAFS system. Covers what must accompany each filing, through which channel (eAFS / eSubmission / at filing), by when, and what skipping it costs. The per-form matrix in perReturn drives the Forms page; the other blocks appear on the References register. Verified against the RMC 49-2020 → RMC 46-2026 issuance line on the date in meta.json.",nw={value:{what:"BIR web facility (eafs.bir.gov.ph) for submitting the filed ITR, audited FS, and other required attachments as scanned PDFs",who:"Any taxpayer, regardless of filing channel (eFPS, eBIRForms, or manual)",enrollment:"Create an account with the taxpayer's TIN and an official email address; activate via the emailed link",fileFormat:"PDF only, up to 4.8 GB per file",proof:"System-generated Transaction Reference Number (TRN) plus the confirmation email. Keep both; they stand in for a manual 'Received' stamp"},legalBasis:["RMC 49-2020 (eAFS introduction)","RMC 82-2020 (fiscal-year & quarterly coverage)","RMC 43-2021 (revised guidelines; RPT & tax-credit groups)","RMC 34-2025 & RMC 20-2026 (eAFS as the default channel for AITR attachments)"],confidence:"verified",notes:"Introduced as an option in 2020; the annual filing RMCs now direct that AITR attachments 'shall be submitted electronically using the eAFS system'; over-the-counter submission to the LT Office/RDO/RCO is reserved for periods when a BIR advisory declares system unavailability (as happened April 2025 and May 2026)."},rw={value:{annual:[{group:"File 1: Income Tax Return",name:"EAFS<TIN>ITRTY<MM><YYYY>",contains:"The filed AITR; for e-filers, the Filing Reference Number page (eFPS) or email Tax Return Receipt Confirmation (eBIRForms), plus proof of payment"},{group:"File 2: Financial Statements",name:"EAFS<TIN>AFSTY<MM><YYYY>",contains:"Statement of Management Responsibility; the audited FS with notes and independent auditor's report plus the certificate of the BIR-accredited independent CPA (audit required above ₱3M gross annual sales); or the unaudited FS / Account Information Form for filers below the threshold"},{group:"File 3: Other Attachments",name:"EAFS<TIN>OTHTY<MM><YYYY>-01 … -99",contains:"SAWT validation report, Forms 2307/2304/2316, duly approved tax debit memos, proofs of prior years' excess credits, foreign tax credits and other tax payments, CETI, and for amended returns the previously filed return with its proof of payment"},{group:"RPT Form",name:"EAFS<TIN>RPTTY<MM><YYYY>",contains:"BIR Form 1709 (Related Party Transactions), for covered taxpayers"},{group:"Tax credit documents",name:"EAFS<TIN>TCRTY<MM><YYYY>-01 … -99",contains:"Tax credit certificates and supporting documents"}],quarterly:[{group:"File 1",name:"EAFS<TIN>ITR<Q>Q<MM><YYYY>",contains:"The filed quarterly ITR (or FRN/email confirmation for e-filers)"},{group:"File 3",name:"EAFS<TIN>OTH<Q>Q<MM><YYYY>-01 …",contains:"Scanned 2307s, SAWT confirmation, tax debit memos"}],conventions:"<TIN> = 9-digit TIN without branch code; <MM> = month-end of the taxable year (12 for calendar year); <Q> = quarter number; split oversized groups across the numbered series"},legalBasis:["RMC 49-2020","RMC 82-2020 (MMYYYY fiscal/calendar naming; quarterly groups)","RMC 43-2021 (RPT & TCR groups)"],confidence:"verified",notes:"Example for TIN 123-456-789, CY2025: EAFS123456789ITRTY122025 · EAFS123456789AFSTY122025 · EAFS123456789OTHTY122025-01. The original 2020 naming without the month (…ITRTY2019) is superseded. The portal exposes three upload slots; place RPT/TCR files under the Other Attachments slot using the RMC-prescribed filenames."},aw={value:"Attachments to e-filed income tax returns are due within 15 days from the statutory filing deadline OR from the date of actual e-filing, whichever comes LATER: April 30 for calendar-year annual returns filed on time",legalBasis:["RMC 44-2021","RMC 51-2024 (CY2023)","RMC 34-2025 (CY2024)","RMC 20-2026 (CY2025)"],confidence:"verified",notes:"The BIR's default position is that the attachment deadline is not extended, but season RMCs can override it: for CY2025, RMC 30-2026 moved filing, payment AND attachments to May 15, 2026 (EO 110 energy emergency), RMC 39-2026 made May 15 the uniform eAFS deadline regardless of when the return was e-filed, and RMC 46-2026 gave a penalty-free grace to May 25, 2026 for eAFS system issues. Manually filed returns historically carried their attachments at filing; the current annual RMCs route those through eAFS as well."},ow={value:{audited:"Gross annual sales/earnings/receipts above ₱3,000,000: books must be audited yearly by an independent CPA, and the annual ITR carries the audited FS with the auditor's report and Statement of Management Responsibility",unaudited:"At or below ₱3,000,000 on ITEMIZED deductions: financial statements still attach to the annual return, just 'not necessarily audited' by a CPA (or the Account Information Form): the audit is waived below the threshold, the FS attachment is not",none:"Individuals on the 8% option or OSD: no FS attach at all (1701A filers, and mixed-income earners on those regimes); records of gross sales/receipts must still be kept",corporations:"Corporations submit FS with the annual return even on OSD (RR 16-2008), audited only above the ₱3M gross threshold for BIR purposes. The SEC's own AFS filing separately requires an audit unless total assets or total liabilities are below ₱600,000, where FS certified under oath by the treasurer/CFO suffice (RCC Sec 177)"},legalBasis:["NIRC Sec 232, as amended by RA 10963 (TRAIN; audit threshold raised from ₱150,000 to ₱3,000,000)","BIR Form 1701/1702 guidelines (FS 'not necessarily audited' below the threshold, itemized deductions)","RR 16-2008 Sec 7 (OSD: individuals submit no FS, corporations still do)","RR 8-2018 (8% option)","Revised Corporation Code Sec 177 (SEC ₱600k treasurer-certification floor)"],confidence:"verified",notes:"The common trap: 'below ₱3M' does NOT mean 'no FS'. It means no CPA audit: itemized-deduction filers (and all corporations) still attach financial statements, unaudited, uploaded to the eAFS File 2 (AFS) group; only the 8% and OSD individual tracks skip the FS entirely. Audited FS become mandatory for BIR only when gross annual sales, earnings, receipts or output exceed ₱3,000,000 (NIRC Sec 232)."},iw={value:"Any taxpayer claiming creditable withholding (Form 2307/2304 credits) on an income tax, VAT, or percentage tax return must submit the Summary Alphalist of Withholding Taxes with that return, generated as a .dat file with the BIR data entry module and emailed to esubmission@bir.gov.ph (or attached in eFPS), due when the return itself is due",legalBasis:["RR 2-2006","RMC 3-2006"],confidence:"verified",notes:"Applies to 1701Q/1702Q, 1701/1701A/1702, 2550Q and 2551Q whenever 2307 credits are claimed. The BIR's email validation report is the proof; it is what gets uploaded to eAFS as part of File 3 for annual (and optionally quarterly) ITRs. No SAWT, and the claimed credits are exposed to disallowance."},sw={value:"All VAT-registered taxpayers (no sales threshold) submit quarterly Summary Lists of Sales and Purchases/importations as RELIEF .dat files via eSubmission, due the 25th day after the close of the taxable quarter (30th for eFPS/LTS filers)",legalBasis:["NIRC Sec 114(C)","RR 16-2005 Sec 4.114-3, as amended by RR 1-2012"],confidence:"verified",notes:"Confirmed still required as of Aug 2026: e-invoicing/e-sales reporting under CREATE MORE (RR 11-2025) becomes mandatory for its first covered group only by Dec 31, 2026 and no issuance has retired the SLSP. Submit 'zero' lists for quarters with no transactions. Taxpayers already transmitting sales data to the EIS under RR 8-2022 are relieved of the sales list only; purchase/importation lists remain due. Penalty per unfiled list: ₱1,000 (capped ₱25,000/yr)."},lw={value:"1601-EQ and 1601-FQ carry the Quarterly Alphalist of Payees (QAP); 1604-C, 1604-E and 1604-F carry the annual employee/payee alphalists, all submitted through eSubmission (or eFPS) using the Alphalist Data Entry & Validation Module, currently v7.4 (with post-release patches)",legalBasis:["RR 11-2018","RR 1-2014 & RMC 5-2014 (alphalist is integral to the return)","RMC 15-2025 (module v7.4)"],confidence:"verified",notes:"The alphalist is an integral part of the return: a list that fails validation or doesn't conform to the format is deemed NOT received, the information return is treated as not validly filed, and the related expense deductions are at risk. QAP is due with the quarterly return (last day of the month after the quarter); annual alphalists with the 1604 series. v7.4 (RMC 15-2025) received patches in Nov 2025 and Jan 2026; re-validate .dat files after each patch; no v7.5 has issued as of Aug 2026."},cw={value:"Employers submit scanned copies of the duly signed 2316s of substituted-filing employees by February 28, accompanied by exactly two documents: the notarized sworn declaration (Annex C, RR 2-2015) and the Certification of the List of Employees Qualified for Substituted Filing (Annex F, RR 11-2018)",legalBasis:["RR 11-2013","RR 2-2015, as amended by RR 16-2021 (scanned copies)","RMC 117-2021 (one mode per period; USB in absence of DVD-R)","RMC 29-2024 (only the two annexes may be required; both signatures mandatory)"],confidence:"verified",notes:"Accepted modes: eAFS upload, DVD-R, or USB, one mode per submission period. Scans must be legible and bear BOTH employer and employee signatures (e-signatures valid per RMC 29-2021; unsigned employee copies are no longer accepted per RMC 29-2024). DVD-R/USB files are named Surname_TIN_TaxablePeriod, arranged alphabetically. The deadline occasionally moves by RMC (CY2023's was extended to March 31, 2024)."},uw={value:"BIR Form 1709 (Related Party Transactions) attaches to the annual ITR only for: (a) large taxpayers; (b) taxpayers enjoying incentives (ITH or preferential rate); (c) taxpayers reporting net operating losses for the current and two immediately preceding years; (d) related parties transacting with any of them",legalBasis:["RR 34-2020","RMC 54-2021","RMC 43-2021 & RMC 44-2021 (filing via eAFS RPT group or manually)"],confidence:"verified",notes:"Everyone else is exempt. Separate, higher thresholds trigger Transfer Pricing Documentation (kept on hand, not filed): gross sales > ₱150M AND total RPTs > ₱90M, or per-category RPTs above ₱60M (tangible goods) / ₱15M (services, interest, intangibles), or TPD was required the prior year."},dw={value:"Registered business enterprises claiming ITH, 5% SCIT, or enhanced deductions must secure the Certificate of Entitlement to Tax Incentives from their IPA (PEZA/BOI/etc.) before filing the annual ITR and attach it (eAFS Other Attachments group)",legalBasis:["RMC 28-2022","RMC 42-2026 (May 7, 2026 clarification on CETI submission with the AITR)","FIRB Advisory 004-2022","RA 11534 (CREATE)"],confidence:"verified",notes:"Without the CETI the incentive claim on the return is at risk. Relevant to 1702-MX/1702-EX filers and BOI-registered individuals."},hw={value:"AFS submitted through eAFS need no BIR 'Received' stamping; the TRN and confirmation email are the proof. For attachments submitted manually, the 'RECEIVED' stamp goes on three pages only: the auditor's report, the balance sheet, and the income statement",legalBasis:["RMC 49-2020 & RMC 82-2020 (TRN in lieu of stamp)","RMC 51-2024 / RMC 34-2025 (three-page stamping rule)"],confidence:"verified",notes:"Downstream, the SEC (eFAST) accepts the eAFS TRN/Confirmation Receipt in place of a BIR-stamped AFS."},fw={value:{standard:"₱1,000 per failure to file an information return, statement, list, or attachment, with an aggregate cap of ₱25,000 per calendar year (NIRC Sec 250)",microSmall:"₱500 per failure, capped at ₱12,500 per calendar year, for taxpayers classified micro or small under EOPT"},legalBasis:["NIRC Sec 250","RA 11976 (EOPT) & RR 6-2024 (reduced micro/small penalties)","RMO 7-2015 (compromise-penalty schedule)"],confidence:"verified",notes:"Late attachments do NOT make a timely-filed-and-paid return late: no 25% surcharge or interest attaches merely because attachments missed the window; the exposure is the Sec 250 penalty (collected in practice as a compromise penalty) plus practical risks: disallowance of 2307 credits never substantiated, alphalists deemed not received, audit flags, and open cases. Willful repeated non-compliance can escalate under Sec 255."},pw={value:[{form:"1700",items:[{doc:"Form 2316 from each employer for the year",channel:"eAFS (Other Attachments)",when:"Within 15 days of the deadline / actual e-filing, whichever is later"},{doc:"Proof of filing (FRN or email Tax Return Receipt Confirmation) and proof of payment",channel:"eAFS (ITR group)",when:"Same 15-day window"},{doc:"Tax debit memo, proofs of prior years' excess or foreign tax credits, and for an amended return the previously filed return with proof of payment, if any",channel:"eAFS (Other Attachments)",when:"Same 15-day window"}]},{form:"1701",items:[{doc:"Proof of filing (FRN/TRRC) and proof of payment",channel:"eAFS (ITR group)",when:"Within 15 days of the deadline / actual e-filing, whichever is later"},{doc:"Form 2316 from your employer (mixed-income earners)",channel:"eAFS (Other Attachments)",when:"Same 15-day window"},{doc:"SAWT + Forms 2307, when creditable withholding is claimed",channel:"SAWT .dat via eSubmission (due with the return); confirmation + scanned 2307s to eAFS",when:"SAWT with the return; scans in the 15-day window"},{doc:"Financial statements, itemized-deduction filers: audited FS + auditor's report + SMR + the BIR-accredited CPA's certificate when gross sales exceed ₱3M; unaudited FS (or AIF) at or below ₱3M; no FS on the 8% option or OSD",channel:"eAFS (AFS group)",when:"Same 15-day window"},{doc:"Form 1709 (only if a covered related-party taxpayer); Form 2304 for income not subjected to withholding; tax debit
