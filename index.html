idation report: it is the proof uploaded to eAFS with the scanned 2307s. No SAWT and the claimed credits are exposed to disallowance. Also rides the 2550Q/2551Q on the rarer occasions withholding is credited on those returns. Nothing claimed for a period, nothing due."},{"id":"bir-1700-annual","title":"File annual income tax return (compensation)","desc":"Employees outside substituted filing (e.g. two or more employers during the year) file their own annual return on compensation income.","form":"1700","agency":"BIR","category":"income","appliesTo":{"allOf":["files-1700"]},"schedule":{"kind":"annual_fixed","month":4,"day":15},"legalBasis":["NIRC Sec 51(A)(2), as amended","RR 8-2018"],"confidence":"verified","notes":""},{"id":"bir-2316-collect","title":"Collect BIR Form 2316 from your employer","desc":"Your employer's certificate of compensation paid and tax withheld; with one employer and correct withholding it doubles as your filed return.","form":"2316","agency":"BIR","category":"income","appliesTo":{"allOf":["type:employee"]},"schedule":{"kind":"annual_fixed","month":1,"day":31},"legalBasis":["NIRC Sec 83, as amended","RR 2-98 Sec 2.83.1, as amended by RR 11-2018"],"confidence":"verified","notes":"Employers must issue the certificate on or before January 31 of the following year, or on the day of last payment for terminated employment."},{"id":"bir-1702q","title":"File & pay quarterly corporate income tax","desc":"Cumulative corporate income tax for the taxable year to date, less prior quarterly payments and creditable withholding.","form":"1702Q","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3],"daysAfterEnd":60},"legalBasis":["NIRC Sec 75 & 77(B), as amended"],"confidence":"verified","notes":"Due within 60 days following the close of each of the first three quarters of the taxable year, calendar or fiscal. SAWT via eSubmission when 2307 credits are claimed; scanned 2307s may go through eAFS quarterly groups (RMC 82-2020)."},{"id":"bir-1702-annual","title":"File annual corporate income tax return","desc":"Year-end corporate return: regular corporate income tax compared against the minimum corporate income tax where applicable.","form":"1702-RT","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"annual_fy","monthsAfterEnd":4,"day":15},"legalBasis":["NIRC Sec 77(B), as amended"],"confidence":"verified","notes":"Due the 15th day of the fourth month following the close of the taxable year (April 15 for calendar-year corporations). Variants: 1702-EX (exempt), 1702-MX (mixed/special-rate regimes; RBEs attach the CETI). Attachments include FS + SMR (audited only when gross sales exceed ₱3M per NIRC Sec 232, though FS attach even on OSD per RR 16-2008), SAWT/2307s, and Form 1709 for covered related-party taxpayers; these go to eAFS within 15 days of the deadline or actual e-filing, whichever comes later (fiscal-year naming per RMC 82-2020); a separately dated item on this calendar. E-filing is mandatory for all corporations (RMC 20-2026)."},{"id":"bir-sawt-corp-quarterly","title":"Submit SAWT with the quarterly income tax return","desc":"Summary Alphalist of Withholding Taxes: the alphalist of every 2307 certificate claimed as a credit on the 1702Q, filed via eSubmission with the return.","form":"SAWT","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation","receives-2307"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3],"daysAfterEnd":60},"legalBasis":["RR 2-2006","RMC 3-2006"],"confidence":"verified","notes":"Due with each 1702Q (within 60 days of the close of each of the first three quarters, following the corporation's taxable year) whenever 2307 credits are claimed for the quarter; nothing claimed, nothing due. A .dat file via eSubmission (esubmission@bir.gov.ph) or eFPS; scanned 2307s may go through eAFS quarterly groups (RMC 82-2020)."},{"id":"bir-sawt-corp-annual -eafs-itr-attachments-corp","title":"Submit annual ITR attachments via eAFS","desc":"Corporate annual-return attachments: the FS with SMR (audited with auditor's report when gross sales exceed ₱3M), SAWT confirmation with 2307s and 2304s, Form 1709, CETI, tax debit memos and credit proofs where applicable, uploaded to eAFS in the prescribed PDF file groups.","form":"via eAFS","agency":"BIR","category":"income","appliesTo":{"allOf":["type:corporation"]},"schedule":{"kind":"annual_fy","monthsAfterEnd":4,"day":30},"legalBasis":["RMC 44-2021 (15 days from the statutory deadline or actual e-filing, whichever is later)","RMC 82-2020 (fiscal-year eAFS naming)","RMC 43-2021 (RPT & tax-credit file groups)"],"confidence":"verified","notes":"15 days after the annual return's due date (April 30 for calendar-year corporations filing by April 15); a late-filed return runs the window from actual e-filing instead. The eAFS Transaction Reference Number doubles as the BIR-received proof the SEC accepts with the AFS."},{"id":"bir-2551q","title":"File & pay quarterly percentage tax","desc":"3% of gross quarterly sales or receipts for non-VAT taxpayers under the VAT threshold who have not elected the 8% income tax option.","form":"2551Q","agency":"BIR","category":"business","appliesTo":{"allOf":["business","nonvat"],"noneOf":["regime:8pct"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 116 & 128(A)(1), as amended by RA 11534 (CREATE)"],"confidence":"verified","notes":"Within 25 days after the close of each taxable quarter. Electing the 8% option removes this filing entirely for the year."},{"id":"bir-2550q","title":"File & pay quarterly VAT","desc":"Output VAT on sales less creditable input VAT for the taxable quarter.","form":"2550Q","agency":"BIR","category":"business","appliesTo":{"allOf":["business","vat"]},"schedule":{"kind":"quarterly_offset","quarters":[1,2,3,4],"daysAfterEnd":25},"legalBasis":["NIRC Sec 114(A), as amended eting date (often fixed in the by-laws). Diary it 30 days after the meeting; file through eFAST."},{"id":"bir-8pct-election","title":"Elect the 8% option for the new year","desc":"The 8% income tax election is made annually, on the year's first quarterly filing (1701Q due May 15, or 2551Q due Apr 25 if that comes first) or via Form 1905. Miss it and you default to graduated rates for the whole year.","form":"1701Q / 1905","agency":"BIR","category":"admin","appliesTo":{"allOf":["individual-business","regime:8pct"]},"schedule":{"kind":"ongoing"},"legalBasis":["RR 8-2018 Sec 3","RMC 32-2018"],"confidence":"verified","notes":"The election is irrevocable for the taxable year once made."},{"id":"bir-invoices","title":"Issue BIR-registered invoices for every sale","desc":"Since the EOPT Act, the invoice is the primary document for both goods and services; official receipts are supplementary only.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"ongoing"},"legalBasis":["NIRC Sec 237, as amended by RA 11976 (EOPT)","RR 7-2024, as amended by RR 11-2024"],"confidence":"verified","notes":"Mandatory issuance applies to sales of ₱500 or more (per transaction, adjustable every 3 years); issue one anyway when the buyer asks."},{"id":"bir-books-current","title":"Keep books of accounts up to date","desc":"Record income and expenses as they happen; preserve books and records for the statutory retention period.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"ongoing"},"legalBasis":["NIRC Secs 232-235, as amended by RA 11976 (EOPT)"],"confidence":"verified","notes":"EOPT cut the retention period to five (5) years. Books audited by an independent CPA are required when gross annual sales exceed ₱3,000,000 (a threshold set by TRAIN in Sec 232)."},{"id":"bir-arf-abolished","title":"Annual registration fee: no longer due","desc":"The ₱500 annual BIR registration fee (old Form 0605, due Ja penalty-free grace to May 25, 2026 for eAFS system issues. Manually filed returns historically carried their attachments at filing; the current annual RMCs route those through eAFS as well."},q1={value:{audited:"Gross annual sales/earnings/receipts above ₱3,000,000: books must be audited yearly by an independent CPA, and the annual ITR carries the audited FS with the auditor's report and Statement of Management Responsibility",unaudited:"At or below ₱3,000,000 on ITEMIZED deductions: financial statements still attach to the annual return, just 'not necessarily audited' by a CPA (or the Account Information Form): the audit is waived below the threshold, the FS attachment is not",none:"Individuals on the 8% option or OSD: no FS attach at all (1701A filers, and mixed-income earners on those regimes); records of gross sales/receipts must still be kept",corporations:"Corporations submit FS with the annual return even on OSD (RR 16-2008), audited only above the ₱3M gross threshold for BIR purposes. The SEC's own AFS filing separately requires an audit unless total assets or total liabilities are below ₱600,000, where FS certified under oath by the treasurer/CFO suffice (RCC Sec 177)"},legalBasis:["NIRC Sec 232, as amended by RA 10963 (TRAIN; audit threshold raised from ₱150,000 to ₱3,000,000)","BIR Form 1701/1702 guidelines (FS 'not necessarily audited' below the threshold, itemized deductions)","RR 16-2008 Sec 7 (OSD: individuals submit no FS, corporations still do)","RR 8-2018 (8% option)","Revised Corporation Code Sec 177 (SEC ₱600k treasurer-certification floor)"],confidence:"verified",notes:"The common trap: 'below ₱3M' does NOT mean 'no FS'. It means no CPA audit: itemized-deduction filers (and all corporations) still attach financial statements, unaudited, uploaded to the eAFS File 2 (AFS) group; only the 8% and OSD individual tracks skip the FS entirely. Audited FS become mandatory for BIR only when gross annual sales, earnings, receipts or output exceed ₱3,000,000 (NIRC Sec 232)."},H1={value:"Any taxpayer claiming creditable withholding (Form 2307/2304 credits) on an income tax, VAT, or percentage tax return must submit the Summary Alphalist of Withholding Taxes with that return, generated as a .dat file with the BIR data entry module and emailed to esubmission@bir.gov.ph (or attached in eFPS), due when the return itself is due",legalBasis:["RR 2-2006","RMC 3-2006"],confidence:"verified",notes:"Applies to 1701Q/1702Q, 1701/1701A/1702, 2550Q and 2551Q whenever 2307 credits are claimed. The BIR's email validation report is the proof; it is what gets uploaded to eAFS as part of File 3 for annual (and optionally quarterly) ITRs. No SAWT, and the claimed credits are exposed to disallowance."},V1={value:"All VAT-registered taxpayers (no sales threshold) submit quarterly Summary Lists of Sales and Purchases/importations as RELIEF .dat files via eSubmission, due the 25th day after the close of the taxable quarter (30th for eFPS/LTS filers)",legalBasis:["NIRC Sec 114(C)","RR 16-2005 Sec 4.114-3, as amended by RR 1-2012"],confidence:"verified",notes:"Confirmed still required as of Aug 2026: e-invoicing/e-sales reporting under CREATE MORE (RR 11-2025) becomes mandatory for its first covered group only by Dec 31, 2026 and no issuance has retired the SLSP. Submit 'zero' lists for quarters with no transactions. Taxpayers already transmitting sales data to the EIS under RR 8-2022 are relieved of the sales list only; purchase/importation lists remain due. Penalty per unfiled list: ₱1,000 (capped ₱25,000/yr)."},G1={value:"1601-EQ and 1601-FQ carry the Quarterly Alphalist of Payees (QAP); 1604-C, 1604-E and 1604-F carry the annual employee/payee alphalists, all submitted through eSubmission (or eFPS) using the Alphalist Data Entry & Validation Module, currently v7.4 (with post-release patches)",legalBasis:["RR 11-2018","RR 1-2014 & RMC 5-2014 (alphalist is integral to the return)","RMC 15-2025 (module v7.4)"],confidence:"verified",notes:"The alphalist is an integral part of the return: a list that fails validation or doesn't conform to the format is deemed NOT received, the information return is treated as not validly filed, and the related expense deductions are at risk. QAP is due with the quarterly return (last day of the month after the quarter); annual alphalists with the 1604 series. v7.4 (RMC 15-2025) received patches in Nov 2025 and Jan 2026; re-validate .dat files after each patch; no v7.5 has issued as of Aug 2026."},K1={value:"Employers submit scanned copies of the duly signed 2316s of substituted-filing employees by February 28, accompanied by exactly two documents: the notarized sworn declaration (Annex C, RR 2-2015) and the Certification of the List of Employees Qualified for Substituted Filing (Annex F, RR 11-2018)",legalBasis:["RR 11-2013","RR 2-2015, as amended by RR 16-2021 (scanned copies)","RMC 117-2021 (one mode per period; USB in absence of DVD-R)","RMC 29-2024 (only the two annexes may be required; both signatures mandatory)"],confidence:"verified",notes:"Accepted modes: eAFS upload, DVD-R, or USB, one mode per submission period. Scans must be legible and bear BOTH employer and employee signatures (e-signatures valid per RMC 29-2021; unsigned employee copies are no longer accepted per RMC 29-2024). DVD-R/USB files are named Surname_TIN_TaxablePeriod, arranged alphabetically. The deadline occasionally moves by RMC (CY2023's was extended to March 31, 2024)."},Q1={value:"BIR Form 1709 (Related Party Transactions) attaches to the annual ITR only for: (a) large taxpayers; (b) taxpayers enjoying incentives (ITH or preferential rate); (c) taxpayers reporting net operating losses for the current and two immediately preceding years; (d) related parties transacting with any of them",legalBasis:["RR 34-2020","RMC 54-2021","RMC 43-2021 & RMC 44-2021 (filing via eAFS RPT group or manually)"],confidence:"verified",notes:"Everyone else is exempt. Separate, higher thresholds trigger Transfer Pricing Documentation (kept on hand, not filed): gross sales > ₱150M AND total RPTs > ₱90M, or per-category RPTs above ₱60M (tangible goods) / ₱15M (services, interest, intangibles), or TPD was required the prior year."},J1={value:"Registered business enterprises claiming ITH, 5% SCIT, or enhanced deductions must secure the Certificate of Entitlement to Tax Incentives from their IPA (PEZA/BOI/etc.) before filing the annual ITR and attach it (eAFS Other Attachments group)",legalBasis:["RMC 28-2022","RMC 42-2026 (May 7, 2026 clarification on CETI submission with the AITR)","FIRB Advisory 004-2022","RA 11534 (CREATE)"],confidence:"verified",notes:"Without the CETI the incentive claim on the return is at risk. Relevant to 1702-MX/1702-EX filers and BOI-registered individuals."},Y1={value:"AFS submitted through eAFS need no BIR 'Received' stamping; the TRN and confirmation email are the proof. For attachments submitted manually, the 'RECEIVED' stamp goes on three pages only: the auditor's report, the balance sheet, and the income statement",legalBasis:["RMC 49-2020 & RMC 82-2020 (TRN in lieu of stamp)","RMC 51-2024 / RMC 34-2025 (three-page stamping rule)"],confidence:"verified",notes:"Downstream, the SEC (eFAST) accepts the eAFS TRN/Confirmation Receipt in place of a BIR-stamped AFS."},X1={value:{standard:"₱1,000 per failure to file an information return, statement, list, or attachment, with an aggregate cap of ₱25,000 per calendar year (NIRC Sec 250)",microSmall:"₱500 per failure, capped at ₱12,500 per calendar year, for taxpayers classified micro or small under EOPT"},legalBasis:["NIRC Sec 250","RA 11976 (EOPT) & RR 6-2024 (reduced micro/small penalties)","RMO 7-2015 (compromise-penalty schedule)"],confidence:"verified",notes:"Late attachments do NOT make a timely-filed-and-paid return late: no 25% surcharge or interest attaches merely because attachments missed the window; the exposure is the Sec 250 penalty (collected in practice as a compromise penalty) plus practical you file your first quarter."]},{kind:"p",text:"When in doubt, most low-overhead freelancers are well served by 8%: fewer forms, fewer deadlines, and usually a smaller bill."}]},{id:"first-year",cat:"Getting started",title:"Your first year as a registered freelancer",excerpt:"Registering is the easy part. Here is the shape of the twelve months that follow, month by month, without the dread.",read:"8 min read",date:"May 2026",body:[{kind:"p",text:"Registering is the easy part. Knowing what happens next is what keeps people up at night. Here is the shape of your first twelve months."},{kind:"h",text:"Month one: register and set up"},{kind:"p",text:"File Form 1901, receive your Certificate of Registration (2303), and register your books and invoices. Good news: the old ₱500 annual registration fee was scrapped in 2024."},{kind:"h",text:"Every month: contribute and invoice"},{kind:"list",items:["Issue a BIR-registered invoice for every payment you receive.","Pay SSS, PhilHealth and Pag-IBIG; as a freelancer you cover both shares.","Keep your books current so quarter-end is painless."]},{kind:"h",text:"Every quarter: file 1701Q"},{kind:"p",text:"Three times a year you total your income so far, compute the tax, and pay the difference. The calendar in this app counts down each one for you."},{kind:"h",text:"Once a year: the annual return"},{kind:"p",text:"By April 15 you file your annual return (1701A or 1701) reconciling all four quarters. Claim any 2307 certificates your clients gave you (that is tax already paid on your behalf) and upload the scans through the BIR's eAFS portal within 15 days of filing."},{kind:"quote",text:"The whole system rewards small, steady habits. Invoice, set aside, file. Repeat."}]},{id:"2307",cat:"Withholding",title:"What to do with every 2307 your clients hand you",excerpt:"One of the few pieces of BIR paperwork that works in your favour, and the money you lose by ignoring it.",read:"4 min read",date:"May 2026",body:[{kind:"p",text:"A 2307 is one of the rare pieces of BIR paperwork that works in your favour. It is proof that a client already paid part of your tax for you."},{kind:"h",text:"Why it matters"},{kind:"p",text:"When a client withholds (commonly 5% or 10% of your fee), they remit it to the BIR and hand you a 2307. That amount is a credit: it directly reduces what you owe on your quarterly and annual returns."},{kind:"list",items:["Collect every 2307; chase clients who forget.","Check the amounts and period match your invoices.","Claim them on your 1701Q / 1701A, list them in the SAWT sent via eSubmission, and upload the scans through eAFS."]},{kind:"quote",text:"A drawer full of unclaimed 2307s is just tax you paid twice."}]},{id:"deadlines",cat:"Calendar",title:"The five deadlines that actually matter",excerpt:"The BIR calendar is long. For a low-overhead freelancer, only a handful of dates decide whether you sleep well.",read:"5 min read",date:"April 2026",body:[{kind:"p",text:"The BIR calendar is long, but for a low-overhead freelancer only a handful of dates truly decide whether you sleep well."},{kind:"list",items:["1701Q: quarterly income tax, around May 15, Aug 15 and Nov 15.","1701A: your annual return, every April 15.","Monthly contributions: SSS, PhilHealth and Pag-IBIG.","2551Q: only if you chose graduated rates.","Invoices and books: the quiet daily habit behind all of it."]},{kind:"p",text:"Everything else is either situational or handled for you. Master these five and the rest follows."}]}];function Kf(){const{postId:r}=ap(),e=Qt();if(!r){const s=Ta.find(l=>l.feature)||Ta[0],o=Ta.filter(l=>l!==s);return h.jsxs("div",{className:"page wrap",style:{paddingTop:"34px",paddingBottom:"64px"},children:[h.jsxs("div",{style:{marginBottom:"26px"},children:[h.jsx("div",{className:"mono",style:{fontSize:"11.5px",fontWeight:500,letterSpacing:".13em",textTransform:"uppercase",color:"var(--acc)"},children:"The Present Value Journal"}),h.jsx("h1",{style:{fontSize:"30px",fontWeight:800,letterSpaci
