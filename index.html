avings.","form":"Pag-IBIG savings","agency":"Pag-IBIG","category":"payroll","appliesTo":{"allOf":["self-contributions"]},"schedule":{"kind":"monthly","day":10,"monthOffset":1,"calendarBasis":true},"legalBasis":["RA 9679"],"confidence":"needs_review","notes":"This is the regular monthly Pag-IBIG savings, not MP2 (Pag-IBIG's separate voluntary savings program). The name of the payment channel is not yet confirmed: check with Pag-IBIG. If you are also employed, your employer already remits your Pag-IBIG savings from your salary; ask Pag-IBIG before paying a second time (not confirmed)."},{"id":"dole-13th-month","title":"Pay 13th month pay","desc":"All rank-and-file employees who worked at least one month in the year must receive 13th month pay.","form":"—","agency":"DOLE","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":12,"day":24,"calendarBasis":true,"noWeekendShift":true,"periodBasis":"current_year"},"legalBasis":["PD 851","DOLE Labor Advisory (annual)"],"confidence":"verified","notes":"Due on or before December 24; this deadline does NOT move later for weekends; pay earlier instead."},{"id":"dole-13th-month-report","title":"Report 13th-month compliance to DOLE","desc":"Employers report 13th-month payment compliance through the DOLE establishment report system.","form":"DOLE online report","agency":"DOLE","category":"payroll","appliesTo":{"allOf":["employer"]},"schedule":{"kind":"annual_fixed","month":1,"day":15,"calendarBasis":true},"legalBasis":["PD 851 IRR","DOLE Labor Advisory No. 16-2025 (report via reports.dole.gov.ph by Jan 15, 2026, reiterated annually)"],"confidence":"verified","notes":"January 15 of the following year has held across recent annual advisories; the report goes through the DOLE Establishment Report System (reports.dole.gov.ph). Watch each December's advisory for the odd change."},{"id":"lgu-business-permit","title":"Renew business / mayor's permit","desc":"Annual renewal of the LGU business permit and payment of local business tax for the year.","form":"Mayor's permit","agency":"LGU","category":"registration","appliesTo":{"allOf":["lgu"]},"schedule":{"kind":"annual_fixed","month":1,"day":20,"periodBasis":"current_year"},"legalBasis":["Local Government Code (RA 7160) Sec 167"],"confidence":"verified","notes":"Local business taxes accrue January 1 and are payable within the first 20 days of January, in full or as the first of four quarterly installments (the other three are shown as their own item). Barangay clearance is secured first."},{"id":"lgu-business-tax-quarterly","title":"Pay the quarterly installment of local business tax (only if you pay by quarter)","desc":"If you chose to pay the year's local business tax in four installments, the 2nd, 3rd and 4th are due within the first 20 days of April, July and October.","form":"Mayor's permit","agency":"LGU","category":"registration","appliesTo":{"allOf":["lgu"]},"conditional":true,"schedule":{"kind":"quarterly_fixed","entries":[{"label":"Q2","month":4,"day":20},{"label":"Q3","month":7,"day":20},{"label":"Q4","month":10,"day":20}]},"legalBasis":["Local Government Code (RA 7160) Secs 165 and 167"],"confidence":"verified","notes":"Skip this if you paid the whole year in January. Your LGU's ordinance may set other dates."},{"id":"lgu-cedula","title":"Pay community tax (cedula)","desc":"Yearly community tax for individuals who work for an employer, run a business or practice a profession, and for corporations.","form":"CTC","agency":"LGU","category":"registration","appliesTo":{"anyOf":["business","type:employee"]},"schedule":{"kind":"annual_fixed","month":2,"day":"last","periodBasis":"current_year"},"legalBasis":["Local Government Code (RA 7160) Secs 156-164","Local Government Code (RA 7160) Sec 157 (individuals regularly employed on a wage or salary)"],"confidence":"needs_review","notes":"Accrues January 1; payable without interest until the last day of February. Employees are included because LGC Sec 157 covers individuals regularly employed on a wage or salary for at least 30 consecutive working days in the year (the Code text was not re-checked for this release, so this is flagged for review)."},{"id":"lgu-ptr","title":"Renew Professional Tax Receipt (PTR)","desc":"Annual professional tax for PRC-licensed professionals practicing their profession.","form":"PTR","agency":"LGU","category":"registration","appliesTo":{"allOf":["ptr"]},"schedule":{"kind":"annual_fixed","month":1,"day":31,"periodBasis":"current_year"},"legalBasis":["Local Government Code (RA 7160) Sec 139"],"confidence":"verified","notes":"Payable on or before January 31 to the province/city where the professional practices."},{"id":"bir-looseleaf-books","title":"Submit bound loose-leaf books","desc":"Permanently bound copies of last year's loose-leaf books of accounts, with a sworn statement.","form":"via ORUS","agency":"BIR","category":"admin","appliesTo":{"allOf":["books:looseleaf"]},"schedule":{"kind":"annual_fy","daysAfterEnd":15},"legalBasis":["RMC 68-2017","RMC 3-2023 (ORUS registration, QR stamp)","RMC 4-2026 (one-off extension of the Jan 2026 deadline to Jan 31)"],"confidence":"verified","notes":"Within 15 days after the end of the taxable year (January 15 for calendar-year taxpayers; the Jan 2026 round was extended one-off to Jan 31 for ORUS outages). Registration runs through ORUS; the QR 'stamp' goes on the first page of the bound volume; the bound books themselves go to your RDO with the sworn statement."},{"id":"bir-cas-books","title":"Register computerized books of accounts","desc":"Annual registration/submission of computerized books and other accounting records in electronic format.","form":"via ORUS","agency":"BIR","category":"admin","appliesTo":{"allOf":["books:cas"]},"schedule":{"kind":"annual_fy","daysAfterEnd":30},"legalBasis":["RMC 5-2021","RMC 3-2023"],"confidence":"verified","notes":"Within 30 days from the close of the taxable year (January 30 for calendar-year taxpayers)."},{"id":"bir-inventory-list","title":"Submit annual inventory list","desc":"Detailed list of ending inventory (goods, materials, supplies) as of year-end.","form":"via eSubmission/RDO","agency":"BIR","category":"admin","appliesTo":{"allOf":["inventory"]},"schedule":{"kind":"annual_fy","daysAfterEnd":30},"legalBasis":["RMC 57-2015"],"confidence":"verified","notes":"Within 30 days following the close of the taxable year (January 30 for calendar-year taxpayers)."},{"id":"sec-afs-calendar","title":"File audited financial statements with the SEC","desc":"Annual audited FS filed through the SEC's eFAST system, with one uniform deadline for calendar-year corporations, set by the year's SEC memorandum circular.","form":"SEC eFAST","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec","fy:calendar"]},"schedule":{"kind":"annual_fixed","month":5,"day":29},"legalBasis":["Revised Corporation Code Sec 177","SRC Rule 68","SEC MC 9-2026 (Feb 11, 2026: single uniform date via eFAST; FY2025's May 29 was revised to June 15, 2026 after the BIR's AITR extension)","SEC MC 16-2026 (May 13, 2026: monthly late-filing penalties for AFS and GIS suspended to Dec 31, 2026)"],"confidence":"needs_review","notes":"The SEC sets the exact date each year by memorandum circular; the old last-digit staggering is gone, but the date can move mid-year (FY2025: May 29 → June 15, 2026). Later years shown at May 29 until each year's MC issues. Attach the BIR eAFS Transaction Reference Number in lieu of a BIR-stamped AFS. PSE-listed/public companies follow the 105-day SEC Form 17-A rule instead. Corporations with total assets or total liabilities under ₱600,000 file FS certified under oath by the treasurer/CFO instead of audited (RCC Sec 177). Late filing in 2026: SEC MC 16-2026 suspends the monthly late-filing penalties for the AFS and GIS from May 13 to Dec 31, 2026; the basic fines under SEC MC 6-2024 still apply, and penalties already paid are not refunded."},{"id":"sec-afs-fiscal","title":"File audited financial statements with the SEC","desc":"Fiscal-year corporations file audited FS via eFAST within 120 calendar days of fiscal year-end.","form":"SEC eFAST","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec","fy:fiscal"]},"schedule":{"kind":"annual_fy","daysAfterEnd":120},"legalBasis":["Revised Corporation Code Sec 177","SRC Rule 68","SEC MC 9-2026","SEC MC 16-2026 (May 13, 2026: monthly late-filing penalties for AFS and GIS suspended to Dec 31, 2026)"],"confidence":"verified","notes":"Within 120 calendar days from the end of a fiscal year other than December 31 (per the annual SEC MC, most recently MC 9-2026). Corporations with total assets or total liabilities under ₱600,000 file FS certified under oath by the treasurer/CFO instead of audited (RCC Sec 177). Late filing in 2026: SEC MC 16-2026 suspends the monthly late-filing penalties for the AFS and GIS from May 13 to Dec 31, 2026; the basic fines under SEC MC 6-2024 still apply, and penalties already paid are not refunded."},{"id":"sec-gis","title":"File the General Information Sheet (GIS)","desc":"Within 30 calendar days from the annual stockholders' (or members') meeting, via eFAST.","form":"SEC GIS","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec"]},"schedule":{"kind":"ongoing"},"legalBasis":["Revised Corporation Code Sec 177","SEC MC 9-2026 (30 calendar days from the actual annual meeting, via eFAST)","SEC MC 16-2026 (May 13, 2026: monthly late-filing penalties for AFS and GIS suspended to Dec 31, 2026)"],"confidence":"verified","notes":"The due date depends on your annual meeting date (often fixed in the by-laws). Diary it 30 days after the meeting; file through eFAST. Late filing in 2026: SEC MC 16-2026 suspends the monthly late-filing penalties for the AFS and GIS from May 13 to Dec 31, 2026; the basic fines under SEC MC 6-2024 still apply, and penalties already paid are not refunded. Beneficial owners are no longer listed on the GIS: they are declared in the SEC's HARBOR registry (see the next item)."},{"id":"sec-harbor-bo","title":"Declare beneficial owners in the SEC's HARBOR registry","desc":"Beneficial ownership is no longer declared on the GIS. File it in HARBOR (inside eFAST) with your GIS, and report any change within 7 calendar days.","form":"SEC HARBOR","agency":"SEC","category":"registration","appliesTo":{"allOf":["sec"]},"schedule":{"kind":"ongoing"},"legalBasis":["SEC MC 15-2025 (Beneficial Ownership Disclosure Rules; HARBOR registry live Jan 30, 2026)"],"confidence":"needs_review","notes":"If your 2026 GIS was filed with the beneficial-ownership page before Jan 30, 2026, firm summaries say the first HARBOR filing comes with the 2027 GIS; confirm with the SEC, together with the penalties for late or missing declarations."},{"id":"bir-8pct-election","title":"Elect the 8% option for the new year","desc":"The 8% income tax election is made annually, on the year's first quarterly filing (1701Q due May 15, or 2551Q due Apr 25 if that comes first) or via Form 1905. Miss it and you default to graduated rates for the whole year.","form":"1701Q / 1905","agency":"BIR","category":"admin","appliesTo":{"allOf":["individual-business","regime:8pct"]},"schedule":{"kind":"ongoing"},"legalBasis":["RR 8-2018 Sec 3","RMC 32-2018"],"confidence":"verified","notes":"The election is irrevocable for the taxable year once made."},{"id":"bir-invoices","title":"Issue BIR-registered invoices for your sales","desc":"Since the EOPT Act, the invoice is the primary document for sales of goods and services; official receipts are supplementary only. VAT-registered sellers issue a VAT invoice for every sale, whatever the amount. Since October 2026, an invoice for a sale the buyer withholds tax on must also show the creditable withholding tax as a separate line.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"ongoing"},"legalBasis":["NIRC Secs 113 and 237, as amended by RA 11976 (EOPT)","RR 7-2024, as amended by RR 11-2024 and RR 6-2026","RMC 77-2024 (VAT invoice for every sale; non-VAT ₱500 rule and end-of-day invoice)","RR 6-2026 (creditable withholding tax shown as a separate item; published on the BIR website Oct 1, 2026, effective Oct 16, 2026, per firm alerts)","RMC 112-2026 (Oct 22, 2026: how to show the withholding line; transition for invoicing systems)"],"confidence":"verified","notes":"Non-VAT sellers must issue an invoice for each sale of ₱500 or more, whenever the buyer asks for one, and one end-of-day invoice for the day's smaller sales once they add up to ₱500 (the ₱500 floor is adjusted for inflation every 3 years). RR 6-2026 adds the amount of creditable withholding tax, when the sale is subject to it, as a required separate item on the invoice. Unused printed invoices may be used until they run out if 'Less: Withholding Tax' is conspicuously stamped on them; no new Authority to Print is needed just for this. Per RMC 112-2026, the line is needed only when the buyer actually withholds (otherwise leave it blank or write N/A or 0.00), and changing an invoicing system only to add the withholding field counts as a limited modification. Invoicing systems get more time: until Dec 31, 2026 for systems covered by mandatory e-invoicing, such as computerized accounting systems, and until Mar 31, 2027 for cash registers, POS and other systems not yet under e-invoicing (RMC 112-2026)."},{"id":"bir-payee-sworn-declaration","title":"Give clients who withhold your sworn declaration of gross receipts","desc":"If your gross receipts for the year will not exceed ₱3M, give each client that withholds from you a sworn declaration of gross receipts with a copy of your Certificate of Registration (Form 2303), so professional fees are withheld at 5% instead of 10%. With a single client (lone payor), the declaration also keeps the first ₱250,000 of the year free of withholding.","form":"Sworn declaration","agency":"BIR","category":"admin","appliesTo":{"allOf":["individual-business","receives-2307","nonvat"]},"schedule":{"kind":"ongoing"},"legalBasis":["RR 2-98 Sec 2.57.2, as amended by RR 11-2018 and RR 14-2018 (income payee's sworn declaration, Annexes B-1 to B-3)"],"confidence":"verified","notes":"Give it to each client on or before January 15 of each year, or before the first payment if you start with a client later in the year (RR 11-2018). Without the declaration the client must withhold 10%. Your client in turn files its own sworn declaration with the list of payees at its RDO by January 31. The rates are on the References page under expanded withholding."},{"id":"bir-1600vt-digital","title":"Remit 12% VAT on digital services bought from foreign providers","desc":"A business that buys digital services from a provider outside the Philippines (online ads, software subscriptions, cloud hosting, marketplace fees) withholds the 12% VAT and remits it itself on BIR Form 1600-VT, by the 10th of the following month, whether it is VAT-registered or not. Skip this if you buy none.","form":"1600-VT","agency":"BIR","category":"business","appliesTo":{"allOf":["business"]},"conditional":true,"schedule":{"kind":"ongoing"},"legalBasis":["RA 12023 (VAT on Digital Services)","RR 3-2025","RMC 47-2025 (the business buyer, VAT-registered or not, files Form 1600-VT)"],"confidence":"needs_review","notes":"VAT-registered buyers claim the amount back as input VAT, supported by the filed 1600-VT; for a non-VAT buyer it is part of the cost. Purchases for personal use are handled by the provider. Confirmed from firm summaries of RMC 47-2025 (KPMG, Grant Thornton); the circular itself was not read here, and how far it reaches very small buyers should be checked with your RDO."},{"id":"bir-books-current","title":"Keep books of accounts up to date","desc":"Record income and expenses as they happen; preserve books and records for the statutory retention period.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"ongoing"},"legalBasis":["NIRC Secs 232-235, as amended by RA 11976 (EOPT)"],"confidence":"verified","notes":"EOPT cut the retention period to five (5) years. Books audited by an independent CPA are required when gross annual sales exceed ₱3,000,000 (a threshold set by TRAIN in Sec 232)."},{"id":"bir-arf-abolished","title":"Annual registration fee: no longer due","desc":"The ₱500 annual BIR registration fee (old Form 0605, due January 31) was abolished by the EOPT Act. Don't pay it, and keep your existing Certificate of Registration, which stays valid.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"info"},"legalBasis":["RA 11976 (EOPT), repealing NIRC Sec 236(B)","RMC 14-2024"],"confidence":"verified","notes":"Effective January 22, 2024."},{"id":"bir-micro-abatement-2026","title":"One-time penalty abatement for micro taxpayers: avail by Dec 31, 2026","desc":"Micro taxpayers (gross sales below ₱3M, per their BIR registration records as of Dec 31, 2025) can clear delinquencies, assessments and open stop-filer cases existing as of Dec 31, 2025, where the basic tax and/or penalties are ₱80,000 or less for a taxable year, by paying an abatement fee of ₱5,000 per taxable year once the application is approved. Apply at your RDO by Dec 31, 2026.","form":"per RR 4-2026","agency":"BIR","category":"admin","appliesTo":{"allOf":["business"]},"schedule":{"kind":"info"},"showUntil":"2026-12-31","legalBasis":["RR 4-2026 (issued June 18, 2026; posted June 22; effective July 7, 2026, per firm alerts)","RMC 84-2026 (questions and answers on RR 4-2026: who qualifies, documents, filing, the fee)"],"confidence":"needs_review","notes":"You can apply until December 31, 2026 (the Secretary of Finance may extend the period). If you have old open 2550Q/2551Q cases or small assessments, ask your CPA whether this clears them before the window closes. The issuance and effectivity dates come from firm alerts (Grant Thornton, KPMG), not from the BIR text itself; RMC 84-2026 and the firm alerts describe the ₱5,000 fee as per taxable year, and no extension of the Dec 31, 2026 window had been found as of November 12, 2026."},{"id":"dti-bn-renewal","title":"Renew your DTI business name every five years","desc":"Sole proprietors' business-name registration is valid for five years from registration.","form":"DTI BNRS","agency":"DTI","category":"registration","appliesTo":{"allOf":["dti"]},"schedule":{"kind":"ongoing"},"legalBasis":["RA 3883 (Business Name Law), as amended","DTI BNRS rules (DAO 18-07 lineage)"],"confidence":"verified","notes":"Renewal window: from 180 days BEFORE expiry, then 90 days after expiry penalty-free, then 90 more days (days 91–180) with a 50% surcharge on the registration fee. Miss day 180 and the registration is cancelled and the name becomes available to others. Diary your own five-year date."},{"id":"bir-crm-pos","title":"Keep CRM/POS reporting current","desc":"BIR-registered cash register and POS machines carry their own registration and reporting duties (machine registration, sales reporting where required).","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["crm-pos"]},"schedule":{"kind":"ongoing"},"legalBasis":["RR 11-2004","RMC 30-2015"],"confidence":"needs_review","notes":"Requirements vary with machine type and accreditation; confirm your unit's reporting duties with your RDO."},{"id":"bir-esales","title":"Submit the monthly eSales report (cash register / POS)","desc":"Monthly sales of each registered cash register, POS or other sales machine, reported through the BIR eSales system.","form":"eSales","agency":"BIR","category":"admin","appliesTo":{"allOf":["crm-pos"]},"schedule":{"kind":"monthly","day":8,"monthOffset":1,"calendarBasis":true},"legalBasis":["BIR tax calendar for 2026, as reproduced in the Grant Thornton and PwC tax calendars (eSales report: the 8th of the following month for TINs ending in an even number, the 10th for odd)"],"confidenc ly withheld, your employer's 1604-C filing plus your signed 2316 stand in for an annual return; nothing for you to file.","form":"—","agency":"BIR","category":"admin","appliesTo":{"allOf":["substituted-filing"]},"schedule":{"kind":"info"},"legalBasis":["RR 3-2002, as amended","RR 11-2018"],"confidence":"verified","notes":"You fall out of substituted filing if you had two or more employers during the year, your withholding was short, or you have other income to report."}]`),h1=[{obligationId:"bir-1701a-annual",rawDate:"2026-04-15",newDate:"2026-05-15",basis:"RMC 30-2026",notes:"RMC 30-2026 (EO 110 energy emergency) moved the filing and payment of the 2025 annual income tax returns from April 15 to May 15, 2026."},{obligationId:"bir-1701-annual",rawDate:"2026-04-15",newDate:"2026-05-15",basis:"RMC 30-2026",notes:"RMC 30-2026 (EO 110 energy emergency) moved the filing and payment of the 2025 annual income tax returns from April 15 to May 15, 2026."},{obligationId:"bir-1700-annual",rawDate:"2026-04-15",newDate:"2026-05-15",basis:"RMC 30-2026",notes:"RMC 30-2026 (EO 110 energy emergency) moved the filing and payment of the 2025 annual income tax returns from April 15 to May 15, 2026."},{obligationId:"bir-sawt-individual",rawDate:"2026-04-15",newDate:"2026-05-15",basis:"RMC 30-2026",notes:"RMC 30-2026 (EO 110 energy emergency) moved the filing and payment of the 2025 annual income tax returns from April 15 to May 15, 2026."},{obligationId:"bir-1702-annual",rawDate:"2026-04-15",newDate:"2026-05-15",basis:"RMC 30-2026",notes:"RMC 30-2026 (EO 110 energy emergency) moved the filing and payment of the 2025 annual income tax returns from April 15 to May 15, 2026."},{obligationId:"bir-sawt-corp-annual",rawDate:"2026-04-15",newDate:"2026-05-15",basis:"RMC 30-2026",notes:"RMC 30-2026 (EO 110 energy emergency) moved the filing and payment of the 2025 annual income tax returns from April 15 to May 15, 2026."},{obligationId:"sec-afs-calendar",rawDate:"2026-05-29",newDate:"2026-06-15" `}function H2(n){return String(n).replace(/\.csv$/,".ics")}const V2="Return attachments and the BIR eAFS system. Covers what must accompany each filing, through which channel (eAFS / eSubmission / at filing), by when, and what skipping it costs. The per-form matrix in perReturn drives the Forms page; the other blocks appear on the References register. Verified against the RMC 49-2020 → RMC 46-2026 issuance line on the date in meta.json.",Q2={value:{what:"BIR web facility (eafs.bir.gov.ph) for submitting the filed ITR, audited FS, and other required attachments as scanned PDFs",who:"Any taxpayer, regardless of filing channel (eFPS, eBIRForms, or manual)",enrollment:"Create an account with the taxpayer's TIN and an official email address; activate via the emailed link",fileFormat:"PDF only, within the per-file size limit the portal shows (published guides disagree on the figure, so check the portal; split a large group across the numbered -01, -02 … files)",proof:"System-generated Transaction Reference Number (TRN) plus the confirmation email. Keep both; they stand in for a manual 'Received' stamp"},legalBasis:["RMC 49-2020 (eAFS introduction)","RMC 82-2020 (fiscal-year & quarterly coverage)","RMC 43-2021 (revised guidelines; RPT & tax-credit groups)","RMC 34-2025 & RMC 20-2026 (eAFS as the default channel for AITR attachments)"],confidence:"verified",notes:"Introduced as an option in 2020; the annual filing RMCs now direct that AITR attachments 'shall be submitted electronically using the eAFS system'; over-the-counter submission to the LT Office/RDO/RCO is reserved for periods when a BIR advisory declares system unavailability (as happened April 2025 and May 2026)."},G2={value:{annual:[{group:"File 1: Income Tax Return",name:"EAFS<TIN>ITRTY<MM><YYYY>",contains:"The filed AITR; for e-filers, the Filing Reference Number page (eFPS) or email Tax Return Receipt Confirmation (eBIRForms), plus proof of payment"},{group:"File 2: Financial Statements",name:"EAFS<TIN>AFSTY<MM><YYYY>",contains:"Statement of Management Responsibility; the audited FS with notes and independent auditor's report plus the certificate of the BIR-accredited independent CPA (audit required above ₱3M gross annual sales); or the unaudited FS / Account Information Form for filers below the threshold"},{group:"File 3: Other Attachments",name:"EAFS<TIN>OTHTY<MM><YYYY>-01 … -99",contains:"SAWT validation report, Forms 2307/2304/2316, duly approved tax debit memos, proofs of prior years' excess credits, foreign tax credits and other tax payments, CETI, and for amended returns the previously filed return with its proof of payment"},{group:"RPT Form",name:"EAFS<TIN>RPTTY<MM><YYYY>",contains:"BIR Form 1709 (Related Party Transactions), for covered taxpayers"},{group:"Tax credit documents",name:"EAFS<TIN>TCRTY<MM><YYYY>-01 … -99",contains:"Tax credit certificates and supporting documents"}],quarterly:[{group:"File 1",name:"EAFS<TIN>ITR<Q>Q<MM><YYYY>",contains:"The filed quarterly ITR (or FRN/email confirmation for e-filers)"},{group:"File 3",name:"EAFS<TIN>OTH<Q>Q<MM><YYYY>-01 …",contains:"Scanned 2307s, SAWT confirmation, tax debit memos"}],conventions:"<TIN> = 9-digit TIN without branch code; <MM> = month-end of the taxable year (12 for calendar year); <Q> = quarter number; split oversized groups across the numbered series"},legalBasis:["RMC 49-2020","RMC 82-2020 (MMYYYY fiscal/calendar naming; quarterly groups)","RMC 43-2021 (RPT & TCR groups)"],confidence:"verified",notes:"Example for TIN 123-456-789, CY2025: EAFS123456789ITRTY122025 · EAFS123456789AFSTY122025 · EAFS123456789OTHTY122025-01. The original 2020 naming without the month (…ITRTY2019) is superseded. The portal exposes three upload slots; place RPT/TCR files under the Other Attachments slot using the RMC-prescribed filenames."},J2={value:"Attachments to e-filed income tax returns are due within 15 days from the statutory filing deadline OR from the date of actual e-filing, whichever comes LATER: April 30 for calendar-year annual returns filed on time",legalBasis:["RMC 44-2021","RMC 51-2024 (CY2023)","RMC 34-2025 (CY2024)","RMC 20-2026 (CY2025)"],confidence:"verified",notes:"The BIR's default position is that the attachment deadline is not extended, but season RMCs can override it: for CY2025, RMC 30-2026 moved filing, payment AND attachments to May 15, 2026 (EO 110 energy emergency), RMC 39-2026 made May 15 the uniform eAFS deadline regardless of when the return was e-filed, and RMC 46-2026 gave a penalty-free grace to May 25, 2026 for eAFS system issues. Manually filed returns historically carried their attachments at filing; the current annual RMCs route those through eAFS as well."},K2={value:{audited:"Gross annual sales/earnings/receipts above ₱3,000,000: books must be audited yearly by an independent CPA, and the annual ITR carries the audited FS with the auditor's report and Statement of Management Responsibility",unaudited:"At or below ₱3,000,000 on ITEMIZED deductions: financial statements still attach to the annual return, just 'not necessarily audited' by a CPA (or the Account Information Form): the audit is waived below the threshold, the FS attachment is not",none:"Individuals on the 8% option or OSD: no FS attach at all (1701A filers, and mixed-income earners on those regimes); records of gross sales/receipts must still be kept",corporations:"Corporations submit FS with the annual return even on OSD (RR 16-2008), audited only above the ₱3M gross threshold for BIR purposes. The SEC's own AFS filing separately requires an audit unless total assets or total liabilities are below ₱600,000, where FS certified under oath by the treasurer/CFO suffice (RCC Sec 177)"},legalBasis:["NIRC Sec 232, as amended by RA 10963 (TRAIN; audit threshold raised from ₱150,000 to ₱3,000,000)","BIR Form 1701/1702 guidelines (FS 'not necessarily audited' below the threshold, itemized deductions)","RR 16-2008 Sec 7 (OSD: individuals submit no FS, corporations still do)","RR 8-2018 (8% option)","Revised Corporation Code Sec 177 (SEC ₱600k treasurer-certification floor)"],confidence:"verified",notes:"The common trap: 'below ₱3M' does NOT mean 'no FS'. It means no CPA audit: itemized-deduction filers (and all corporations) still attach financial statements, unaudited, uploaded to the eAFS File 2 (AFS) group; only the 8% and OSD individual tracks skip the FS entirely. Audited FS become mandatory for BIR only when gross annual sales, earnings, receipts or output exceed ₱3,000,000 (NIRC Sec 232)."},X2={value:"Any taxpayer claiming creditable withholding (Form 2307/2304 credits) on an income tax, VAT, or percentage tax return must submit the Summary Alphalist of Withholding Taxes with that return, generated as a .dat file with the BIR data entry module and emailed to esubmission@bir.gov.ph (or attached in eFPS), due when the return itself is due",legalBasis:["RR 2-2006","RMC 3-2006"],confidence:"verified",notes:"Applies to 1701Q/1702Q, 1701/1701A/1702, 2550Q and 2551Q whenever 2307 credits are claimed. The BIR's email validation report is the proof; it is what gets uploaded to eAFS as part of File 3 for annual (and optionally quarterly) ITRs. No SAWT, and the claimed credits are exposed to disallowance."},Z2={value:"All VAT-registered taxpayers (no sales threshold) submit quarterly Summary Lists of Sales and Purchases/importations as RELIEF .dat files via eSubmission, due the 25th day after the close of the taxable quarter (30th for eFPS/LTS filers)",legalBasis:["NIRC Sec 114(C)","RR 16-2005 Sec 4.114-3, as amended by RR 1-2012"],confidence:"verified",notes:"Confirmed still required as of Aug 2026: e-invoicing/e-sales reporting under CREATE MORE (RR 11-2025) becomes mandatory for its first covered group only by Dec 31, 2026 and no issuance has retired the SLSP. Submit 'zero' lists for quarters with no transactions. Taxpayers already transmitting sales data to the EIS under RR 8-2022 are relieved of the sales list only; purchase/importation lists remain due. Penalty per unfiled list: ₱1,000 (capped ₱25,000/yr)."},eb={value:"1601-EQ and 1601-FQ carry the Quarterly Alphalist of Payees (QAP); 1604-C, 1604-E and 1604-F carry the annual employee/payee alphalists, all submitted through eSubmission (or eFPS) using the Alphalist Data Entry & Validation Module, currently v7.4 (with post-release patches)",legalBasis:["RR 11-2018","RR 1-2014 & RMC 5-2014 (alphalist is integral to the return)","RMC 15-2025 (module v7.4)"],confidence:"verified",notes:"The alphalist is an integral part of the return: a list that fails validation or doesn't conform to the format is deemed NOT received, the information return is treated as not validly filed, and the related expense deductions are at risk. QAP is due with the quarterly return (last day of the month after the quarter); annual alphalists with the 1604 series. v7.4 (RMC 15-2025) received patches in Nov 2025 and Jan 2026; re-validate .dat files after each patch; no v7.5 has issued as of Aug 2026."},tb={value:"Employers submit scanned copies of the duly signed 2316s of substituted-filing employees by February 28, accompanied by exactly two documents: the notarized sworn declaration (Annex C, RR 2-2015) and the Certification of the List of Employees Qualified for Substituted Filing (Annex F, RR 11-2018)",legalBasis:["RR 11-2013","RR 2-2015, as amended by RR 16-2021 (scanned copies)","RMC 117-2021 (one mode per period; USB in absence of DVD-R)","RMC 29-2024 (only the two annexes may be required; both signatures mandatory)"],confidence:"verified",notes:"Accepted modes: eAFS upload, DVD-R, or USB, one mode per submission period. Scans must be legible and bear BOTH employer and employee signatures (e-signatures valid per RMC 29-2021; unsigned employee copies are no longer accepted per RMC 29-2024). DVD-R/USB files are named Surname_TIN_TaxablePeriod, arranged alphabetically. The deadline occasionally moves by RMC (CY2023's was extended to March 31, 2024)."},nb={value:"BIR Form 1709 (Related Party Transactions) attaches to the annual ITR only for: (a) large taxpayers; (b) taxpayers enjoying incentives (ITH or preferential rate); (c) taxpayers reporting net operating losses for the current and two immediately preceding years; (d) related parties transacting with any of them",legalBasis:["RR 34-2020","RMC 54-2021","RMC 43-2021 & RMC 44-2021 (filing via eAFS RPT group or manually)"],confidence:"verified",notes:"Everyone else is exempt. Separate, higher thresholds trigger Transfer Pricing Documentation (kept on hand, not filed): gross sales > ₱150M AND total RPTs > ₱90M, or per-category RPTs above ₱60M (tangible goods) / ₱15M (services, interest, intangibles), or TPD was required the prior year."},rb={value:"Registered business enterprises claiming ITH, 5% SCIT, or enhanced deductions must secure the Certificate of Entitlement to Tax Incentives from their IPA (PEZA/BOI/etc.) before filing the annual ITR and attach it (eAFS Other Attachments group)",legalBasis:["RMC 28-2022","RMC 42-2026 (May 7, 2026 clarification on CETI submission with the AITR)","FIRB Advisory 004-2022","RA 11534 (CREATE)"],confidence:"verified",notes:"Without the CETI the incentive claim on the return is at risk. Relevant to 1702-MX/1702-EX filers and BOI-registered individuals."},ab={value:"AFS submitted through eAFS need no BIR 'Received' stamping; the TRN and confirmation email are the proof. For attachments submitted manually, the 'RECEIVED' stamp goes on three pages only: the auditor's report, the balance sheet, and the income statement",legalBasis:["RMC 49-2020 & RMC 82-2020 (TRN in lieu of stamp)","RMC 51-2024 / RMC 34-2025 (three-page stamping rule)"],confidence:"verified",notes:"Downstream, the SEC (eFAST) accepts the eAFS TRN/Confirmation Receipt in place of a BIR-stamped AFS."},ob={value:{standard:"₱1,000 per failure to file an information return, statement, list, or attachment, with an aggregate cap of ₱25,000 per calendar year (NIRC Sec 250)",microSmall:"₱500 per failure,
